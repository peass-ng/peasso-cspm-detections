title: Amazon Keyspaces Credential Created For Another IAM User
id: 6839445c-27c1-4c25-9186-02f0b6598837
status: experimental
description: >
  A successful IAM management API write returned an active Cassandra
  service-specific credential for another IAM user. This confirms the
  credential was created, not that it was used or created maliciously.
x_hacktricks_technique_id: aws-keyspaces-other-user-service-credential
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: CreateServiceSpecificCredential
    event.outcome: success
    request.service_name: cassandra.amazonaws.com
    request.other_user_keyspaces_credential_created: true
  condition: selection
level: medium
falsepositives:
  - An administrator deliberately created or rotated a Keyspaces credential for another IAM user.
