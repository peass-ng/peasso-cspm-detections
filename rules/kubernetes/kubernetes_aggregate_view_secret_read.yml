title: Kubernetes ClusterRole accepted with Secret reads aggregated to view
id: 164b656b-f269-4a4e-9d22-d6bb6e4364d8
status: experimental
description: >-
  The API accepted a new ClusterRole labelled to aggregate into view and
  containing namespace-wide Secret read verbs. This does not prove the
  aggregation controller reconciled view, an existing binding gained access,
  a Secret was read, or malicious intent.
x_hacktricks_technique_id: kubernetes-rbac-aggregate-to-view-secret-read
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md#bindings-and-aggregated-clusterroles
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    event.source: kubernetes.audit
    event.name: create
    event.outcome: success
    rbac.aggregate_to_view_secret_read_role_accepted: true
    rbac.change_effect: admitted_role_spec
  condition: selection
falsepositives:
  - An explicitly approved change to the view role's aggregate rules
level: high
