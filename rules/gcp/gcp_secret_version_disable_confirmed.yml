title: Secret Manager version disabled
id: 7d6e5fc2-4253-5c19-82a4-8073bf78a461
status: experimental
description: A successful DisableSecretVersion response reported DISABLED for one version. The entry does not prove a workload outage or malicious intent.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-secretmanager-post-exploitation.md
  - https://docs.cloud.google.com/secret-manager/docs/audit-logging
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: secretmanager.googleapis.com
    event.name: google.cloud.secretmanager.v1.SecretManagerService.DisableSecretVersion
    event.outcome: success
    secret.version_state: DISABLED
  condition: selection
falsepositives:
  - Approved secret rotation, incident response, or temporary access suspension.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: gcp-secret-version-disable-confirmed
