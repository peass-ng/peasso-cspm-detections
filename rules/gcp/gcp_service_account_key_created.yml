title: Service account credential key creation confirmed
id: 6b60f838-3892-47b9-878b-537a14735da8
status: experimental
description: Cloud Audit Logs reports successful creation of a service account key, with an explicit OK status or a returned key resource. This is a credential exposure and persistence risk; authorization and later key use need separate review.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-iam-privesc.md
  - https://docs.cloud.google.com/iam/docs/audit-logging/examples-service-accounts
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: iam.googleapis.com
    event.name: google.iam.admin.v1.CreateServiceAccountKey
    event.outcome: success
    credential.effect_confirmed: true
  condition: selection
falsepositives:
  - Approved service account key rotation
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: gcp-iam-serviceaccountkeys-create
