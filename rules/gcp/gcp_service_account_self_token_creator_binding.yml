title: Principal added its own Token Creator binding to a service account
id: 857fa891-716e-474a-a3ed-e82fd9ca85ad
status: experimental
description: A successful service-account SetIAMPolicy audit record contains an ADD policy delta for an unconditional Token Creator binding to the caller, and the resulting service-account policy contains the same binding. This records a grant, but does not prove malicious intent or newly effective access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-iam-privesc.md
  - https://docs.cloud.google.com/iam/docs/audit-logging/examples-service-accounts
  - https://docs.cloud.google.com/iam/docs/reference/rest/v1/projects.serviceAccounts/setIamPolicy
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: iam.googleapis.com
    event.name: service_account_token_creator_self_binding_observed
    event.outcome: success
    request.actor_is_member: true
    request.binding_observed: true
    request.binding_added: true
    request.role: roles/iam.serviceAccountTokenCreator
  condition: selection
falsepositives:
  - Approved service-account access grant to the caller
level: medium
tags:
  - attack.privilege_escalation
  - attack.persistence
x_hacktricks_technique_id: gcp-iam-serviceaccounts-setiampolicy
