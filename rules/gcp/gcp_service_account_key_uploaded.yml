title: User-provided service account public key upload completed
id: 596a1612-77d6-44a5-8e38-942419fe289e
status: experimental
description: A successful IAM UploadServiceAccountKey Audit Log response returned a user-provided key resource for a service account in the selected project. This records a durable credential setup; it does not prove that the private key was used or that the action was unauthorized.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-privilege-escalation/gcp-iam-privesc.md
  - https://docs.cloud.google.com/iam/docs/audit-logging
  - https://docs.cloud.google.com/iam/docs/reference/rest/v1/projects.serviceAccounts.keys/upload
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: iam.googleapis.com
    event.name: google.iam.admin.v1.UploadServiceAccountKey
    event.outcome: success
    credential.key_origin: USER_PROVIDED
    credential.upload_observed: true
  condition: selection
falsepositives:
  - Approved service account key import or migration
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: gcp-iam-serviceaccountkeys-create
