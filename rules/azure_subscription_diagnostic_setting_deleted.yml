title: Azure subscription Activity Log export setting deleted
id: 52d31b0a-9a65-4546-afac-a26543d2218d
status: experimental
description: A successful Administrative Activity Log record reports deletion of a diagnostic setting directly on the subscription. This can interrupt one Activity Log export route, but it does not prove that the platform Activity Log stopped or that no other export setting exists.
references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/fundamentals/activity-log-schema
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/azure-security/az-post-exploitation/az-monitor-post-exploitation.md
logsource:
  product: azure
  service: activity
detection:
  selection:
    event.source: azure.activity
    event.name: subscription_diagnostic_setting_delete
    event.outcome: success
    scope.type: subscription
    request.subscription_activity_export_setting_deleted: true
  condition: selection
falsepositives:
  - Approved migration to another verified Activity Log export destination
level: high
tags:
  - attack.defense_evasion
x_hacktricks_technique_id: azure-subscription-activity-export-setting-deleted
