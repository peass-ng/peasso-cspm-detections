title: Assumed role wrote an unconditional administrator inline policy to itself
id: a74e35c1-768e-4512-8e83-05b8d3187060
status: experimental
description: A successful IAM PutRolePolicy call from an assumed role wrote an inline policy on its own issuing role with an unconditional Allow for every action and resource. This records the policy write, not effective permissions or malicious intent; boundaries and SCPs may restrict access.
references:
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_PutRolePolicy.html
  - https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-user-identity.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: PutRolePolicy
    event.outcome: success
    actor.kind: AssumedRole
    request.self_role: true
    request.unconditional_admin_grant: true
  condition: selection
falsepositives:
  - Approved role self administration or emergency maintenance
level: high
tags:
  - attack.privilege_escalation
  - attack.persistence
x_hacktricks_technique_id: aws-iam-putrolepolicy-self
