title: Cluster administrator binding created for a workload service account
id: 57d0ee9a-cdc8-4bdb-a04c-e6734128bf73
status: experimental
description: A completed Kubernetes create returned a ClusterRoleBinding that grants cluster-admin to a service account outside the system namespaces. The result proves a privileged grant, not that the actor was malicious.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/rbac-and-identities.md
  - https://kubernetes.io/docs/tasks/debug/debug-cluster/audit/
  - https://kubernetes.io/docs/reference/access-authn-authz/rbac/
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    event.source: kubernetes.audit
    event.name: create
    event.outcome: success
    rbac.role: cluster-admin
    rbac.binding_kind: ClusterRoleBinding
    rbac.non_system_service_account: true
  condition: selection
falsepositives:
  - Approved workload bootstrap or emergency cluster administration
level: high
tags:
  - attack.privilege_escalation
  - attack.persistence
x_hacktricks_technique_id: k8s-rbac-bind-clusterrolebinding-cluster-admin
