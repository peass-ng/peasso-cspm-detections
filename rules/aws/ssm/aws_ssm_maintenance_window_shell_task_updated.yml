title: SSM Maintenance Window shell task updated
id: 41100000-0000-4000-8000-000000000001
status: experimental
description: >
  An accepted update targeted an existing Maintenance Window
  task whose resulting document is AWS-RunShellScript. CloudTrail omits the task
  invocation parameters, so this does not reveal the command, whether it changed,
  or whether the window ran.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ssm-privesc/README.md#L525
  - https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_UpdateMaintenanceWindowTask.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ssm.amazonaws.com
    event.name: UpdateMaintenanceWindowTask
    event.outcome: success
    request.ssm_window_shell_task_updated: true
  condition: selection
falsepositives:
  - Approved changes to a Maintenance Window Run Command task.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-ssm-window-shell-task-updated
