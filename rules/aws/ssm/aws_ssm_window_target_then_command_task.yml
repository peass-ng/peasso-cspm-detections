title: AWS SSM Maintenance Window target followed by command task
id: ae5c2fa7-4a09-4bbf-8b5b-c09929198272
status: experimental
description: The same actor registered a Maintenance Window target and a RUN_COMMAND task using its target ID within ten minutes. This schedules a command document but does not prove the task ran or any node matched.
x_hacktricks_technique_id: aws-ssm-window-target-then-command-task
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ssm-privesc/README.md#L486
- https://docs.aws.amazon.com/systems-manager/latest/APIReference/API_RegisterTaskWithMaintenanceWindow.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ssm.amazonaws.com
    event.name: RegisterTaskWithMaintenanceWindow
    event.outcome: success
    request.ssm_window_target_then_command_task: true
  condition: selection
level: medium
falsepositives:
- Approved Maintenance Window configuration
