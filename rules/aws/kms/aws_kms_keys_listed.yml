title: KMS keys listed
id: 20300000-0000-4000-8000-000000000007
status: experimental
description: >
  A principal listed KMS keys in a Region. This is low-confidence key inventory activity; returned keys are omitted from CloudTrail.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-kms-enum.md#L130
  - https://docs.aws.amazon.com/kms/latest/APIReference/API_ListKeys.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kms.amazonaws.com
    event.name: ListKeys
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved KMS inventory or key administration.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-kms-keys-listed
x_cloudtrail_raw: true
