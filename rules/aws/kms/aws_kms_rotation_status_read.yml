title: KMS key rotation status read
id: 20300000-0000-4000-8000-000000000005
status: experimental
description: >
  A principal read the rotation status of a KMS key. This is low-confidence key configuration discovery.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-kms-enum.md#L130
  - https://docs.aws.amazon.com/kms/latest/APIReference/API_GetKeyRotationStatus.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kms.amazonaws.com
    event.name: GetKeyRotationStatus
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::KMS::Key
  condition: selection
falsepositives:
  - Approved KMS inventory or key administration.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-kms-rotation-status-read
x_cloudtrail_raw: true
