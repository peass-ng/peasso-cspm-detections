title: KMS asymmetric shared secret derived
id: 31000000-0000-4000-8000-000000000006
status: experimental
description: >
  DeriveSharedSecret succeeded with a key-agreement KMS key. Investigate the
  caller and peer public key; CloudTrail does not expose the returned secret
  or establish how it was subsequently used.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kms-post-exploitation/README.md#L17
  - https://docs.aws.amazon.com/kms/latest/APIReference/API_DeriveSharedSecret.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kms.amazonaws.com
    event.name: DeriveSharedSecret
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::KMS::Key
  condition: selection
falsepositives:
  - Approved ECDH key agreement by an application.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-kms-shared-secret-derived
x_cloudtrail_raw: true
