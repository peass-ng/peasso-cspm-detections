title: Amplify app updated
id: 15800000-0000-4000-8000-000000000005
status: experimental
description: >
  A successful UpdateApp changed an Amplify app. Review environment variables, build specification and roles against approved state. This event-only signal cannot determine which field changed or prove build-time code execution.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-amplify-privesc/README.md#L125
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: amplify.amazonaws.com
    event.name: UpdateApp
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved application maintenance.
level: low
tags:
  - attack.execution
x_hacktricks_technique_id: aws-amplify-app-updated
x_cloudtrail_raw: true
