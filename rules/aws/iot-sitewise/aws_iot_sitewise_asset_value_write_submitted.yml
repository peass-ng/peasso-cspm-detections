title: IoT SiteWise asset property value write submitted
id: 21600000-0000-4000-8000-000000000002
status: experimental
description: >
  An accepted BatchPutAssetPropertyValue submitted one or more SiteWise asset
  property values. CloudTrail data events must be enabled for the asset.
  This envelope does not prove every batch entry succeeded; inspect
  errorEntries and compare values with approved telemetry producers.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-sitewise-post-exploitation/README.md
  - https://docs.aws.amazon.com/iot-sitewise/latest/userguide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotsitewise.amazonaws.com
    event.name: BatchPutAssetPropertyValue
    event.category: Data
    event.outcome: success
    event.read_only: false
    resource.type: AWS::IoTSiteWise::Asset
  condition: selection
falsepositives:
  - Approved telemetry ingestion by registered producers.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-iot-sitewise-asset-property-value-write-submitted
x_cloudtrail_raw: true
