title: ECR repository creation template grants wildcard image read
id: 90f0b66d-d854-4b89-b0cd-d6f5d4c385ee
status: experimental
description: >
  A successful create or update of an ECR repository creation template
  configured a wildcard principal for BatchGetImage and GetDownloadUrlForLayer.
  This is a standing grant for future matching repositories; the event does
  not prove that a repository was created or read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-persistence/aws-ecr-persistence/README.md#L34
  - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_CreateRepositoryCreationTemplate.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name:
      - CreateRepositoryCreationTemplate
      - UpdateRepositoryCreationTemplate
    event.outcome: success
    request.ecr_template_wildcard_read_grant: true
  condition: selection
falsepositives:
  - Approved image-sharing policy for repositories created under the prefix.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-ecr-template-wildcard-image-read
