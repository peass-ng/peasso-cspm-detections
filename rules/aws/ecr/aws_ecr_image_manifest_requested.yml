title: ECR image manifest requested
id: 2a4a8e7c-0741-4e11-abde-d51548fe214c
status: experimental
description: A successful BatchGetImage request named a repository and image. CloudTrail omitted the manifest response; this event alone does not prove image contents were retrieved.
x_hacktricks_technique_id: aws-tech-0286780459ed4382
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ecr-privesc/README.md#L13
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name: BatchGetImage
    event.outcome: success
    request.ecr_image_manifest_requested: true
  condition: selection
level: low
falsepositives:
- Authorized workload or build image pull.
