title: ECR private image pushed after a new layer upload
id: 8bdc2d55-d0fe-4f95-9d3a-c84e62c199a0
status: experimental
description: A successful PutImage followed a successful upload of a layer in the same private repository by the same actor within one hour. Review publisher identity and approved release window; the event does not prove a workload consumed the image.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ecr-privesc/README.md#L42
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name: PutImage
    event.outcome: success
    request.ecr_private_new_layer_image_pushed: true
  condition: selection
falsepositives:
  - Approved image publishing by CI
level: medium
tags:
  - attack.execution
x_hacktricks_technique_id: aws-tech-1c3d1e76a04905f5
