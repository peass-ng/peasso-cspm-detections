title: ECR repository scan on push explicitly disabled
id: e6965942-09a2-445a-8bd8-61b4bb69db9e
status: experimental
description: >
  A successful PutImageScanningConfiguration call set scanOnPush to false.
  Registry-level scanning can override the effective behavior, and this
  legacy API is being deprecated.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ecr-post-exploitation/README.md#L334
  - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_PutImageScanningConfiguration.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name: PutImageScanningConfiguration
    event.outcome: success
    request.ecr_scan_on_push_disabled: true
  condition: selection
falsepositives:
  - Approved repository setting under registry-level scanning controls.
level: medium
tags:
  - attack.defense_evasion
x_hacktricks_technique_id: aws-ecr-scan-on-push-disabled
