title: ECR pull through cache upstream secret metadata read
id: 18500000-0000-4000-8000-000000000001
status: experimental
description: >
  DescribeSecret read metadata for a Secrets Manager secret under the mandatory
  ecr-pullthroughcache/ prefix. This can precede a credential read, but the
  metadata request itself does not return the secret value. Compare the actor
  with approved ECR and secret administration activity.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ecr-post-exploitation/README.md#L55
  - https://docs.aws.amazon.com/AmazonECR/latest/userguide/pull-through-cache.html
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/monitoring-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: DescribeSecret
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::SecretsManager::Secret
    resource.path_scope_checked: true
  condition: selection
falsepositives:
  - Approved ECR pull through cache maintenance.
  - Authorized secret inventory or rotation.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-ecr-pullthrough-cache-secret-metadata-read
x_cloudtrail_raw: true
x_cloudtrail_resource_path_prefix: secret:ecr-pullthroughcache/
