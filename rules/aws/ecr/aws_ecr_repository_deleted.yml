title: ECR private repository deletion accepted
id: 7bfa10d6-a28c-410b-8a4b-8a63e0d83fb5
status: experimental
description: A successful DeleteRepository request returned the exact repository. The event does not prove the repository held images or that deletion was unauthorized.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ecr-post-exploitation/README.md#L405
  - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_DeleteRepository.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name: DeleteRepository
    event.outcome: success
    request.ecr_repository_delete_accepted: true
  condition: selection
falsepositives:
  - Approved repository retirement or test cleanup
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-ecr-repository-deleted
