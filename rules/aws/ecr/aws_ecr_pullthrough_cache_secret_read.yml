title: ECR pull through cache upstream secret read
id: 18400000-0000-4000-8000-000000000001
status: experimental
description: >
  GetSecretValue read a Secrets Manager secret under the mandatory
  ecr-pullthroughcache/ prefix. The call may expose credentials for an
  authenticated upstream registry. Compare the actor with the approved ECR
  service role and secret access baseline; CloudTrail omits the secret value.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ecr-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/AmazonECR/latest/userguide/pull-through-cache.html
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/cloudtrail_log_entries.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: GetSecretValue
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::SecretsManager::Secret
    resource.path_scope_checked: true
  condition: selection
falsepositives:
  - Approved ECR pull through cache refresh through its service role.
  - Authorized upstream registry credential rotation or audit.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-ecr-pullthrough-cache-upstream-secret-read
x_cloudtrail_raw: true
x_cloudtrail_resource_path_prefix: secret:ecr-pullthroughcache/
