title: ECR repository policy grants image reads to a wildcard principal
id: 3f3c7b04-4368-4849-a7b6-b003d0cadf2d
status: experimental
description: >
  A successful SetRepositoryPolicy call allowed a wildcard principal both
  BatchGetImage and GetDownloadUrlForLayer. The event proves the policy grant;
  it does not prove any image was present or read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-ecr-privesc/README.md#L106
  - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_SetRepositoryPolicy.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name: SetRepositoryPolicy
    event.outcome: success
    request.ecr_wildcard_image_read_grant: true
  condition: selection
falsepositives:
  - Approved image sharing where broad principals are intentional.
level: high
tags:
  - attack.collection
x_hacktricks_technique_id: aws-ecr-wildcard-image-read-policy
