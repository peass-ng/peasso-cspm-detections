title: ECR replication configured to another AWS account
id: e35ce82d-53a7-4e7a-8cf3-bc0df66d6128
status: experimental
description: >
  A successful registry replication configuration includes a destination
  registry ID different from the source account. Confirm whether the
  destination is approved and whether any images were subsequently copied.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-ecr-persistence/README.md#L193
  - https://docs.aws.amazon.com/AmazonECR/latest/APIReference/API_PutReplicationConfiguration.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ecr.amazonaws.com
    event.name: PutReplicationConfiguration
    event.outcome: success
    request.ecr_external_replication: true
  condition: selection
falsepositives:
  - Approved replication to a backup or partner AWS account.
level: medium
tags:
  - attack.exfiltration
  - attack.persistence
x_hacktricks_technique_id: aws-ecr-external-registry-replication
