title: CodeConnections repository links listed
id: 12800000-0000-4000-8000-000000000005
status: experimental
description: >
  ListRepositoryLinks queried repository-link trust metadata. The CloudTrail response was omitted.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codeconnections-post-exploitation/README.md#L23
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codeconnections.amazonaws.com
    event.name: CodeConnectionsRepositoryLinksListed
    event.outcome: success
    request.codeconnections_repository_links_listed: true
  condition: selection
falsepositives:
  - Authorized Git-sync inventory.
level: medium
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-codeconnections-repository-links-listed
