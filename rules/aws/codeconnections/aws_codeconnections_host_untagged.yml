title: CodeConnections host untagged
id: 12900000-0000-4000-8000-000000000005
status: experimental
description: >
  UntagResource removed one or more host tags. The event alone does not prove any authorization effect.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codeconnections-post-exploitation/README.md#L80
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codeconnections.amazonaws.com
    event.name: CodeConnectionsHostUntagged
    event.outcome: success
    request.codeconnections_host_untagged: true
  condition: selection
falsepositives:
  - Approved host tagging cleanup.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-codeconnections-host-untagged
