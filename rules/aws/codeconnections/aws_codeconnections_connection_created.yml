title: CodeConnections connection created
id: 12800000-0000-4000-8000-000000000001
status: experimental
description: >
  CreateConnection accepted a new third-party connection resource. An SDK-created connection remains pending until an external provider handshake; this event does not prove repository access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codeconnections-post-exploitation/README.md#L54
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codeconnections.amazonaws.com
    event.name: CodeConnectionsConnectionCreated
    event.outcome: success
    request.codeconnections_connection_created: true
  condition: selection
falsepositives:
  - Approved connection provisioning.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-codeconnections-connection-created
