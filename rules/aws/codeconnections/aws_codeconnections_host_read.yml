title: CodeConnections host read
id: 12900000-0000-4000-8000-000000000002
status: experimental
description: >
  GetHost requested one CodeConnections host. CloudTrail omitted the returned endpoint and status metadata.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codeconnections-post-exploitation/README.md#L23
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codeconnections.amazonaws.com
    event.name: CodeConnectionsHostRead
    event.outcome: success
    request.codeconnections_host_read: true
  condition: selection
falsepositives:
  - Authorized source-control host inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-codeconnections-host-read
