  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codeconnections.amazonaws.com
    event.name: CodeConnectionsConnectionRead
    event.outcome: success
    request.codeconnections_connection_read: true
  condition: selection
falsepositives:
  - Authorized connection inventory or troubleshooting.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-codeconnections-connection-read
