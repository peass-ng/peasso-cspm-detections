title: CodeConnections connection deleted
id: 12800000-0000-4000-8000-000000000009
status: experimental
description: >
  DeleteConnection removed a connection resource. A downstream integration impact depends on whether the connection was in use.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codeconnections-post-exploitation/README.md#L54
  - https://docs.aws.amazon.com/codeconnections/latest/APIReference/API_DeleteConnection.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codeconnections.amazonaws.com
    event.name: CodeConnectionsConnectionDeleted
    event.outcome: success
    request.codeconnections_connection_deleted: true
  condition: selection
falsepositives:
  - Approved retirement of an unused connection.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-codeconnections-connection-deleted
