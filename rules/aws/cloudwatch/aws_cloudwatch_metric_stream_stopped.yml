title: AWS CloudWatch metric stream stopped
id: 65124f0e-bdee-409b-afda-6e13bd150183
status: experimental
description: A principal successfully requested a Metric Stream to stop. The management event does not prove how much metric data was missed while it was stopped.
x_hacktricks_technique_id: aws-cloudwatch-metric-stream-stopped
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-cloudwatch-post-exploitation/README.md#L434
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: monitoring.amazonaws.com
    event.name: StopMetricStreams
    event.outcome: success
    request.cloudwatch_metric_stream_stopped: true
  condition: selection
level: medium
falsepositives:
  - Approved maintenance pause
