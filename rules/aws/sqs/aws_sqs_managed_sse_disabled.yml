title: AWS SQS managed encryption disabled
id: b2779a79-ee69-4132-a4fe-5ac26d3f00fe
status: experimental
description: SetQueueAttributes accepted SqsManagedSseEnabled=false on a queue. Check
  effective KMS configuration and encryption requirements before assessing exposure.
x_hacktricks_technique_id: aws-sqs-managed-sse-disabled
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sqs-post-exploitation/README.md#L53
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sqs.amazonaws.com
    event.name: SetQueueAttributes
    event.outcome: success
    request.sqs_managed_sse_disabled: true
  condition: selection
level: medium
falsepositives:
- Approved queue encryption migration
