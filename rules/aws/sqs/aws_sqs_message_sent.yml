title: SQS message sent
id: 25800000-0000-4000-8000-000000000001
status: experimental
description: >
  A principal submitted a message to a queue. Review producers outside the approved application roles; CloudTrail hides the message body, so this event does not prove malicious content.
  Requires opt-in CloudTrail data events for the queue or topic.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sqs-post-exploitation/README.md
  - https://docs.aws.amazon.com/en_gb/AWSSimpleQueueService/latest/SQSDeveloperGuide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sqs.amazonaws.com
    event.name: SendMessage
    event.category: Data
    event.outcome: success
    event.read_only: false
    resource.type: AWS::SQS::Queue
  condition: selection
falsepositives:
  - Approved application producer.
level: low
tags:
  - attack.execution
x_hacktricks_technique_id: aws-sqs-message-sent
x_cloudtrail_raw: true
