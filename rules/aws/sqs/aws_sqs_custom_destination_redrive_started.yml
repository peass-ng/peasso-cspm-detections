title: AWS SQS DLQ move task started with custom destination
id: af4cc1d2-c203-4af2-a3ac-2f28172c870e
status: experimental
description: A successful StartMessageMoveTask names a different same-account destination queue. The event proves the move task was accepted, not that messages arrived or were read.
x_hacktricks_technique_id: aws-sqs-dlq-redrive-exfiltration
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sqs-post-exploitation/aws-sqs-dlq-redrive-exfiltration.md
  - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_StartMessageMoveTask.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sqs.amazonaws.com
    event.name: StartMessageMoveTask
    event.outcome: success
    request.sqs_custom_redrive_started: true
  condition: selection
level: medium
falsepositives:
  - Approved recovery into a replacement queue
