title: AWS SQS queue policy grants org-scoped wildcard message receive
id: 80b91829-2a86-4ed6-840f-8b77f0414a14
status: experimental
description: An accepted queue policy contains an Allow statement with wildcard principal, a PrincipalOrgID condition and ReceiveMessage on the queue. This is broader than named principals but does not prove cross-account use.
x_hacktricks_technique_id: aws-sqs-orgid-policy-backdoor
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-sqs-persistence/aws-sqs-orgid-policy-backdoor.md
  - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sqs.amazonaws.com
    event.name: SetQueueAttributes
    event.outcome: success
    request.sqs_org_wildcard_receive_grant: true
  condition: selection
level: medium
falsepositives:
  - Approved organization-wide queue integration
