title: AWS SQS source queue configured to redrive after one receive
id: edb11f26-6c42-4fad-9a56-14470389e9de
status: experimental
description: An accepted queue attribute change points a source queue to a same-account DLQ with maxReceiveCount one. This can route failed messages after one receive; destination ownership and intent need review.
x_hacktricks_technique_id: aws-sqs-dlq-backdoor-max-receive-one
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-sqs-persistence/aws-sqs-dlq-backdoor-persistence.md
  - https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_SetQueueAttributes.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sqs.amazonaws.com
    event.name: SetQueueAttributes
    event.outcome: success
    request.sqs_redrive_max_one: true
  condition: selection
level: medium
falsepositives:
  - Approved DLQ configuration with a one-attempt retry threshold
