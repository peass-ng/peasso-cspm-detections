title: SQS message batch deleted
id: 25800000-0000-4000-8000-000000000006
status: experimental
description: >
  A principal acknowledged and removed a batch of queued messages. Review unexpected consumers; the event does not establish whether messages were processed.
  Requires opt-in CloudTrail data events for the queue or topic.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sqs-post-exploitation/README.md
  - https://docs.aws.amazon.com/en_gb/AWSSimpleQueueService/latest/SQSDeveloperGuide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sqs.amazonaws.com
    event.name: DeleteMessageBatch
    event.category: Data
    event.outcome: success
    event.read_only: false
    resource.type: AWS::SQS::Queue
  condition: selection
falsepositives:
  - Approved consumer batch acknowledgement.
level: low
tags:
  - attack.impact
x_hacktricks_technique_id: aws-sqs-message-batch-deleted
x_cloudtrail_raw: true
