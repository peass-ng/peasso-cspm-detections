title: AWS EMR cluster configuration and node inventory sweep
id: b3930000-0000-4000-8000-000000000001
status: experimental
description: >
  One actor successfully read a cluster's configuration, instance inventory,
  and bootstrap actions within fifteen minutes. This may map topology, roles,
  node addresses, and bootstrap script paths. CloudTrail does not include the
  response bodies, so this signal does not prove any particular data was
  returned or accessed afterward.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-emr-post-exploitation/README.md#L55
  - https://docs.aws.amazon.com/emr/latest/ManagementGuide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: elasticmapreduce.amazonaws.com
    event.name: EmrClusterInventorySweep
    event.outcome: success
    request.emr_cluster_inventory_sweep: true
  condition: selection
falsepositives:
  - Approved cluster troubleshooting or inventory collection by an EMR operator.
level: medium
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-emr-cluster-inventory-sweep
