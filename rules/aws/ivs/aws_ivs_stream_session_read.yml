title: IVS stream session read
id: f9a00b15-0000-4000-8000-000000000007
status: experimental
description: >
  GetStreamSession queried detailed channel stream history. The event does not disclose the returned record.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L52
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsStreamSessionRead
    event.outcome: success
    request.ivs_stream_session_read: true
  condition: selection
falsepositives:
  - Approved IVS broadcasting or viewer administration.
level: low
tags:
  - attack.collection
x_hacktricks_technique_id: aws-ivs-stream-session-read
