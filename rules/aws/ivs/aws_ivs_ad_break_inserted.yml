title: IVS live ad break inserted
id: f9a00b19-0000-4000-8000-000000000007
status: experimental
description: >
  InsertAdBreak accepted an ad break in a live IVS channel. This does not prove a viewer received an ad.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L120
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsAdBreakInserted
    event.outcome: success
    request.ivs_ad_break_inserted: true
  condition: selection
falsepositives:
  - Approved IVS or MediaTailor ad administration.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-ivs-ad-break-inserted
