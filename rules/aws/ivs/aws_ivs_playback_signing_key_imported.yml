title: IVS playback signing key imported
id: f9a00b14-0000-4000-8000-000000000007
status: experimental
description: >
  ImportPlaybackKeyPair established private-playback signing trust. The event does not prove tokens or playlists were used.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-ivs-persistence/README.md#L47
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsPlaybackSigningKeyImported
    event.outcome: success
    request.ivs_playback_signing_key_imported: true
  condition: selection
falsepositives:
  - Approved IVS administration or media operations.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-ivs-playback-signing-key-imported
