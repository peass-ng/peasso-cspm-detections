title: IVS participant details read
id: f9a00b18-0000-4000-8000-000000000004
status: experimental
description: >
  GetParticipant queried one participant's stage-session details. CloudTrail omits the returned record.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L52
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsParticipantRead
    event.outcome: success
    request.ivs_participant_read: true
  condition: selection
falsepositives:
  - Approved IVS support, investigation or stage administration.
level: low
tags:
  - attack.collection
x_hacktricks_technique_id: aws-ivs-participant-read
