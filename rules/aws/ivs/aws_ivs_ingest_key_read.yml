title: IVS reusable ingest key read
id: f9a00b14-0000-4000-8000-000000000004
status: experimental
description: >
  GetIngestConfiguration returns a reusable real-time publishing key. CloudTrail omits its response, so this signal proves only the successful read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsIngestKeyRead
    event.outcome: success
    request.ivs_ingest_key_read: true
  condition: selection
falsepositives:
  - Approved IVS administration or media operations.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-ivs-ingest-key-read
