title: IVS viewer session revocation started
id: f9a00b15-0000-4000-8000-000000000008
status: experimental
description: >
  StartViewerSessionRevocation accepted a viewer ID for revocation. The event alone does not prove any viewer was connected or expelled.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L120
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsViewerSessionRevocationStarted
    event.outcome: success
    request.ivs_viewer_revocation_started: true
  condition: selection
falsepositives:
  - Approved IVS broadcasting or viewer administration.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-ivs-viewer-revocation-started
