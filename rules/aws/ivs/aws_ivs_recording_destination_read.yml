title: IVS channel recording destination read
id: f9a00b16-0000-4000-8000-000000000002
status: experimental
description: >
  GetRecordingConfiguration queried a channel recording destination. The CloudTrail response omits destination details.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsRecordingDestinationRead
    event.outcome: success
    request.ivs_recording_destination_read: true
  condition: selection
falsepositives:
  - Approved IVS recording administration.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-ivs-recording-destination-read
