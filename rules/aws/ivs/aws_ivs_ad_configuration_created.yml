title: IVS ad configuration created
id: f9a00b19-0000-4000-8000-000000000003
status: experimental
description: >
  CreateAdConfiguration associated MediaTailor playback configurations with IVS. It does not prove a channel was changed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ivs-post-exploitation/README.md#L120
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsAdConfigurationCreated
    event.outcome: success
    request.ivs_ad_configuration_created: true
  condition: selection
falsepositives:
  - Approved IVS or MediaTailor ad administration.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-ivs-ad-configuration-created
