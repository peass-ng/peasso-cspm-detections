  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ivs.amazonaws.com
    event.name: IvsChannelAdConfigurationAssigned
    event.outcome: success
    request.ivs_channel_ad_configuration_assigned: true
  condition: selection
falsepositives:
  - Approved IVS or MediaTailor ad administration.
level: high
tags:
  - attack.persistence
