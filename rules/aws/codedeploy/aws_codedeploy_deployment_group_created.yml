logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codedeploy.amazonaws.com
    event.name: CreateDeploymentGroup
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved CodeDeploy deployment group onboarding.
level: medium
tags:
- attack.privilege-escalation
