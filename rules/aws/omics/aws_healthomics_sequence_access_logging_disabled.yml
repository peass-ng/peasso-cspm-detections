title: HealthOmics sequence-store access logging disabled
id: 41700000-0000-4000-8000-000000000001
status: experimental
description: An accepted UpdateSequenceStore request explicitly blanked the S3 access-log
  location, and the response did not retain one. The disposable lab independently
  read the disabled configuration.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-healthomics-post-exploitation/README.md#L83
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: omics.amazonaws.com
    event.name: UpdateSequenceStore
    event.outcome: success
    request.healthomics_access_logging_disabled: true
  condition: selection
falsepositives:
- Approved logging migration or lab cleanup.
level: medium
tags:
- attack.defense-evasion
x_hacktricks_technique_id: aws-healthomics-sequence-access-logging-disabled
