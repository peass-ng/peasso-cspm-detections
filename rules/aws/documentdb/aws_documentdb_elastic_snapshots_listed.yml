title: DocumentDB Elastic snapshots listed
id: 19000000-0000-4000-8000-000000000007
status: experimental
description: >
  A principal listed DocumentDB Elastic snapshots. Snapshot inventory can precede targeted copy or restore activity; the event does not show returned snapshots.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-documentdb-enum/README.md
  - https://docs.aws.amazon.com/documentdb/latest/devguide/elastic-manage-snapshots.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: docdb-elastic.amazonaws.com
    event.name: ListClusterSnapshots
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved database backup inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-documentdb-elastic-snapshots-listed
x_cloudtrail_raw: true
