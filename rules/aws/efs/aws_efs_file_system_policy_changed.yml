title: EFS file system client policy changed
id: 24800000-0000-4000-8000-000000000001
status: experimental
description: A successful PutFileSystemPolicy changed client authorization on an
  EFS file system. Review the policy for newly permitted principals and client
  actions. A separate EFS rule identifies the narrower wildcard root grant.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-efs-privesc/README.md
- https://docs.aws.amazon.com/efs/latest/APIReference/API_PutFileSystemPolicy.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: elasticfilesystem.amazonaws.com
    event.name: PutFileSystemPolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved EFS client policy maintenance.
level: medium
tags:
- attack.privilege-escalation
x_hacktricks_technique_id: aws-efs-file-system-policy-changed
x_cloudtrail_raw: true
