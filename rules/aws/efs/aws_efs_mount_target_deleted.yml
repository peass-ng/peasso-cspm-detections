title: EFS mount target deleted
id: 24800000-0000-4000-8000-000000000004
status: experimental
description: A successful DeleteMountTarget accepted removal of an EFS network
  endpoint. Clients using that endpoint can lose access; check live mounts,
  alternate mount targets and the final deletion state.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-efs-post-exploitation/README.md
- https://docs.aws.amazon.com/efs/latest/APIReference/API_DeleteMountTarget.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: elasticfilesystem.amazonaws.com
    event.name: DeleteMountTarget
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved EFS mount target retirement.
level: medium
tags:
- attack.impact
x_hacktricks_technique_id: aws-efs-mount-target-deleted
x_cloudtrail_raw: true
