title: S3 Files file system policy changed
id: 25300000-0000-4000-8000-000000000002
status: experimental
description: A file system resource policy was accepted. Review new principals and
  client permissions; the event alone does not prove a cross-account grant or NFS
  access.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-s3-files-persistence/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-logging-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3files.amazonaws.com
    event.name: PutFileSystemPolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::S3Files::FileSystem
  condition: selection
falsepositives:
- Approved file system client-policy maintenance.
level: medium
tags:
- attack.persistence
x_hacktricks_technique_id: aws-s3files-file-system-policy-changed
x_cloudtrail_raw: true
