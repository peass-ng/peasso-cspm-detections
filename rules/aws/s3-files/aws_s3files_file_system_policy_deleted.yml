title: S3 Files file system policy deleted
id: 25300000-0000-4000-8000-000000000003
status: experimental
description: An explicit S3 Files client policy was removed. Compare the previous
  restrictions with default client authorization and network reachability.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-s3-files-persistence/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-logging-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3files.amazonaws.com
    event.name: DeleteFileSystemPolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::S3Files::FileSystem
  condition: selection
falsepositives:
- Approved restoration of default file system policy.
level: medium
tags:
- attack.defense-evasion
x_hacktricks_technique_id: aws-s3files-file-system-policy-deleted
x_cloudtrail_raw: true
