title: S3 Files mount target security groups updated
id: 25300000-0000-4000-8000-000000000005
status: experimental
description: The security groups of an S3 Files mount target changed. Compare prior
  and current NFS ingress before concluding that file access widened.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-files-post-exploitation/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-files-logging-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3files.amazonaws.com
    event.name: UpdateMountTarget
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::S3Files::FileSystem
  condition: selection
falsepositives:
- Approved mount target network maintenance.
level: medium
tags:
- attack.defense-evasion
x_hacktricks_technique_id: aws-s3files-mount-target-updated
x_cloudtrail_raw: true
