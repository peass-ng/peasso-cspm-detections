title: AWS Service Catalog launch role constraint assigned
id: 9de9c2a4-24c1-4a35-b1be-c9b6639d2ead
status: experimental
description: An accepted launch constraint assigned an IAM role to a product in a portfolio. Review who can provision the product and the role's permissions.
x_hacktricks_technique_id: aws-servicecatalog-launch-role-constraint
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-service-catalog-privesc/README.md#L19
- https://docs.aws.amazon.com/servicecatalog/latest/adminguide/constraints-launch.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: servicecatalog.amazonaws.com
    event.name: CreateConstraint
    event.outcome: success
    request.servicecatalog_launch_role_constraint: true
  condition: selection
level: medium
falsepositives:
- Approved product launch role setup.
