title: PCS Slurm scheduler authentication secret read
id: 32000000-0000-4000-8000-000000000001
status: experimental
description: >
  GetSecretValue read a PCS-managed Slurm authentication secret. Access to
  this key can enable scheduler credential forgery when the actor also has
  network reachability to the private PCS scheduler. The parser scopes the
  request secret identifier to PCS's managed Slurm secret naming pattern;
  CloudTrail does not contain the secret value or prove scheduler access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd20da2cca4b8428e0ee120954247cfc2fe6c568/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-pcs-privesc/README.md#L5
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/cloudtrail_log_entries.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.name: GetSecretValue
    event.outcome: success
    request.pcs_slurm_secret_read: true
  condition: selection
falsepositives:
  - Authorized PCS administration or scheduler credential rotation.
level: high
tags:
  - attack.credential-access
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-pcs-slurm-secret-read
