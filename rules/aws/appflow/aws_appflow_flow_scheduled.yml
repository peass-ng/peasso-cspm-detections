title: AppFlow flow scheduled
id: 12600000-0000-4000-8000-000000000007
status: experimental
description: >
  UpdateFlow set a Scheduled trigger with a schedule expression. CloudTrail redacts the source, destination and tasks; the event does not prove a later run.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-appflow-persistence/README.md#L38
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appflow.amazonaws.com
    event.name: AppflowFlowScheduled
    event.outcome: success
    request.appflow_flow_scheduled: true
  condition: selection
falsepositives:
  - Approved recurring integration configuration.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-appflow-flow-scheduled
