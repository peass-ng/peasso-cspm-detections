title: AppFlow flow created
id: 12600000-0000-4000-8000-000000000001
status: experimental
description: >
  CreateFlow accepted a new integration using its configured authority. Creation alone does not prove transfer or recurring execution.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-appflow-persistence/README.md#L93
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appflow.amazonaws.com
    event.name: AppflowFlowCreated
    event.outcome: success
    request.appflow_flow_created: true
  condition: selection
falsepositives:
  - Approved deployment of a new AppFlow integration.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-appflow-flow-created
