title: AppFlow flow configuration updated
id: 12700000-0000-4000-8000-000000000001
status: experimental
description: >
  UpdateFlow accepted a configuration update. CloudTrail redacts tasks and endpoints, so the event does not establish which fields changed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-appflow-post-exploitation/README.md#L136
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appflow.amazonaws.com
    event.name: AppflowFlowUpdated
    event.outcome: success
    request.appflow_flow_updated: true
  condition: selection
falsepositives:
  - Approved integration maintenance.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-appflow-flow-updated
