title: AppFlow flow configuration read
id: 12600000-0000-4000-8000-000000000002
status: experimental
description: >
  DescribeFlow read the configuration of an existing flow; successful read responses are omitted from CloudTrail.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-appflow-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appflow.amazonaws.com
    event.name: AppflowFlowDescribed
    event.outcome: success
    request.appflow_flow_described: true
  condition: selection
falsepositives:
  - Authorized integration inventory or troubleshooting.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-appflow-flow-described
