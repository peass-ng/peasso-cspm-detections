title: AppFlow flow started on demand
id: 12600000-0000-4000-8000-000000000005
status: experimental
description: >
  StartFlow returned an execution ID for an on-demand run using the flow stored authority. The event alone does not establish destination content.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-appflow-post-exploitation/README.md#L56
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appflow.amazonaws.com
    event.name: AppflowFlowStartedOnDemand
    event.outcome: success
    request.appflow_flow_started_on_demand: true
  condition: selection
falsepositives:
  - Approved manual transfer or integration test.
level: high
tags:
  - attack.exfiltration
x_hacktricks_technique_id: aws-appflow-flow-started-on-demand
