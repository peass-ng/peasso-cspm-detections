title: EventBridge Scheduler universal AWS API target configured
id: caaeb3bc-1d80-4b7c-9f96-7019c37429d3
status: experimental
description: >
  CreateSchedule or UpdateSchedule configured a universal AWS SDK target with
  an execution role in this account. Scheduler may later invoke the API with
  that role; this event does not prove the schedule ran or that the role has
  excessive privileges.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/eventbridgescheduler-privesc/README.md#L15
  - https://docs.aws.amazon.com/scheduler/latest/UserGuide/managing-targets-universal.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: scheduler.amazonaws.com
    event.outcome: success
    request.scheduler_universal_target: true
  condition: selection
falsepositives:
  - Approved universal target with a minimally scoped execution role.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-scheduler-universal-target-configured
