title: Keyspaces service credential reset for another IAM user
id: 75ff756a-99d0-437c-b3ab-d347c9154d0e
status: experimental
description: >
  An IAM user reset an active Amazon Keyspaces service credential for another
  user. The event does not prove database access or credential use.
x_hacktricks_technique_id: aws-keyspaces-other-user-service-credential-reset
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#L183
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: ResetServiceSpecificCredential
    event.outcome: success
    request.service_name: cassandra.amazonaws.com
    request.other_user_service_credential_reset: true
  condition: selection
level: medium
falsepositives:
  - Approved Keyspaces credential rotation for another IAM user.
