title: Keyspaces table row inserted
id: 14300000-0000-4000-8000-000000000002
status: experimental
description: >
  A successful Insert data event modified a table. The event alone does not prove that the writer lacked Select; correlate with the principal's effective permissions and application audit logs.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-keyspaces-post-exploitation/README.md#L281
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cassandra.amazonaws.com
    event.name: KeyspacesTableInsert
    event.outcome: success
    request.keyspaces_table_insert: true
  condition: selection
falsepositives:
  - Approved application write to the table.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-keyspaces-table-insert
