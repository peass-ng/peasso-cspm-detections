title: Keyspaces CDC stream metadata read
id: 14200000-0000-4000-8000-000000000003
status: experimental
description: >
  GetStream succeeded for one stream ARN. It exposes stream metadata; a separate GetRecords data event is needed to establish record access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-keyspaces-post-exploitation/README.md#L76
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cassandra.amazonaws.com
    event.name: KeyspacesStreamRead
    event.outcome: success
    request.keyspaces_stream_read: true
  condition: selection
falsepositives:
  - Approved CDC consumer initialization.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-keyspaces-stream-read
