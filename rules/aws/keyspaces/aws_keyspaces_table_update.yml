title: Keyspaces table row updated
id: 14300000-0000-4000-8000-000000000003
status: experimental
description: >
  A successful Update data event modified a table. Review unexpected writers and sensitive configuration rows; the event does not establish malicious intent or a later application effect.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-keyspaces-post-exploitation/README.md#L281
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cassandra.amazonaws.com
    event.name: KeyspacesTableUpdate
    event.outcome: success
    request.keyspaces_table_update: true
  condition: selection
falsepositives:
  - Approved application update to the table.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-keyspaces-table-update
