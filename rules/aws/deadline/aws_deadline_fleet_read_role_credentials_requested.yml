title: AWS Deadline Cloud fleet read role credentials requested
id: b3660000-0000-4000-8000-000000000003
status: experimental
description: >
  AssumeFleetRoleForRead returned read-scoped fleet-role credentials. Review
  whether the caller was authorized to inspect fleet and worker logs. The
  request alone does not establish that logs or their contents were read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/9725dcb0f71c664994b24647815f17f3e330bfc3/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-deadline-cloud-privesc/README.md#L21
  - https://docs.aws.amazon.com/deadline-cloud/latest/APIReference/API_AssumeFleetRoleForRead.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: deadline.amazonaws.com
    event.name: AssumeFleetRoleForRead
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Authorized fleet troubleshooting or log review.
level: medium
tags:
  - attack.credential-access
  - attack.collection
x_hacktricks_technique_id: aws-deadline-assume-fleet-role-for-read
x_cloudtrail_raw: true
