title: AWS Deadline Cloud queue user role credentials requested
id: b3670000-0000-4000-8000-000000000002
status: experimental
description: >
  AssumeQueueRoleForUser returned credentials for the configured queue role.
  Unlike the read variant, these credentials could exercise an additional
  permission on the role in a controlled lab. Review the caller, queue role,
  recent role changes and subsequent use of the session.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/9725dcb0f71c664994b24647815f17f3e330bfc3/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-deadline-cloud-privesc/README.md#L55
  - https://docs.aws.amazon.com/deadline-cloud/latest/APIReference/API_AssumeQueueRoleForUser.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: deadline.amazonaws.com
    event.name: AssumeQueueRoleForUser
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Authorized queue user or job attachment workflow.
level: high
tags:
  - attack.credential-access
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-deadline-assume-queue-role-for-user
x_cloudtrail_raw: true
