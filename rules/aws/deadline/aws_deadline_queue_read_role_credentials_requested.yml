title: AWS Deadline Cloud queue read role credentials requested
id: b3670000-0000-4000-8000-000000000001
status: experimental
description: >
  AssumeQueueRoleForRead returned credentials scoped by Deadline Cloud for
  queue read operations. Review whether the caller was expected to inspect
  job attachments or logs; this request does not prove those data were read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/9725dcb0f71c664994b24647815f17f3e330bfc3/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-deadline-cloud-privesc/README.md#L55
  - https://docs.aws.amazon.com/deadline-cloud/latest/APIReference/API_AssumeQueueRoleForRead.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: deadline.amazonaws.com
    event.name: AssumeQueueRoleForRead
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Authorized queue troubleshooting or attachment access.
level: medium
tags:
  - attack.credential-access
  - attack.collection
x_hacktricks_technique_id: aws-deadline-assume-queue-role-for-read
x_cloudtrail_raw: true
