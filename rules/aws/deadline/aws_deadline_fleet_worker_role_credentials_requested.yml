title: AWS Deadline Cloud fleet worker role credentials requested
id: b3660000-0000-4000-8000-000000000002
status: experimental
description: >
  AssumeFleetRoleForWorker returned credentials for the configured fleet role.
  The event identifies a credential-vending request, not the permissions used
  afterward. Review the caller, fleet, worker and the role policy; a logical
  worker on a customer-managed fleet can obtain non-worker permissions.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/9725dcb0f71c664994b24647815f17f3e330bfc3/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-deadline-cloud-privesc/README.md#L135
  - https://docs.aws.amazon.com/deadline-cloud/latest/APIReference/API_AssumeFleetRoleForWorker.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: deadline.amazonaws.com
    event.name: AssumeFleetRoleForWorker
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Authorized worker bootstrap or credential refresh.
level: high
tags:
  - attack.credential-access
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-deadline-assume-fleet-role-for-worker
x_cloudtrail_raw: true
