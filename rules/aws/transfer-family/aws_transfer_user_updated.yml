title: Transfer Family user configuration updated
id: 25000000-0000-4000-8000-000000000003
status: experimental
description: A Transfer user configuration was changed. Review role, home directory
  and policy differences; this event may represent a role swap but does not prove
  one without comparing request and prior state.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-transfer-family-privesc/README.md
- https://docs.aws.amazon.com/transfer/latest/userguide/cloudtrail-logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: transfer.amazonaws.com
    event.name: UpdateUser
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved Transfer user maintenance.
level: medium
tags:
- attack.privilege-escalation
x_hacktricks_technique_id: aws-transfer-user-updated
x_cloudtrail_raw: true
