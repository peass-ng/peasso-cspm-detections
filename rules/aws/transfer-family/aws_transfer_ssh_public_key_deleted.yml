title: Transfer Family SSH public key deleted
id: 25000000-0000-4000-8000-000000000004
status: experimental
description: An SSH public key was removed from a Transfer user. Check whether active
  clients rely on the key and whether the deletion was approved.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-transfer-family-post-exploitation/README.md
- https://docs.aws.amazon.com/transfer/latest/userguide/cloudtrail-logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: transfer.amazonaws.com
    event.name: DeleteSshPublicKey
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved SSH key retirement.
level: medium
tags:
- attack.impact
x_hacktricks_technique_id: aws-transfer-ssh-public-key-deleted
x_cloudtrail_raw: true
