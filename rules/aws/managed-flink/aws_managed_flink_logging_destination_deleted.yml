title: Managed Flink logging destination deleted
id: 31200000-0000-4000-8000-000000000005
status: experimental
description: >
  DeleteApplicationCloudWatchLoggingOption succeeded. Removing a logging
  option can suppress future application logs. The event does not prove that
  logs were previously flowing or that all logging has stopped.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-managed-flink-post-exploitation/README.md#L116
  - https://docs.aws.amazon.com/managed-flink/latest/apiv2/API_DeleteApplicationCloudWatchLoggingOption.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesisanalytics.amazonaws.com
    event.name: DeleteApplicationCloudWatchLoggingOption
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved logging reconfiguration or application retirement.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-managed-flink-logging-destination-deleted
x_cloudtrail_raw: true
