title: Managed Flink application versions listed
id: 31200000-0000-4000-8000-000000000002
status: experimental
description: >
  ListApplicationVersions succeeded. The caller enumerated retained versions
  that may expose historical runtime properties through a subsequent version
  description. This event alone does not show that any secret was retrieved.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-managed-flink-post-exploitation/README.md#L17
  - https://docs.aws.amazon.com/managed-flink/latest/apiv2/API_ListApplicationVersions.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesisanalytics.amazonaws.com
    event.name: ListApplicationVersions
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved deployment review or version inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-managed-flink-application-versions-listed
x_cloudtrail_raw: true
