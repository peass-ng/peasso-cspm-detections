title: CodeBuild project update supplied a service role
id: 8f20f18d-66cf-580d-a587-dfc65cc0e29b
status: experimental
description: A successful UpdateProject call supplied a service role. Compare the
  previous and current role and any later build; IAM PassRole is an authorization
  check without a standalone CloudTrail event.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-codebuild-privesc/README.md#L450
- https://docs.aws.amazon.com/codebuild/latest/APIReference/API_UpdateProject.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codebuild.amazonaws.com
    event.name: UpdateProject
    event.outcome: success
    request.codebuild_service_role_supplied: true
  condition: selection
falsepositives:
- Approved service role rotation for a build project.
level: medium
tags:
- attack.privilege_escalation
x_hacktricks_technique_id: aws-codebuild-update-project-service-role
