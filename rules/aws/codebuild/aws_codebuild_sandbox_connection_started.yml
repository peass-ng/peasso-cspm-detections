title: AWS CodeBuild sandbox interactive connection started
id: 753922b4-b9f8-4c20-8cb1-1ced9733f385
status: experimental
description: StartSandboxConnection opened a session request for a sandbox. Session Manager token and stream URL are excluded from evidence; verify authorized debugging and downstream session state privately.
x_hacktricks_technique_id: aws-tech-b9a6efa3c8d4f52a
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-codebuild-privesc/README.md#L157
- https://docs.aws.amazon.com/codebuild/latest/APIReference/API_StartSandboxConnection.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codebuild.amazonaws.com
    event.name: StartSandboxConnection
    event.outcome: success
    request.codebuild_sandbox_connection_started: true
  condition: selection
level: high
falsepositives:
- Approved sandbox SSH or Session Manager debugging
