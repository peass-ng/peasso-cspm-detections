title: CodeBuild source authentication secret read after project update
id: 42a2bfb2-ab58-4978-9982-d83c572af2ad
status: experimental
description: The actor that updated a CodeBuild project to use a specific Secrets Manager source authentication secret read that same secret within one hour. This proves an API read, not external provider credential use.
x_hacktricks_technique_id: aws-tech-3debac66a71d4ce0
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codebuild-post-exploitation/README.md#L37
- https://docs.aws.amazon.com/codebuild/latest/APIReference/API_SourceAuth.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: CodeBuildSourceAuthSecretReadAfterUpdate
    event.outcome: success
    request.codebuild_source_auth_secret_read_after_update: true
  condition: selection
level: medium
falsepositives:
- Authorized source credential maintenance or validation
