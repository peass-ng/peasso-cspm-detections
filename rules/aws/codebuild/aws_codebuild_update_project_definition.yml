title: CodeBuild project execution definition supplied in update
id: f3405c67-7ba6-523a-8d73-e22dfaa874a7
status: experimental
description: A successful UpdateProject call supplied a source, environment, or artifact
  definition. Compare project state before and after, then correlate any subsequent
  build; the request alone does not prove a change or execution.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-codebuild-privesc/README.md#L502
- https://docs.aws.amazon.com/codebuild/latest/APIReference/API_UpdateProject.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codebuild.amazonaws.com
    event.name: UpdateProject
    event.outcome: success
    request.codebuild_project_definition_supplied: true
  condition: selection
falsepositives:
- Approved project maintenance or infrastructure deployment.
level: medium
tags:
- attack.privilege_escalation
x_hacktricks_technique_id: aws-codebuild-update-project-definition
