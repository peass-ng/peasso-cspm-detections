title: CodeBuild source credential deletion succeeded
id: 13a81c72-ad72-4db5-b279-2c54c7d8b3f4
status: experimental
description: >
  A successful DeleteSourceCredentials request removed a CodeBuild source
  credential. The event does not prove that any project used the credential
  or that builds were interrupted.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codebuild-post-exploitation/README.md#L212
  - https://docs.aws.amazon.com/codebuild/latest/APIReference/API_DeleteSourceCredentials.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codebuild.amazonaws.com
    event.name: DeleteSourceCredentials
    event.outcome: success
    request.codebuild_source_credential_deleted: true
  condition: selection
falsepositives:
  - Approved credential rotation or provider decommissioning.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-codebuild-delete-source-credentials
