title: AWS CodeBuild command execution started in sandbox
id: 829de05a-9d3d-4d84-8d33-e93641d63035
status: experimental
description: StartCommandExecution accepted a command in a CodeBuild sandbox. The command text is omitted; verify command result and role effect privately before claiming privilege escalation.
x_hacktricks_technique_id: aws-tech-0d2343e01ba2ab73
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-codebuild-privesc/README.md#L117
- https://docs.aws.amazon.com/codebuild/latest/APIReference/API_StartCommandExecution.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codebuild.amazonaws.com
    event.name: StartCommandExecution
    event.outcome: success
    request.codebuild_sandbox_command_started: true
  condition: selection
level: high
falsepositives:
- Approved sandbox debugging command
