title: AWS CodeBuild project configuration read
id: b241c347-d324-4d8d-8587-f61e1b2cd8ee
status: experimental
description: BatchGetProjects requested and, when visible in CloudTrail, returned at least one project configuration. It can expose environment metadata but the API event alone does not prove a secret value was obtained.
x_hacktricks_technique_id: aws-tech-672588c90383f487
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-codebuild-privesc/README.md#L710
- https://docs.aws.amazon.com/codebuild/latest/APIReference/API_BatchGetProjects.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codebuild.amazonaws.com
    event.name: BatchGetProjects
    event.outcome: success
    request.codebuild_project_configuration_read: true
  condition: selection
level: low
falsepositives:
- Approved CI inventory or project administration
