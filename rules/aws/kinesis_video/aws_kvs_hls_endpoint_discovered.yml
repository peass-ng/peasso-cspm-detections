title: AWS Kinesis Video HLS session endpoint discovered
id: 6e26ba45-14c8-4eb1-b318-5169767719d2
status: experimental
description: A principal obtained the HLS session data endpoint for a video stream. The request does not prove a session URL was issued or media was viewed.
x_hacktricks_technique_id: aws-kvs-hls-endpoint-discovered
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-video-streams-post-exploitation/README.md#L63
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesisvideo.amazonaws.com
    event.name: GetDataEndpoint
    event.outcome: success
    request.kvs_hls_endpoint_discovered: true
  condition: selection
level: low
falsepositives:
  - Approved HLS player setup
