title: AWS Kinesis Video image endpoint discovered
id: e4d3e3bc-a6e5-4631-8e5e-e041cf2b7caf
status: experimental
description: A principal obtained the GET_IMAGES data endpoint for a video stream. The request does not prove images exist or were read.
