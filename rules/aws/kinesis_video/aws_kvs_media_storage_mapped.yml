title: AWS Kinesis Video signaling channel mapped to media stream
id: e598fa3b-3720-4eb5-bd62-60d2297ade4f
status: experimental
description: A signaling channel accepted a media storage mapping to a Kinesis video
  stream. Compare source and destination with approved channel inventory.
x_hacktricks_technique_id: aws-kvs-media-storage-mapped
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-video-streams-post-exploitation/README.md#L131
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesisvideo.amazonaws.com
    event.name: UpdateMediaStorageConfiguration
    event.outcome: success
    request.kvs_media_storage_mapped: true
  condition: selection
level: medium
falsepositives:
- Approved WebRTC ingestion setup
