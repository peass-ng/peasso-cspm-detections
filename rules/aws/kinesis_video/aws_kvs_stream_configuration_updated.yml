title: AWS Kinesis Video stream configuration updated
id: c2ec2765-a1a9-4ac0-91a5-9da257bdafd0
status: experimental
description: A video stream accepted a device or media-type update. Compare with configuration
  baseline to determine operational impact.
x_hacktricks_technique_id: aws-kvs-stream-configuration-updated
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-video-streams-post-exploitation/README.md#L200
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesisvideo.amazonaws.com
    event.name: UpdateStream
    event.outcome: success
    request.kvs_stream_configuration_updated: true
  condition: selection
level: medium
falsepositives:
- Approved device or codec maintenance
