title: AWS Kinesis Video image generation disabled
id: fd430416-3b14-4a28-aa30-532bfeddb48a
status: experimental
description: A video stream accepted a change disabling automated image generation.
x_hacktricks_technique_id: aws-kvs-image-generation-disabled
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-kinesis-video-streams-persistence/README.md#L120
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesisvideo.amazonaws.com
    event.name: UpdateImageGenerationConfiguration
    event.outcome: success
    request.kvs_image_generation_disabled: true
  condition: selection
level: medium
falsepositives:
- Approved image workflow retirement
