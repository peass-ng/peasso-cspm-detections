title: IAM CreateAccessKey accepted for a named target
id: 00776fc1-4692-5bbd-a9e6-747816214998
status: experimental
description: A successful IAM CreateAccessKey request named a target. Review the prior
  state and effective access before treating this as an attack effect.
x_hacktricks_technique_id: aws-tech-778af313336582aa
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#L72
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_CreateAccessKey.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: CreateAccessKey
    event.outcome: success
    request.iam_credential_boundary_action_observed: true
  condition: selection
level: medium
falsepositives:
- Approved IAM administration, credential rotation or policy maintenance.
