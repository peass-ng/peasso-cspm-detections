title: IAM DeleteAccessKey accepted for a named target
id: 887b28cb-b8e9-503a-a93d-ceed5363fcca
status: experimental
description: A successful IAM DeleteAccessKey request named a target. Review the prior
  state and effective access before treating this as an attack effect.
