references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iam-post-exploitation/README.md#L321
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_DeleteAccessKey.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: DeleteAccessKey
    event.outcome: success
    request.iam_credential_boundary_action_observed: true
