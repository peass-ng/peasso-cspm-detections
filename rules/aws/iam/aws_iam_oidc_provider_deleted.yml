title: AWS IAM OIDC provider deleted
id: 90d16f3a-a7d0-4577-b1d6-2b277ca69a77
status: experimental
description: An OIDC provider was deleted. Dependent federation may stop after propagation,
  while already issued sessions remain valid until expiry.
x_hacktricks_technique_id: aws-iam-oidc-provider-deleted
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iam-post-exploitation/README.md#L429
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: DeleteOpenIDConnectProvider
    event.outcome: success
    request.iam_oidc_provider_deleted: true
  condition: selection
level: high
falsepositives:
- Approved IdP migration or decommissioning
