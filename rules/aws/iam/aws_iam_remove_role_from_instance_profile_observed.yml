title: IAM role removed from named instance profile
id: 87a0e6e6-e8a4-5160-8fe0-50e7f4f92369
status: experimental
description: An accepted RemoveRoleFromInstanceProfile IAM API call named its target.
  Confirm previous state and dependent access before treating this as hostile disruption.
x_hacktricks_technique_id: aws-tech-f4cc1e45d2f1fc5e
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iam-post-exploitation/README.md#L321
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: RemoveRoleFromInstanceProfile
    event.outcome: success
    request.iam_credential_deletion_observed: true
  condition: selection
level: medium
falsepositives:
- Approved IAM administration, credential rotation or decommissioning.
