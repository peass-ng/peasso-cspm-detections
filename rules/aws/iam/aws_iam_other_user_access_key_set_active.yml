title: IAM user set another user's access key to Active
id: 28b93e48-b6e6-4df5-81af-5a6e773ae30d
status: experimental
description: A successful IAM UpdateAccessKey call set another user's access key status to Active. The event does not prove the key was previously inactive, used afterward, or changed effective permissions.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#iamupdateaccesskey
  - https://docs.aws.amazon.com/IAM/latest/APIReference/API_UpdateAccessKey.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: UpdateAccessKey
    event.outcome: success
    actor.kind: IAMUser
    request.other_user: true
    request.status: Active
  condition: selection
falsepositives:
  - Approved reactivation or credential maintenance for another user
level: medium
tags:
  - attack.privilege_escalation
x_hacktricks_technique_id: aws-iam-updateaccesskey-other-user-active
