title: IAM service-specific credential deleted for named user
id: 0807aaeb-c15f-5089-975e-a429d2744324
status: experimental
description: An accepted DeleteServiceSpecificCredential IAM API call named its target.
  Confirm previous state and dependent access before treating this as hostile disruption.
