title: IAM SetDefaultPolicyVersion accepted for a named target
id: efd5c6fb-eceb-5275-963f-c2f7da43d418
status: experimental
description: A successful IAM SetDefaultPolicyVersion request named a target. Review
  the prior state and effective access before treating this as an attack effect.
x_hacktricks_technique_id: aws-tech-ea2d8bcb51ab535d
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#L44
- https://docs.aws.amazon.com/IAM/latest/APIReference/API_SetDefaultPolicyVersion.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: SetDefaultPolicyVersion
    event.outcome: success
    request.iam_credential_boundary_action_observed: true
  condition: selection
level: medium
falsepositives:
- Approved IAM administration, credential rotation or policy maintenance.
