title: Step Functions TestState accompanies a connection secret read
id: d3833539-eb2a-4907-a64e-f5e55b1def86
status: experimental
description: >
  A successful TestState TRACE request and a Step Functions service-initiated
  GetSecretValue for an EventBridge managed connection secret used the same
  delegated role, account and region within ten seconds. This shows a credential
  read associated by timing, not disclosure of the credential to the caller.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#L28
  - https://docs.aws.amazon.com/step-functions/latest/dg/call-https-apis.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: states.amazonaws.com
    event.name: TestState
    event.outcome: success
    request.sfn_http_connection_secret_read: true
  condition: selection
falsepositives:
  - Authorized HTTP Task testing using a connection and execution role.
  - Nearby unrelated credential reads under the same role can satisfy the time window.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-sfn-teststate-connection-secret-read
