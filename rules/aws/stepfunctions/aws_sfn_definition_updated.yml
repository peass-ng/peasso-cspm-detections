title: AWS Step Functions state machine definition updated
id: b1c56e90-c9fb-4c91-a5b8-d66a05c09fb5
status: experimental
description: UpdateStateMachine submitted a definition and returned a revision ID. CloudTrail redacts the definition, so compare the new revision with the approved configuration.
x_hacktricks_technique_id: aws-sfn-definition-updated
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#L244
- https://docs.aws.amazon.com/step-functions/latest/apireference/API_UpdateStateMachine.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: states.amazonaws.com
    event.name: UpdateStateMachine
    event.outcome: success
    request.sfn_definition_updated: true
  condition: selection
level: medium
falsepositives:
- Approved workflow deployment
