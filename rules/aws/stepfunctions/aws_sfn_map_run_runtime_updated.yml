title: Step Functions Map Run runtime controls updated
id: 3ad82f4d-f54f-4529-8453-0ba818518e31
status: experimental
description: >
  An UpdateMapRun request was accepted for an active Map Run with a new
  concurrency or failure tolerance setting. Compare the previous settings
  before deciding whether the change weakened or tightened the workflow.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#L496
  - https://docs.aws.amazon.com/step-functions/latest/apireference/API_UpdateMapRun.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: states.amazonaws.com
    event.name: UpdateMapRun
    event.outcome: success
    request.sfn_map_run_runtime_updated: true
  condition: selection
falsepositives:
  - Approved tuning of a running Distributed Map.
level: low
tags:
  - attack.impact
x_hacktricks_technique_id: aws-sfn-map-run-runtime-updated
