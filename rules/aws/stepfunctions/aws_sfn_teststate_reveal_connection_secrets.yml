title: Step Functions TestState requests connection secrets in trace output
id: 47269461-4a57-4cfd-b799-11e091ea6e8b
status: experimental
description: >
  A successful TestState request used TRACE inspection and revealSecrets with a
  delegated IAM role. An HTTP Task can return EventBridge connection credentials
  to the caller in the API response. CloudTrail does not record that response.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#L28
  - https://docs.aws.amazon.com/step-functions/latest/dg/test-state-isolation.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: states.amazonaws.com
    event.name: TestState
    event.outcome: success
    request.sfn_reveal_connection_secrets: true
  condition: selection
falsepositives:
  - Authorized HTTP Task debugging by an operator allowed to inspect connection credentials.
level: high
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-sfn-teststate-reveal-connection-secrets
