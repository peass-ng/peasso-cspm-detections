title: AWS Step Functions execution stopped
id: 72bd31f6-7c42-49a3-80c6-87092b0b4c58
status: experimental
description: StopExecution returned a stop date for a Standard execution. This proves the stop request was accepted; investigate whether it interrupted expected work.
x_hacktricks_technique_id: aws-sfn-execution-stopped
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#L518
- https://docs.aws.amazon.com/step-functions/latest/apireference/API_StopExecution.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: states.amazonaws.com
    event.name: StopExecution
    event.outcome: success
    request.sfn_execution_stopped: true
  condition: selection
level: medium
falsepositives:
- Approved cancellation of a workflow
