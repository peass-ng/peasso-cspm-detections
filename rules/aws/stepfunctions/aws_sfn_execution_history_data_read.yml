title: AWS Step Functions execution history read with execution data
id: b07720db-11cf-4ebe-aa09-d0f909e1eaca
status: experimental
description: GetExecutionHistory was accepted with includeExecutionData true. CloudTrail omits the returned history; compare the reader and execution with approved operators.
x_hacktricks_technique_id: aws-sfn-execution-history-data-read
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-stepfunctions-post-exploitation/README.md#L81
- https://docs.aws.amazon.com/step-functions/latest/apireference/API_GetExecutionHistory.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: states.amazonaws.com
    event.name: GetExecutionHistory
    event.outcome: success
    request.sfn_execution_history_data_read: true
  condition: selection
level: low
falsepositives:
- Approved workflow debugging
