title: MediaPackage ingest endpoint credentials rotated
id: 21400000-0000-4000-8000-000000000004
status: experimental
description: >
  An accepted RotateIngestEndpointCredentials replaced one endpoint's HLS
  ingest credential. The API response contains replacement usernames and
  passwords; investigate actor and encoder impact. Detection evidence
  excludes secrets and does not prove old credential invalidation.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mediapackage-post-exploitation/README.md
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mediapackage-privesc/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: mediapackage.amazonaws.com
    event.name: RotateIngestEndpointCredentials
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved ingest endpoint credential rotation.
level: high
tags:
  - attack.credential-access
  - attack.impact
x_hacktricks_technique_id: aws-mediapackage-endpoint-credentials-rotated
x_cloudtrail_raw: true
