title: MediaPackage channel ingest credentials read
id: 21400000-0000-4000-8000-000000000001
status: experimental
description: >
  An accepted DescribeChannel can return the channel's HLS ingest usernames
  and passwords. Review whether this actor needed encoder credentials. The
  detection omits all credential fields and does not prove media injection.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mediapackage-post-exploitation/README.md
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mediapackage-privesc/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: mediapackage.amazonaws.com
    event.name: DescribeChannel
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved encoder configuration or support inspection.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-mediapackage-channel-described
x_cloudtrail_raw: true
