title: MediaPackage channel ingest credentials rotated
id: 21400000-0000-4000-8000-000000000003
status: experimental
description: >
  An accepted RotateChannelCredentials replaced a channel ingest credential.
  The API response contains replacement usernames and passwords; investigate
  who invoked it and whether the encoder was updated. Detection evidence
  excludes the secrets and does not prove old credential invalidation.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mediapackage-post-exploitation/README.md
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mediapackage-privesc/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: mediapackage.amazonaws.com
    event.name: RotateChannelCredentials
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved channel credential rotation.
level: high
tags:
  - attack.credential-access
  - attack.impact
x_hacktricks_technique_id: aws-mediapackage-channel-credentials-rotated
x_cloudtrail_raw: true
