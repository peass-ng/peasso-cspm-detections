title: AWS VPC newly created custom DNS associated
id: 69338d3b-d950-433a-b03e-0509992bbbda
status: experimental
description: A VPC associated newly created DHCP options that specify resolvers other
  than AmazonProvidedDNS. DNS changes reach instances when their leases renew.
x_hacktricks_technique_id: aws-vpc-custom-dns-associated
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ec2-ebs-ssm-and-vpc-post-exploitation/README.md#L1530
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ec2.amazonaws.com
    event.name: AssociateDhcpOptions
    event.outcome: success
    request.vpc_custom_dns_associated: true
  condition: selection
level: medium
falsepositives:
- Approved corporate resolver rollout
