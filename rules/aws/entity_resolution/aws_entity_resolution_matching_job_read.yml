title: Entity Resolution matching job read
id: 16400000-0000-4000-8000-000000000002
status: experimental
description: >
  A successful GetMatchingJob read a matching job status and metadata. Repeated reads can reveal processing progress and output configuration, but the event alone does not disclose returned records or prove exfiltration.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-entity-resolution-post-exploitation/README.md#L11
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: entityresolution.amazonaws.com
    event.name: GetMatchingJob
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved status polling for a matching job.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-entity-resolution-matching-job-read
x_cloudtrail_raw: true
