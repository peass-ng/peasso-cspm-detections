title: Entity Resolution matching workflow created
id: 16400000-0000-4000-8000-000000000003
status: experimental
description: >
  A successful CreateMatchingWorkflow registered a workflow with a caller-selected service role, inputs and output. Review the passed role and destinations against approved data paths. Creation alone does not prove a job ran or data was exported.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-entity-resolution-post-exploitation/README.md#L138
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: entityresolution.amazonaws.com
    event.name: CreateMatchingWorkflow
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved creation of a matching workflow.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-entity-resolution-matching-workflow-created
x_cloudtrail_raw: true
