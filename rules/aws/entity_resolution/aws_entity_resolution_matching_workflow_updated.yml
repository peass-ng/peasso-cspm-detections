title: Entity Resolution matching workflow updated
id: 16400000-0000-4000-8000-000000000004
status: experimental
description: >
  A successful UpdateMatchingWorkflow changed a matching workflow configuration. Compare input tables, service role, matching rules and output destination against the approved baseline. This event alone cannot identify which field changed or prove a job processed the revised definition.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-entity-resolution-post-exploitation/README.md#L118
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: entityresolution.amazonaws.com
    event.name: UpdateMatchingWorkflow
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved matching workflow maintenance.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-entity-resolution-matching-workflow-updated
x_cloudtrail_raw: true
