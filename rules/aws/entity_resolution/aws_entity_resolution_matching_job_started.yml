title: Entity Resolution matching job started
id: 16400000-0000-4000-8000-000000000005
status: experimental
description: >
  A successful StartMatchingJob began processing a matching workflow under its stored role. Review whether the caller, input data and output destination were approved. The API event alone does not prove the job completed or that its results were read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-entity-resolution-post-exploitation/README.md#L94
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: entityresolution.amazonaws.com
    event.name: StartMatchingJob
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved matching workflow execution.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-entity-resolution-matching-job-started
x_cloudtrail_raw: true
