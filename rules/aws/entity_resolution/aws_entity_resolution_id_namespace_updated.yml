title: Entity Resolution ID namespace updated
id: 16800000-0000-4000-8000-000000000004
status: experimental
description: >
  A successful UpdateIdNamespace changed identity-mapping configuration.
  Review changes to source tables, rules and delegated role. This single
  event does not prove a job used the new configuration.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-entity-resolution-post-exploitation/README.md#L118
  - https://docs.aws.amazon.com/entityresolution/latest/apireference/API_UpdateIdNamespace.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: entityresolution.amazonaws.com
    event.name: UpdateIdNamespace
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved namespace maintenance.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-entity-resolution-id-namespace-updated
x_cloudtrail_raw: true
