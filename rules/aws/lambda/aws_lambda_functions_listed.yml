title: Lambda functions listed with possible environment disclosure
id: 0b6a8b71-17cc-4a6d-8108-6117cf2a9c4e
status: experimental
description: >
  A successful ListFunctions call can return function environment variables
  to its caller. CloudTrail recorded the call with null request and response
  bodies, so the event does not identify which function or value was read.
x_hacktricks_technique_id: aws-tech-4535d96f55586eb6
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lambda-function-access-post-exploitation/README.md#L17
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lambda.amazonaws.com
    event.name: ListFunctions20150331
    event.outcome: success
    request.lambda_functions_listed: true
  condition: selection
level: low
falsepositives:
  - Approved Lambda inventory.
tags:
  - attack.credential-access
