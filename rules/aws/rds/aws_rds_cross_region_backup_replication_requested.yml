title: AWS RDS automated backups replication to another Region requested
id: d8b7e9bd-9d71-4bbd-a8f2-32227b961f9a
status: experimental
description: An accepted StartDBInstanceAutomatedBackupsReplication was issued in a Region different from the source DB instance Region. Confirm destination backup state and approved regional coverage before assessing impact.
x_hacktricks_technique_id: aws-rds-cross-region-automated-backup-replication
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L522
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_StartDBInstanceAutomatedBackupsReplication.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rds.amazonaws.com
    event.name: StartDBInstanceAutomatedBackupsReplication
    event.outcome: success
    request.rds_cross_region_backup_replication_requested: true
  condition: selection
level: medium
falsepositives:
- Approved disaster recovery replication
