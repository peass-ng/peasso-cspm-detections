title: AWS RDS snapshot or cluster export to S3 requested
id: 332b9c3a-c68c-4d93-b7db-f6949394ca83
status: experimental
description: An accepted StartExportTask named an RDS snapshot or cluster, S3 bucket, IAM role and KMS key. Compare bucket and role with approved export inventory, then verify task completion and objects before concluding data moved.
x_hacktricks_technique_id: aws-rds-snapshot-export-to-s3
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L393
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_StartExportTask.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rds.amazonaws.com
    event.name: StartExportTask
    event.outcome: success
    request.rds_database_export_requested: true
  condition: selection
level: medium
falsepositives:
- Approved snapshot export or backup pipeline
