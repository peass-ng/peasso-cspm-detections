title: AWS RDS Proxy authentication secret read after proxy configuration
id: 12943519-5cbe-4a08-9d78-20f78361f94b
status: experimental
description: A principal read a Secrets Manager secret that appeared in a successful CreateDBProxy auth configuration in the same account within 24 hours. This detects recently configured proxies; older proxies require live RDS inventory because CloudTrail DescribeDBProxies omits responseElements in the tested account. The log proves the read request, not use of the credential.
x_hacktricks_technique_id: aws-rds-proxy-auth-secret-read-after-configuration
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L15
- https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy-secrets-arns.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: GetSecretValue
    event.outcome: success
    request.rds_proxy_auth_secret_read_after_configuration: true
  condition: selection
level: medium
falsepositives:
- Approved proxy setup, health check or credential validation
