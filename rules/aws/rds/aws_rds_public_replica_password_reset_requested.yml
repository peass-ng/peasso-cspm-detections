title: AWS RDS public read replica followed by password reset request
id: d7e45c78-0c87-44d3-ad05-cf3922d499b7
status: experimental
description: The same actor requested a public read replica and then a redacted master password change on that replica within one hour. Confirm the password took effect and whether DB authentication or data access followed.
x_hacktricks_technique_id: aws-rds-public-replica-password-reset-requested
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L732
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rds.amazonaws.com
    event.name: ModifyDBInstance
    event.outcome: success
    request.rds_public_replica_password_reset_requested: true
  condition: selection
level: high
falsepositives:
- Approved recovery or migration of a public read replica
