title: AWS RDS public snapshot clone followed by master password reset request
id: df4a02a6-5606-42e9-af49-b77a2c082fe7
status: experimental
description: The same actor restored a public DB clone and later sent ModifyDBInstance with masterUserPassword redacted as HIDDEN_DUE_TO_SECURITY_REASONS. The event proves a reset request, not that the new password was usable.
x_hacktricks_technique_id: aws-rds-public-clone-password-reset-requested
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L311
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-rds-privesc/README.md#L18
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rds.amazonaws.com
    event.name: ModifyDBInstance
    event.outcome: success
    request.rds_public_clone_password_reset_requested: true
  condition: selection
level: medium
falsepositives:
- Approved clone setup followed by an update with redacted fields
