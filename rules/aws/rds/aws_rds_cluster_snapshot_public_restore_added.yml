title: AWS RDS cluster snapshot made publicly restorable
id: 2546e9a4-5a03-457c-8249-f39898c94cd9
status: experimental
description: An accepted ModifyDBClusterSnapshotAttribute added all to the restore ACL of a cluster snapshot. Confirm the final attributes and whether the snapshot contains data before assessing impact.
x_hacktricks_technique_id: aws-rds-cluster-snapshot-public-restore
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L462
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_ModifyDBClusterSnapshotAttribute.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rds.amazonaws.com
    event.name: ModifyDBClusterSnapshotAttribute
    event.outcome: success
    request.rds_cluster_snapshot_public_restore_added: true
  condition: selection
level: high
falsepositives:
- Deliberate publication of a synthetic or empty cluster snapshot
