title: AWS RDS blue green deployment requested
id: 694e17ce-af5f-41f5-8379-50d30ce52367
status: experimental
description: An accepted CreateBlueGreenDeployment named a source database and a green deployment. Confirm the generated green resources and watch for password or network changes; this event alone does not show access to data.
x_hacktricks_technique_id: aws-rds-blue-green-clone
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L147
- https://docs.aws.amazon.com/AmazonRDS/latest/APIReference/API_CreateBlueGreenDeployment.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rds.amazonaws.com
    event.name: CreateBlueGreenDeployment
    event.outcome: success
    request.rds_blue_green_deployment_requested: true
  condition: selection
level: medium
falsepositives:
- Approved RDS upgrade or migration
