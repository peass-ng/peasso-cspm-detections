title: AWS RDS managed master secret read by IAM principal
id: 3c8cf331-6671-4e73-8d7e-8729f746b8c9
status: experimental
description: An IAM principal successfully called GetSecretValue for an RDS managed master secret named rds!db-*. CloudTrail does not return the value or the corresponding DB identifier; enrich with the current RDS inventory and approved readers before inferring misuse.
x_hacktricks_technique_id: aws-rds-managed-master-secret-read
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-rds-post-exploitation/README.md#L80
- https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
- https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_GetSecretValue.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: GetSecretValue
    event.outcome: success
    request.rds_managed_master_secret_read: true
  condition: selection
level: medium
falsepositives:
- Approved application or operator retrieval of RDS master credentials
