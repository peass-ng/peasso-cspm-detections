title: IoT TwinMaker component type created
id: 22800000-0000-4000-8000-000000000001
status: experimental
description: >
  A new component type may define schema initializers or data readers and writers backed by Lambda. CloudTrail can omit the functions document; inventory the new type and review any connector ARN. This event alone does not prove a Lambda invocation.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iot-twinmaker-privesc/README.md
  - https://docs.aws.amazon.com/iot-twinmaker/latest/guide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iottwinmaker.amazonaws.com
    event.name: CreateComponentType
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved component model deployment.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-iot-twinmaker-component-type-created
x_cloudtrail_raw: true
