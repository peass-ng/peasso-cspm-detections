title: IoT TwinMaker entity created
id: 22800000-0000-4000-8000-000000000002
status: experimental
description: >
  A new entity may attach a component that triggers a schema initializer or enables later property reads. CloudTrail can omit the components document; inspect the resulting entity and component type before inferring connector use.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iot-twinmaker-privesc/README.md
  - https://docs.aws.amazon.com/iot-twinmaker/latest/guide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iottwinmaker.amazonaws.com
    event.name: CreateEntity
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved industrial model onboarding.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-iot-twinmaker-entity-created
