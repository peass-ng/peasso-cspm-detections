title: S3 Vectors entries retrieved by key
id: 24900000-0000-4000-8000-000000000002
status: experimental
description: A caller retrieved vector entries by key. Review the index, actor and
  expected metadata access; CloudTrail does not contain the returned embeddings or
  metadata.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-vectors-post-exploitation/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3vectors.amazonaws.com
    event.name: GetVectors
    event.category: Data
    event.outcome: success
    event.read_only: true
    resource.type: AWS::S3Vectors::Index
  condition: selection
falsepositives:
- Approved application retrieval of vector entries.
level: medium
tags:
- attack.collection
x_hacktricks_technique_id: aws-s3vectors-vectors-read
x_cloudtrail_raw: true
