title: S3 Vectors entries listed
id: 24900000-0000-4000-8000-000000000003
status: experimental
description: A caller listed entries in a vector index. The request may include embeddings
  and metadata; review actor, pagination and intended corpus access.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-vectors-post-exploitation/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3vectors.amazonaws.com
    event.name: ListVectors
    event.category: Data
    event.outcome: success
    event.read_only: true
    resource.type: AWS::S3Vectors::Index
  condition: selection
falsepositives:
- Approved vector-index inventory or application scan.
level: medium
tags:
- attack.discovery
x_hacktricks_technique_id: aws-s3vectors-vectors-listed
x_cloudtrail_raw: true
