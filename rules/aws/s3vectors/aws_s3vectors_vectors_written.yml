title: S3 Vectors entries inserted or overwritten
id: 24900000-0000-4000-8000-000000000005
status: experimental
description: A caller inserted or upserted vector entries. This can replace known
  keys and metadata; compare with trusted ingestion records before concluding poisoning.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-vectors-post-exploitation/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors-logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3vectors.amazonaws.com
    event.name: PutVectors
    event.category: Data
    event.outcome: success
    event.read_only: false
    resource.type: AWS::S3Vectors::Index
  condition: selection
falsepositives:
- Approved vector ingestion or reindexing.
level: medium
tags:
- attack.impact
x_hacktricks_technique_id: aws-s3vectors-vectors-written
x_cloudtrail_raw: true
