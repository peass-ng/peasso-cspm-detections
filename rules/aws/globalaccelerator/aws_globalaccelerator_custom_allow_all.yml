title: Global Accelerator custom routing subnet traffic allowed
id: 484bd4ea-75ab-4e31-874b-976a81daa206
status: experimental
description: A successful AllowCustomRoutingTraffic allowed all destinations in a subnet endpoint. Inspect destination and network controls before assessing exposure.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-global-accelerator-post-exploitation/README.md
  - https://docs.aws.amazon.com/global-accelerator/latest/dg/global-accelerator-actions.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: globalaccelerator.amazonaws.com
    event.name: AllowCustomRoutingTraffic
    event.outcome: success
    request.ga_custom_allow_all: true
  condition: selection
falsepositives:
  - Approved Global Accelerator configuration or inventory operation
level: high
tags:
  - attack.initial-access
x_hacktricks_technique_id: aws-globalaccelerator-custom-allow-all
