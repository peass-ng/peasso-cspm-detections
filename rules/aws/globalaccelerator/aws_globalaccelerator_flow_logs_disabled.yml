title: Global Accelerator flow logs disabled
id: 484bd4ea-75ab-4e31-874b-976a81daa204
status: experimental
description: A successful UpdateAcceleratorAttributes disabled Global Accelerator flow logs. CloudTrail still records the management change.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-global-accelerator-post-exploitation/README.md
  - https://docs.aws.amazon.com/global-accelerator/latest/dg/global-accelerator-actions.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: globalaccelerator.amazonaws.com
    event.name: UpdateAcceleratorAttributes
    event.outcome: success
    request.ga_flow_logs_disabled: true
  condition: selection
falsepositives:
  - Approved Global Accelerator configuration or inventory operation
level: high
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-globalaccelerator-flow-logs-disabled
