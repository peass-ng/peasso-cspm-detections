title: Global Accelerator endpoint group membership replaced
id: 484bd4ea-75ab-4e31-874b-976a81daa203
status: experimental
description: Two successful UpdateEndpointGroup calls by one actor within an hour selected disjoint endpoint sets for the same group. Review whether the destination change was approved.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-global-accelerator-post-exploitation/README.md
  - https://docs.aws.amazon.com/global-accelerator/latest/dg/global-accelerator-actions.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: globalaccelerator.amazonaws.com
    event.name: GlobalAcceleratorEndpointGroupReplaced
    event.outcome: success
    request.ga_endpoint_group_replaced: true
  condition: selection
falsepositives:
  - Approved Global Accelerator configuration or inventory operation
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-globalaccelerator-endpoint-group-replaced
