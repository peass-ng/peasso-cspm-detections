title: Global Accelerator custom routing port mappings listed
id: 484bd4ea-75ab-4e31-874b-976a81daa205
status: experimental
description: A successful ListCustomRoutingPortMappings requested mapping data for a custom routing endpoint group. Confirm the caller's need for destination information.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-global-accelerator-post-exploitation/README.md
  - https://docs.aws.amazon.com/global-accelerator/latest/dg/global-accelerator-actions.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: globalaccelerator.amazonaws.com
    event.name: ListCustomRoutingPortMappings
    event.outcome: success
    request.ga_custom_mappings_read: true
  condition: selection
falsepositives:
  - Approved Global Accelerator configuration or inventory operation
level: medium
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-globalaccelerator-custom-mappings-read
