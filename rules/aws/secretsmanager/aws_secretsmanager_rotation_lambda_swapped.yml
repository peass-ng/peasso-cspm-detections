title: Secrets Manager rotation function changed in nearby requests
id: bb5ed33a-daf2-4713-a850-ea182f980ef5
status: experimental
description: >
  Two accepted RotateSecret requests from the same actor for one secret named
  different Lambda rotation functions within fifteen minutes. This shows a
  function switch in the observed window; it does not prove credential access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L68
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_RotateSecret.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: RotateSecret
    event.outcome: success
    request.secretsmanager_rotation_lambda_swapped: true
  condition: selection
falsepositives:
  - Approved replacement of a rotation function during maintenance.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-rotation-lambda-swapped
