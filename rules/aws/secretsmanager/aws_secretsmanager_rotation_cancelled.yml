title: Secrets Manager automatic rotation cancelled
id: b70ebbbb-3644-4c4c-9dc2-b37849091a20
status: experimental
description: >
  CancelRotateSecret was accepted for a secret. Review the prior rotation
  schedule and verify that RotationEnabled is false; disabling rotation can
  preserve a compromised credential.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L250
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_CancelRotateSecret.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: CancelRotateSecret
    event.outcome: success
    request.secretsmanager_rotation_cancelled: true
  condition: selection
falsepositives:
  - Approved cancellation during rotation maintenance.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-rotation-cancelled
