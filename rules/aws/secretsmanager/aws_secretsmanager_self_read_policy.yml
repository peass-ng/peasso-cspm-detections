title: Secrets Manager secret policy grants caller value read
id: 5f5e3816-54b1-4b4c-aad3-136245f0c9cf
status: experimental
description: >
  A successful PutResourcePolicy request granted the calling IAM principal
  GetSecretValue on the target secret. The event does not prove the caller
  lacked access beforehand or that the value was later read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-secrets-manager-privesc/README.md#L45
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_PutResourcePolicy.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: PutResourcePolicy
    event.outcome: success
    request.secretsmanager_self_read_grant: true
  condition: selection
falsepositives:
  - Approved resource policy granting a secret operator read access.
level: high
tags:
  - attack.privilege_escalation
x_hacktricks_technique_id: aws-secretsmanager-self-read-policy
