title: Secrets Manager promoted replica grants role access
id: 5e2f010c-dce2-48c9-987d-d9c4a782ac85
status: experimental
description: >
  A replica promotion was followed within thirty minutes by a resource policy
  granting a named role GetSecretValue on that secret in the destination Region.
  This correlation needs the destination Region's CloudTrail events.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L303
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/standalone-secret.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: PutResourcePolicy
    event.outcome: success
    request.secretsmanager_promoted_replica_role_granted: true
  condition: selection
falsepositives:
  - Approved failover followed by application access configuration.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-promoted-replica-role-granted
