title: Secrets Manager secret grants a role GetSecretValue
id: 52ccfd14-36b5-4183-87b8-43e3021d67f9
status: experimental
description: >
  A resource policy grants a named same-account role GetSecretValue without a
  condition. Review the role, secret and KMS access; this event alone does not
  show that the role read the secret.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L303
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_PutResourcePolicy.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: PutResourcePolicy
    event.outcome: success
    request.secretsmanager_scoped_role_read_grant: true
  condition: selection
falsepositives:
  - Approved application role grant on a secret.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-scoped-role-read-grant
