title: Secrets Manager version written under a custom stage
id: 35b953fd-bb70-444d-9c82-78a791bf4772
status: experimental
description: >
  PutSecretValue wrote a version under a custom stage rather than only the
  standard AWS version labels. The value remains hidden in CloudTrail; inspect
  the actor and later AWSCURRENT movements for covert version promotion.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L136
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_PutSecretValue.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: PutSecretValue
    event.outcome: success
    request.secretsmanager_custom_stage_version_planted: true
  condition: selection
falsepositives:
  - Approved use of custom staging labels for deployment or rollback.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-custom-stage-version-planted
