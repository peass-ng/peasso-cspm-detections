title: Secrets Manager manual rotation requested
id: b2189eb6-35ea-4cc0-8f35-431d567303ec
status: experimental
description: >
  RotateSecret was accepted with rotateImmediately true. This is an on-demand
  rotation request; CloudTrail acceptance does not prove the rotation function
  completed or that AWSCURRENT changed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L229
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_RotateSecret.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: RotateSecret
    event.outcome: success
    request.secretsmanager_manual_rotation_requested: true
  condition: selection
falsepositives:
  - Approved manual credential rotation or operational recovery.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-manual-rotation-requested
