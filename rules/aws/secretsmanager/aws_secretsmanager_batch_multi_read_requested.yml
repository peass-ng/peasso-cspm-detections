title: AWS Secrets Manager multi-secret batch read requested
id: 1ebc4aac-ee31-4686-95bb-e6a1c5743120
status: experimental
description: A successful BatchGetSecretValue requested two or more distinct secret
  ARNs. CloudTrail omits returned values and per-secret errors; correlate GetSecretValue
  events and access baselines.
x_hacktricks_technique_id: aws-secretsmanager-batch-multi-read-requested
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L58
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: BatchGetSecretValue
    event.outcome: success
    request.secret_batch_multi_read_requested: true
  condition: selection
level: low
falsepositives:
- Approved bulk application bootstrap or maintenance
