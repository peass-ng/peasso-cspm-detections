title: AWS Secrets Manager customer KMS key associated
id: 9b16b379-7b54-4d9c-ae58-d59986cf5484
status: experimental
description: An UpdateSecret request accepted a customer KMS key ARN for a secret.
  Determine the prior key and later version writes before assessing disruption.
x_hacktricks_technique_id: aws-secretsmanager-kms-key-associated
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L182
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: UpdateSecret
    event.outcome: success
    request.secret_kms_key_associated: true
  condition: selection
level: medium
falsepositives:
- Approved key migration
