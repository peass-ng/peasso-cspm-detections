title: Secrets Manager AWSCURRENT moved to another version
id: 5e5ec598-a54e-4bb3-97d4-24d5b6f08669
status: experimental
description: >
  A successful UpdateSecretVersionStage moved AWSCURRENT from one version to
  another. CloudTrail does not contain the secret value or prove disruption.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L121
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_UpdateSecretVersionStage.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: UpdateSecretVersionStage
    event.outcome: success
    request.secretsmanager_current_version_moved: true
  condition: selection
falsepositives:
  - Approved rollback or rotation of a secret version.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-secretsmanager-current-version-moved
