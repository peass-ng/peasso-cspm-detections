title: Secrets Manager custom-staged version promoted to AWSCURRENT
id: 22764fa4-8c0a-4a86-b3ae-c2c0f7e26725
status: experimental
description: >
  The same actor moved AWSCURRENT to a version it had written under a custom
  stage within fifteen minutes. The event sequence is consistent with secret
  value substitution; CloudTrail does not expose the value.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L136
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_UpdateSecretVersionStage.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: UpdateSecretVersionStage
    event.outcome: success
    request.secretsmanager_custom_stage_promoted: true
  condition: selection
falsepositives:
  - Approved staged secret deployment with a custom label.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-custom-stage-promoted
