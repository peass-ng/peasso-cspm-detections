title: Secrets Manager resource policy deleted
id: cb0b8efe-85f7-4e0c-87aa-ffdccfbf55a6
status: experimental
description: >
  A successful DeleteResourcePolicy removed the resource policy from a secret.
  The event alone does not prove that any principal lost effective access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L251
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_DeleteResourcePolicy.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: DeleteResourcePolicy
    event.outcome: success
    request.secretsmanager_resource_policy_deleted: true
  condition: selection
falsepositives:
  - Approved removal of obsolete secret access.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-secretsmanager-resource-policy-deleted
