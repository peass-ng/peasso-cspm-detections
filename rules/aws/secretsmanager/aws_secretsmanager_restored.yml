title: AWS Secrets Manager deleted secret restored
id: 1b50aee6-bb6d-4a43-bf66-bd93c908017e
status: experimental
description: RestoreSecret accepted a previously scheduled secret. Its old versions
  may become accessible again; subsequent reads and authorization must be checked
  separately.
x_hacktricks_technique_id: aws-secretsmanager-restored
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L35
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: RestoreSecret
    event.outcome: success
    request.secret_restored: true
  condition: selection
level: low
falsepositives:
- Approved rollback of an accidental deletion
