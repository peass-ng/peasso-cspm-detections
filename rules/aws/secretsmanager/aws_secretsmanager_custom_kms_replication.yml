title: Secrets Manager replica requested with a customer KMS key
id: 2f72c8d0-3a42-492b-89fd-f9f4ff61702e
status: experimental
description: >
  A secret replication request selected a customer KMS key in another Region.
  Review the destination, key policy and approval. The request alone does not
  prove that the replica reached InSync or that its value was read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L303
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_ReplicateSecretToRegions.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: ReplicateSecretToRegions
    event.outcome: success
    request.secretsmanager_custom_kms_replication: true
  condition: selection
falsepositives:
  - Approved disaster recovery replication using a customer KMS key.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-custom-kms-replication
