title: AWS Secrets Manager current secret version written
id: 951fc7cd-ac73-460b-81c3-310ed9cb8091
status: experimental
description: A PutSecretValue request accepted a new default current version. The
  value is absent from CloudTrail, so consumer disruption requires independent evidence.
x_hacktricks_technique_id: aws-secretsmanager-current-value-written
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L152
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: PutSecretValue
    event.outcome: success
    request.secret_current_value_written: true
  condition: selection
level: low
falsepositives:
- Approved credential rotation or application deployment
