title: Secrets Manager rotation Lambda explicitly bound
id: 2a8b948e-0faf-4116-8a5a-05fc3c438cdb
status: experimental
description: >
  A successful RotateSecret request explicitly supplied a rotation Lambda ARN.
  The event does not prove that the Lambda differs from the previous setting,
  ran successfully, or read the secret value.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L68
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_RotateSecret.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: RotateSecret
    event.outcome: success
    request.secretsmanager_rotation_lambda_bound: true
  condition: selection
falsepositives:
  - Approved rotation function provisioning or maintenance.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-rotation-lambda-bound
