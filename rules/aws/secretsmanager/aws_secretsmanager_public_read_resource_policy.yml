title: Secrets Manager secret granted public GetSecretValue access
id: cec5d11a-5c62-4a94-b4ea-d1c50589357b
status: experimental
description: >
  A successful resource-policy write allowed all principals to read a secret,
  with no condition in the matching statement. Review KMS access and subsequent
  reads separately.
x_hacktricks_technique_id: aws-secretsmanager-public-read-resource-policy
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-secrets-manager-privesc/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: PutResourcePolicy
    event.outcome: success
    request.secret_public_read_policy_accepted: true
  condition: selection
level: high
falsepositives:
  - Deliberate public access for synthetic or non-sensitive test secrets.
