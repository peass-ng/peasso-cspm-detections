title: Customer-key replica promoted, granted and read across Regions
id: 165c5d21-174a-46f1-859c-c3da95a1c315
status: experimental
description: >
  CloudTrail from both Regions shows replication under a customer KMS key,
  promotion, a role grant and a successful GetSecretValue by that role within
  thirty-minute windows. The log does not contain the secret value; verify
  authorization and business purpose for the complete sequence.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L303
  - https://docs.aws.amazon.com/secretsmanager/latest/userguide/replicate-secrets.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: GetSecretValue
    event.outcome: success
    request.secretsmanager_cross_region_cmk_replica_read: true
  condition: selection
falsepositives:
  - Approved regional migration of a secret and its application reader.
level: high
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-secretsmanager-cross-region-cmk-replica-read
