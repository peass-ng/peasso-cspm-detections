title: AWS Secrets Manager secret scheduled for deletion
id: 73f3daf0-ab4c-414f-9a78-a0c1f17a7226
status: experimental
description: A recoverable DeleteSecret request accepted a seven-to-thirty-day recovery
  window. The secret becomes unavailable during that window; final destruction is
  not implied.
x_hacktricks_technique_id: aws-secretsmanager-deletion-scheduled
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L212
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: DeleteSecret
    event.outcome: success
    request.secret_deletion_scheduled: true
  condition: selection
level: medium
falsepositives:
- Approved secret retirement
