title: Secrets Manager secret force deletion accepted
id: 7cc3df4a-57fb-4a37-8384-390b90692737
status: experimental
description: >
  A successful DeleteSecret call requested force deletion without a recovery
  window. The event proves acceptance, while actual purging is asynchronous.
x_hacktricks_technique_id: aws-secretsmanager-force-delete
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-secrets-manager-post-exploitation/README.md#L212
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: DeleteSecret
    event.outcome: success
    request.secret_force_delete_accepted: true
  condition: selection
level: high
falsepositives:
  - Approved immediate removal of an ephemeral or incorrectly created secret.
