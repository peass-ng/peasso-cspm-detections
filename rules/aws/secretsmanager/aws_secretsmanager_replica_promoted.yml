title: Secrets Manager replica promoted to independent primary
id: a05b2a87-dfdd-4b4c-b19e-f4316c7c45d5
status: experimental
description: >
  A successful StopReplicationToReplica call removed the replica link and
  promoted the secret in that Region. Review approved failover and later
  policy changes; this event does not prove unauthorized access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-secrets-manager-persistence/README.md#L303
  - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_StopReplicationToReplica.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: secretsmanager.amazonaws.com
    event.name: StopReplicationToReplica
    event.outcome: success
    request.secretsmanager_replica_promoted: true
  condition: selection
falsepositives:
  - Approved disaster recovery failover or regional migration.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-secretsmanager-replica-promoted
