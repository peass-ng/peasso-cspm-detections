title: Amazon Redshift Serverless namespace administrator password reset
id: b3580000-0000-4000-8000-000000000001
status: experimental
description: >
  UpdateNamespace succeeded with an administrator password field and a
  matching namespace in the response. This can establish durable SQL
  administrator credentials. CloudTrail redacts the password; this signal
  does not prove a database login or a reachable workgroup endpoint.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-redshift-persistence/README.md#L17
  - https://docs.aws.amazon.com/redshift-serverless/latest/APIReference/API_UpdateNamespace.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: redshift-serverless.amazonaws.com
    event.name: UpdateNamespace
    event.outcome: success
    resource.type: AWS::RedshiftServerless::Namespace
    request.redshift_admin_password_reset: true
  condition: selection
falsepositives:
  - Approved administrator credential rotation on a namespace.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-redshift-serverless-admin-password-reset
