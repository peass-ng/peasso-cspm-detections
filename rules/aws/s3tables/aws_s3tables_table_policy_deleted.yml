logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3tables.amazonaws.com
    event.name: DeleteTablePolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::S3Tables::Table
  condition: selection
falsepositives:
- Approved table policy retirement.
level: medium
tags:
- attack.impact
x_hacktricks_technique_id: aws-s3tables-table-policy-deleted
