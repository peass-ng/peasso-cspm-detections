title: S3 Tables table definition read
id: 25100000-0000-4000-8000-000000000004
status: experimental
description: A caller read a table definition. Review actor and table scope; this
  management read is not equivalent to reading Iceberg objects or rows.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-tables-post-exploitation/README.md
- https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables-logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3tables.amazonaws.com
    event.name: GetTable
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::S3Tables::Table
  condition: selection
falsepositives:
- Approved table catalog inspection.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-s3tables-table-read
x_cloudtrail_raw: true
