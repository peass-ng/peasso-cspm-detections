title: AWS Cloud WAN attachment deletion requested
id: 28200000-0000-4000-8000-000000000004
status: experimental
description: >
  DeleteAttachment requested removal of a core network attachment. Check
  whether it was part of an approved retirement or could break expected
  reachability; the event does not prove deletion completed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-network-manager-post-exploitation/README.md#L128
  - https://docs.aws.amazon.com/networkmanager/latest/APIReference/API_DeleteAttachment.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: networkmanager.amazonaws.com
    event.name: DeleteAttachment
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved retirement of an attachment.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-networkmanager-attachment-deleted
x_cloudtrail_raw: true
