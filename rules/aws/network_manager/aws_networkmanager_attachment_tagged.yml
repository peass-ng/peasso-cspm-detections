title: AWS Cloud WAN attachment tagged
id: 28300000-0000-4000-8000-000000000001
status: experimental
description: >
  TagResource changed tags on a Cloud WAN attachment. If the LIVE core policy
  associates segments by attachment tags, compare the new tags and resulting
  segment with the approved baseline. This event alone does not prove that
  the attachment moved between segments.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-network-manager-post-exploitation/README.md#L88
  - https://docs.aws.amazon.com/networkmanager/latest/APIReference/API_TagResource.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: networkmanager.amazonaws.com
    event.name: TagResource
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::NetworkManager::Attachment
  condition: selection
falsepositives:
  - Approved attachment tag maintenance.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-networkmanager-attachment-tagged
x_cloudtrail_raw: true
