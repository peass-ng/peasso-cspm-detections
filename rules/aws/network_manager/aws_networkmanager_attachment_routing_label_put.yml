title: AWS Cloud WAN attachment routing policy label applied
id: 28500000-0000-4000-8000-000000000001
status: experimental
description: >
  PutAttachmentRoutingPolicyLabel requested a routing policy label on an
  attachment. Compare the label with the LIVE policy mapping and approved
  route filters; the event does not prove that route advertisements changed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-network-manager-post-exploitation/README.md#L51
  - https://docs.aws.amazon.com/networkmanager/latest/APIReference/API_PutAttachmentRoutingPolicyLabel.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: networkmanager.amazonaws.com
    event.name: PutAttachmentRoutingPolicyLabel
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved attachment route filtering change.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-networkmanager-attachment-routing-label-put
x_cloudtrail_raw: true
