title: AWS Cloud WAN core network change set read
id: 28000000-0000-4000-8000-000000000003
status: experimental
description: >
  GetCoreNetworkChangeSet inspected proposed topology or routing changes.
  Review the actor and requested policy version; inspection alone does not
  activate a change set.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-network-manager-post-exploitation/README.md#L170
  - https://docs.aws.amazon.com/networkmanager/latest/APIReference/API_GetCoreNetworkChangeSet.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: networkmanager.amazonaws.com
    event.name: GetCoreNetworkChangeSet
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved review of a Cloud WAN policy change set.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-networkmanager-core-change-set-read
x_cloudtrail_raw: true
