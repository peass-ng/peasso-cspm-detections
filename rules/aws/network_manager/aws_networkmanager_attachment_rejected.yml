title: AWS Cloud WAN attachment rejected
id: 28400000-0000-4000-8000-000000000001
status: experimental
description: >
  RejectAttachment denied a pending core network attachment. Review the
  attachment owner, intended segment and approval record; this can prevent
  expected connectivity but the event does not prove a business outage.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-network-manager-post-exploitation/README.md#L128
  - https://docs.aws.amazon.com/networkmanager/latest/APIReference/API_RejectAttachment.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: networkmanager.amazonaws.com
    event.name: RejectAttachment
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved rejection of an unexpected attachment.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-networkmanager-attachment-rejected
x_cloudtrail_raw: true
