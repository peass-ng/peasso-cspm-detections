title: AWS Cloud WAN attachment routing policy label removed
id: 28500000-0000-4000-8000-000000000002
status: experimental
description: >
  RemoveAttachmentRoutingPolicyLabel requested removal of route filters from
  an attachment. Check the prior label and LIVE policy before attributing a
  bypass or availability impact; the API event is only the request.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-network-manager-post-exploitation/README.md#L51
  - https://docs.aws.amazon.com/networkmanager/latest/APIReference/API_RemoveAttachmentRoutingPolicyLabel.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: networkmanager.amazonaws.com
    event.name: RemoveAttachmentRoutingPolicyLabel
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved removal of an attachment routing policy label.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-networkmanager-attachment-routing-label-removed
x_cloudtrail_raw: true
