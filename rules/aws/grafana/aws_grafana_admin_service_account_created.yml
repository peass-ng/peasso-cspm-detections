title: Managed Grafana administrator service account created
id: 26790971-6abe-4af5-b449-1f4efb9e88ab
status: experimental
description: >
  A successful CreateWorkspaceServiceAccount established an ADMIN service
  account in a Managed Grafana workspace. A separate token-creation call
  would provide its bearer credential; this signal alone does not prove a
  token was created or used.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-managed-grafana-privesc/README.md#L49
  - https://docs.aws.amazon.com/grafana/latest/APIReference/API_CreateWorkspaceServiceAccount.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: grafana.amazonaws.com
    event.name: CreateWorkspaceServiceAccount
    event.outcome: success
    request.grafana_admin_service_account_created: true
  condition: selection
falsepositives:
  - Approved administrator service account provisioning.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-grafana-admin-service-account-created
