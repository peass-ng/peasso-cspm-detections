title: Managed Grafana service account token created
id: 98e6563b-7376-4652-bd37-0851f88d8d76
status: experimental
description: >
  A successful CreateWorkspaceServiceAccountToken minted a bearer token for
  an existing Managed Grafana service account. This event does not by itself
  reveal the account's role. The one-time token may appear in CloudTrail
  responseElements; the detector omits it.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-managed-grafana-privesc/README.md#L49
  - https://docs.aws.amazon.com/grafana/latest/APIReference/API_CreateWorkspaceServiceAccountToken.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: grafana.amazonaws.com
    event.name: CreateWorkspaceServiceAccountToken
    event.outcome: success
    request.grafana_service_account_token_created: true
  condition: selection
falsepositives:
  - Approved rotation or provisioning of service account tokens.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-grafana-service-account-token-created
