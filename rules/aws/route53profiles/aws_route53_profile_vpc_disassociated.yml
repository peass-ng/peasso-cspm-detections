title: Route 53 Profile VPC disassociation requested
id: 13900000-0000-4000-8000-000000000005
status: experimental
description: >
  DisassociateProfile accepted detaching a Profile from a VPC. Confirm the
  final state and review whether a replacement DNS control remains in effect.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-route53-profiles-post-exploitation/README.md#L97
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: route53profiles.amazonaws.com
    event.name: ProfileDisassociatedFromVpc
    event.outcome: success
    request.route53_profile_vpc_disassociated: true
  condition: selection
falsepositives:
  - Approved VPC withdrawal from centralized DNS management.
level: high
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-route53-profile-vpc-disassociated
