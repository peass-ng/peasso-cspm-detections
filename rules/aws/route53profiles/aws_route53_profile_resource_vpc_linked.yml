title: Route 53 Profile DNS resource and VPC linked
id: 13900000-0000-4000-8000-000000000006
status: experimental
description: >
  Association requests for a DNS resource and a VPC targeted the same Profile
  within one hour. Confirm both completed; DNS traffic or redirection requires
  separate verification.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-route53-profiles-post-exploitation/README.md#L17
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: route53profiles.amazonaws.com
    event.name: ProfileResourceAndVpcAssociated
    event.outcome: success
    request.route53_profile_resource_vpc_associated: true
  condition: selection
falsepositives:
  - Approved rollout of centralized DNS resources to a VPC.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-route53-profile-resource-vpc-linked
