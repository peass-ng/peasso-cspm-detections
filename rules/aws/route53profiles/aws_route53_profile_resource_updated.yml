title: Route 53 Profile DNS resource association updated
id: 13900000-0000-4000-8000-000000000002
status: experimental
description: >
  UpdateProfileResourceAssociation submitted a name or property value for a
  DNS resource association. Compare prior state to prove an effective change.
  Property changes can alter DNS Firewall priority; a name-only update does
  not prove a DNS effect.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-route53-profiles-post-exploitation/README.md#L17
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: route53profiles.amazonaws.com
    event.name: ProfileResourceAssociationUpdated
    event.outcome: success
    request.route53_profile_resource_updated: true
  condition: selection
falsepositives:
  - Approved DNS resource association maintenance.
level: low
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-route53-profile-resource-updated
