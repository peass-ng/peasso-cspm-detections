title: ElastiCache RBAC user created
id: 30600000-0000-4000-8000-000000000001
status: experimental
description: >
  CreateUser accepted a new ElastiCache RBAC user. Review its access string,
  authentication mode and any user-group attachment; creation alone does not
  prove that a cache accepts the user's credentials.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-elasticache-persistence/README.md#L46
  - https://docs.aws.amazon.com/AmazonElastiCache/latest/APIReference/API_CreateUser.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: elasticache.amazonaws.com
    event.name: CreateUser
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved RBAC user onboarding.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-elasticache-rbac-user-created
x_cloudtrail_raw: true
