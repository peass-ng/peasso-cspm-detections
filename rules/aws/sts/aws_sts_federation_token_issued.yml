title: STS federated credentials issued by IAM user
id: 16100000-0000-4000-8000-000000000001
status: experimental
description: >
  A successful GetFederationToken issued temporary federated credentials from an IAM user. Review the calling user, session name and approved federation brokers. This event does not prove console sign-in or subsequent misuse.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sts-post-exploitation/README.md#L129
  - https://docs.aws.amazon.com/STS/latest/APIReference/API_GetFederationToken.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sts.amazonaws.com
    event.name: GetFederationToken
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved custom identity broker or federated access workflow.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-sts-federated-credentials-issued
x_cloudtrail_raw: true
