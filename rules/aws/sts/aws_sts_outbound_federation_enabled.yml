title: AWS outbound web identity federation enabled
id: 0f916390-8206-478f-9686-2bf044725d4d
status: experimental
description: A successful account-level enablement allows eligible IAM principals
  to mint AWS-signed JWTs for external relying parties. Review intended integrations.
x_hacktricks_technique_id: aws-sts-outbound-web-federation-enabled
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-sts-privesc/README.md#L224
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: EnableOutboundWebIdentityFederation
    event.outcome: success
    request.sts_outbound_web_federation_enabled: true
  condition: selection
level: medium
falsepositives:
- Approved external OIDC integration
