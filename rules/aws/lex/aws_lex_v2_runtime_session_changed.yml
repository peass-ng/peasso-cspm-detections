title: Lex V2 runtime session changed
id: 13600000-0000-4000-8000-000000000004
status: experimental
description: >
  PutSession changed a Lex bot alias session. Review cross-principal access and application trust in session attributes.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L128
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: SessionChanged
    event.outcome: success
    request.lex_runtime_session_changed: true
  condition: selection
falsepositives:
  - Authorized application session state update.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-lex-v2-runtime-session-changed
