title: Lex V2 runtime session read
id: 13600000-0000-4000-8000-000000000003
status: experimental
description: >
  GetSession read a Lex bot alias session. Correlate the caller with the application user that owns the session.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L128
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: SessionRead
    event.outcome: success
    request.lex_runtime_session_read: true
  condition: selection
falsepositives:
  - Authorized application session recovery.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-lex-v2-runtime-session-read
