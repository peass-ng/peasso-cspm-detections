title: Lex V2 bot alias Lambda hook attached
id: 13700000-0000-4000-8000-000000000005
status: experimental
description: >
  UpdateBotAlias attached an enabled Lambda code hook. Runtime callers may exercise the function's configured business authority.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L168
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: BotAliasHookAttached
    event.outcome: success
    request.lex_bot_alias_hook_attached: true
  condition: selection
falsepositives:
  - Approved Lambda fulfillment integration.
level: high
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-lex-v2-bot-alias-hook-attached
