title: Lex V2 runtime session deleted
id: 13600000-0000-4000-8000-000000000005
status: experimental
description: >
  DeleteSession terminated a Lex bot alias session. Review whether the caller was entitled to end it.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L128
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: SessionDeleted
    event.outcome: success
    request.lex_runtime_session_deleted: true
  condition: selection
falsepositives:
  - Authorized application session cleanup.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-lex-v2-runtime-session-deleted
