title: Lex V2 bot service role selected
id: 13700000-0000-4000-8000-000000000001
status: experimental
description: >
  CreateBot selected an IAM service role. This is a delegation setup signal, not proof of role misuse.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L189
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: BotServiceRoleSelected
    event.outcome: success
    request.lex_bot_service_role_selected: true
  condition: selection
falsepositives:
  - Authorized bot creation with an approved service role.
level: low
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-lex-v2-bot-service-role-selected
