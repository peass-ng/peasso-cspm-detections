  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: UtteranceRecognized
    event.outcome: success
    request.lex_runtime_utterance_recognized: true
  condition: selection
falsepositives:
  - Normal client conversation with the bot.
level: low
tags:
  - attack.execution
