title: Lex V2 runtime utterance recognized
id: 13600000-0000-4000-8000-000000000002
status: experimental
description: >
  RecognizeUtterance accepted text input for a Lex bot alias. Hook activity requires separate evidence.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L75
