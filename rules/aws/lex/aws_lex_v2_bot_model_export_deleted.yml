title: Lex V2 bot model export deleted
id: 13500000-0000-4000-8000-000000000006
status: experimental
description: >
  DeleteExport accepted removal of a Lex model export. This event alone does not prove previously downloaded copies were removed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L94
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: BotModelExportDeleted
    event.outcome: success
    request.bot_model_export_deleted: true
  condition: selection
falsepositives:
  - Approved export cleanup.
level: low
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-lex-v2-bot-model-export-deleted
