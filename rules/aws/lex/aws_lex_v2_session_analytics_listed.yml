title: Lex V2 session analytics listed
id: 13500000-0000-4000-8000-000000000003
status: experimental
description: >
  ListSessionAnalyticsData queried session analytics for a bot. Returned sessions are not present in this management event.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: SessionAnalyticsListed
    event.outcome: success
    request.session_analytics_listed: true
  condition: selection
falsepositives:
  - Approved session analytics.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-lex-v2-session-analytics-listed
