title: Lex V2 bot model export described
id: 13500000-0000-4000-8000-000000000005
status: experimental
description: >
  DescribeExport read the status of a Lex model export. CloudTrail omits the download URL from this read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L94
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: BotModelExportDescribed
    event.outcome: success
    request.bot_model_export_described: true
  condition: selection
falsepositives:
  - Approved export status check.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-lex-v2-bot-model-export-described
