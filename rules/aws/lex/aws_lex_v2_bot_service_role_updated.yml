title: Lex V2 bot service role updated
id: 13700000-0000-4000-8000-000000000002
status: experimental
description: >
  UpdateBot selected an IAM service role. Review whether the selected role is approved for this bot.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lex-v2-post-exploitation/README.md#L189
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lex.amazonaws.com
    event.name: BotServiceRoleUpdated
    event.outcome: success
    request.lex_bot_service_role_updated: true
  condition: selection
falsepositives:
  - Approved change of the bot service role.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-lex-v2-bot-service-role-updated
