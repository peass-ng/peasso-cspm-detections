title: AWS Config rule created or overwritten
id: 27600000-0000-4000-8000-000000000002
status: experimental
description: >
  PutConfigRule was accepted. It can create a rule or silently replace the
  source, scope, or parameters of an existing rule. Compare the full request
  with an approved baseline; the API name alone cannot distinguish creation
  from a security-control downgrade.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md#L178
  - https://docs.aws.amazon.com/config/latest/APIReference/API_PutConfigRule.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: PutConfigRule
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved rule creation or maintenance.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-config-rule-put
x_cloudtrail_raw: true
