title: AWS Config retention configuration created or updated
id: 26100000-0000-4000-8000-000000000002
status: experimental
description: >
  A successful PutRetentionConfiguration changed how long AWS Config retains
  configuration-item history. Inspect the requested number of days and the
  prior setting; this API-level signal includes retention increases as well
  as decreases and does not prove that any historical item was deleted.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md
  - https://docs.aws.amazon.com/config/latest/APIReference/API_PutRetentionConfiguration.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: PutRetentionConfiguration
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Config retention-policy maintenance.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-config-retention-configuration-put
x_cloudtrail_raw: true
