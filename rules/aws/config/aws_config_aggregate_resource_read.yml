title: AWS Config aggregate resource configuration read
id: 27900000-0000-4000-8000-000000000002
status: experimental
description: >
  GetAggregateResourceConfig requested a current configuration item from an
  aggregator by resource and source account/Region. Review the actor and
  request identifier; CloudTrail does not show the returned configuration.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md#L58
  - https://docs.aws.amazon.com/config/latest/APIReference/API_GetAggregateResourceConfig.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: GetAggregateResourceConfig
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved aggregate resource inspection.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-config-aggregate-resource-read
x_cloudtrail_raw: true
