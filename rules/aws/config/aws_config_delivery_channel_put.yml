title: AWS Config delivery channel created or updated
id: 26100000-0000-4000-8000-000000000001
status: experimental
description: >
  A successful PutDeliveryChannel created or updated the Region's AWS Config
  delivery channel. Compare its S3 bucket, prefix, SNS topic and KMS key with
  the previous approved channel. The API event alone does not establish an
  external destination or successful delivery of configuration items.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md
  - https://docs.aws.amazon.com/config/latest/APIReference/API_PutDeliveryChannel.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: PutDeliveryChannel
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Config setup or delivery-channel migration.
level: high
tags:
  - attack.collection
  - attack.defense-evasion
x_hacktricks_technique_id: aws-config-delivery-channel-put
x_cloudtrail_raw: true
