title: AWS Config resource configurations read in batch
id: 27500000-0000-4000-8000-000000000003
status: experimental
description: >
  BatchGetResourceConfig requested current configuration items for known
  resources. Review the resource keys and actor; the event does not prove
  that any returned item contained sensitive data.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md#L17
  - https://docs.aws.amazon.com/config/latest/APIReference/API_BatchGetResourceConfig.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: BatchGetResourceConfig
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved configuration inventory reads.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-config-resource-batch-read
x_cloudtrail_raw: true
