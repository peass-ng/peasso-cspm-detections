title: AWS Config aggregate resource inventory queried
id: 27800000-0000-4000-8000-000000000002
status: experimental
description: >
  SelectAggregateResourceConfig queried inventory collected from source
  accounts and Regions. Review the SQL expression, aggregator and actor;
  CloudTrail does not reveal the returned configuration items.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md#L58
  - https://docs.aws.amazon.com/config/latest/APIReference/API_SelectAggregateResourceConfig.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: SelectAggregateResourceConfig
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved cross-account or cross-region configuration inventory query.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-config-aggregate-resource-query-read
x_cloudtrail_raw: true
