title: AWS Config aggregate resource identifiers listed
id: 27900000-0000-4000-8000-000000000001
status: experimental
description: >
  ListAggregateDiscoveredResources enumerated recorded resource identifiers
  from an AWS Config aggregator. Review the requested resource type, actor
  and source scope; CloudTrail omits the returned identifiers.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-config-post-exploitation/README.md#L58
  - https://docs.aws.amazon.com/config/latest/APIReference/API_ListAggregateDiscoveredResources.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: config.amazonaws.com
    event.name: ListAggregateDiscoveredResources
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved aggregate inventory enumeration.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-config-aggregate-resources-listed
x_cloudtrail_raw: true
