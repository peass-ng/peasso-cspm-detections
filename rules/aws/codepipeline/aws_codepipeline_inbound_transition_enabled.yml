title: CodePipeline inbound stage transition enabled
id: 5442f5de-1987-5783-be7f-df3d790a35f6
status: experimental
description: >
  A successful EnableStageTransition opened an inbound stage transition. An execution advance requires separate state evidence.
x_hacktricks_technique_id: aws-tech-cd5a6d58296aa8fd
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-codepipeline-privesc/README.md#L124
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codepipeline.amazonaws.com
    event.name: EnableStageTransition
    event.outcome: success
    request.pipeline_inbound_transition_enabled: true
  condition: selection
level: medium
falsepositives:
  - Authorized release of a paused pipeline.
