title: VPC Lattice access log subscription created
id: 15700000-0000-4000-8000-000000000001
status: experimental
description: >
  A successful CreateAccessLogSubscription configured a destination for VPC Lattice request metadata. Review the service or network and destination owner against the approved logging inventory. The event does not prove log delivery or an external destination.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-vpc-lattice-post-exploitation/README.md#L48
  - https://docs.aws.amazon.com/vpc-lattice/latest/APIReference/API_CreateAccessLogSubscription.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: vpc-lattice.amazonaws.com
    event.name: CreateAccessLogSubscription
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved service access logging setup.
level: low
tags:
  - attack.collection
x_hacktricks_technique_id: aws-vpc-lattice-access-log-subscription-created
x_cloudtrail_raw: true
