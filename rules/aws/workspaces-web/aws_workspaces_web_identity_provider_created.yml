title: WorkSpaces Web identity provider created
id: 23300000-0000-4000-8000-000000000001
status: experimental
description: A new identity provider was registered for a WorkSpaces Web portal. CloudTrail
  hides identityProviderDetails; inspect the current trust metadata, portal and expected
  IdP inventory. The event alone does not prove a successful login.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: workspaces-web.amazonaws.com
    event.name: CreateIdentityProvider
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved identity provider maintenance.
level: medium
tags:
- attack.persistence
x_hacktricks_technique_id: aws-workspaces-web-identity-provider-created
x_cloudtrail_raw: true
