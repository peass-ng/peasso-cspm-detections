title: WorkSpaces Web browser settings associated with a portal
id: 23200000-0000-4000-8000-000000000001
status: experimental
description: A browser settings object was associated with a portal. This can replace
  the browser policy; CloudTrail hides browserPolicy, so inspect the attached object
  for forced extensions and proxy changes.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: workspaces-web.amazonaws.com
    event.name: AssociateBrowserSettings
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved portal settings maintenance.
level: low
tags:
- attack.persistence
x_hacktricks_technique_id: aws-workspaces-web-browser-settings-associated
x_cloudtrail_raw: true
