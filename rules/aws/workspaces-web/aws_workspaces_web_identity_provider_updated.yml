title: WorkSpaces Web identity provider updated
id: 23300000-0000-4000-8000-000000000002
status: experimental
description: An existing WorkSpaces Web identity provider was updated. CloudTrail
  hides identityProviderDetails, so the event cannot show whether the trust anchor
  changed. Compare current metadata or certificate fingerprints with the approved
  baseline.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: workspaces-web.amazonaws.com
    event.name: UpdateIdentityProvider
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
- Approved identity provider maintenance.
level: medium
tags:
- attack.persistence
x_hacktricks_technique_id: aws-workspaces-web-identity-provider-updated
x_cloudtrail_raw: true
