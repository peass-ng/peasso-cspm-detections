title: WorkSpaces Web browser policy updated
id: 23100000-0000-4000-8000-000000000001
status: experimental
description: >
  A browser settings object was updated. CloudTrail hides browserPolicy in both
  request and response, so this event does not prove an extension or proxy was
  added. Read the current settings, check for forced extensions and unapproved
  update URLs, and determine whether the object is attached to a portal.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md
  - https://docs.aws.amazon.com/workspaces-web/latest/adminguide/browser-policies.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: workspaces-web.amazonaws.com
    event.name: UpdateBrowserSettings
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved browser policy deployment.
level: low
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-workspaces-web-browser-policy-updated
x_cloudtrail_raw: true
