title: WorkSpaces Web IP access settings disassociation requested
id: 23200000-0000-4000-8000-000000000004
status: experimental
description: A successful IP access settings disassociation API call was made. The
  call can be idempotent; confirm the portal currently lacks its IP allow list before
  concluding that source restrictions were removed.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-workspaces-web-post-exploitation/README.md
