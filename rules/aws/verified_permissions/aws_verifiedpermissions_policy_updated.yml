title: Verified Permissions policy updated
id: 17500000-0000-4000-8000-000000000002
status: experimental
description: >
  A static Cedar policy was updated in a Verified Permissions policy store.
  Such an update can broaden application actions or conditions. CloudTrail
  omits the Cedar statement, so compare the stored policy before and after the
  event and check application authorization decisions.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-verified-permissions-privesc/README.md#L14
  - https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_UpdateStaticPolicyDefinition.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: UpdatePolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::VerifiedPermissions::PolicyStore
  condition: selection
falsepositives:
  - Approved application policy change.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-verifiedpermissions-policy-updated
x_cloudtrail_raw: true
