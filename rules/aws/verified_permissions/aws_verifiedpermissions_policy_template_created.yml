title: Verified Permissions policy template created
id: 17700000-0000-4000-8000-000000000001
status: experimental
description: >
  A Cedar policy template was created in a Verified Permissions store. Linked
  policies can later grant durable application access. CloudTrail omitted the
  submitted Cedar text in the observed event, so review template inventory.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-verified-permissions-persistence/README.md#L40
  - https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_CreatePolicyTemplate.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: CreatePolicyTemplate
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::VerifiedPermissions::PolicyStore
  condition: selection
falsepositives:
  - Approved application policy template deployment.
level: low
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-verifiedpermissions-policy-template-created
x_cloudtrail_raw: true
