title: Verified Permissions identity source configuration read
id: 18100000-0000-4000-8000-000000000001
status: experimental
description: >
  GetIdentitySource requested the configuration of a named identity source in
  a policy store. CloudTrail omits the returned configuration, so this event
  establishes the accepted read request but cannot show its contents.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-verified-permissions-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/monitoring-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: GetIdentitySource
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::VerifiedPermissions::PolicyStore
  condition: selection
falsepositives:
  - Approved identity-provider configuration review.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-verifiedpermissions-identity-source-read
x_cloudtrail_raw: true
