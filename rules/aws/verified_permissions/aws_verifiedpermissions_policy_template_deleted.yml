title: Verified Permissions policy template deleted
id: 17700000-0000-4000-8000-000000000003
status: experimental
description: >
  A Cedar policy template was deleted. AWS also deletes policies linked to
  that template, which can revoke application access. Check whether linked
  policies existed and compare authorization decisions before and after.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-verified-permissions-post-exploitation/README.md#L81
  - https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_DeletePolicyTemplate.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: DeletePolicyTemplate
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::VerifiedPermissions::PolicyStore
  condition: selection
falsepositives:
  - Approved policy template retirement.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-verifiedpermissions-policy-template-deleted
x_cloudtrail_raw: true
