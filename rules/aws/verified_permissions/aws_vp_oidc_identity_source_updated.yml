title: External OIDC identity source configuration updated
id: a5ff8ada-1bc8-4273-a127-a4177dc38359
status: experimental
description: UpdateIdentitySource accepted an external OIDC issuer configuration for an existing source. CloudTrail does not include the previous configuration, so this event alone cannot prove the issuer or audience changed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-verified-permissions-post-exploitation/README.md#L107
  - https://docs.aws.amazon.com/verifiedpermissions/latest/apireference/API_UpdateIdentitySource.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: UpdateIdentitySource
    event.outcome: success
    request.vp_oidc_source_updated: true
  condition: selection
falsepositives:
  - Approved OIDC issuer or client migration
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-vp-oidc-identity-source-updated
