title: Elastic Beanstalk environment updated
id: 27300000-0000-4000-8000-000000000001
status: experimental
description: >
  UpdateEnvironment was accepted. Review option settings, version label, and
  the resulting environment configuration. A property change can affect app
  startup, but this API event alone does not prove code execution.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-elastic-beanstalk-privesc/README.md#L24
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-elastic-beanstalk-persistence/README.md#L51
  - https://docs.aws.amazon.com/elasticbeanstalk/latest/api/API_UpdateEnvironment.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: elasticbeanstalk.amazonaws.com
    event.name: UpdateEnvironment
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved configuration or version deployment.
level: low
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-elasticbeanstalk-environment-updated
