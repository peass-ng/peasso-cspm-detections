title: AppStream agent observer control disabled
id: 19900000-0000-4000-8000-000000000002
status: experimental
description: >
  An accepted UpdateStack call explicitly set UserControlMode DISABLED for agent sessions. Observers cannot view or stop those sessions, but the event does not prove an agent session started or that the previous mode allowed observation.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appstream-privesc/README.md
  - https://docs.aws.amazon.com/appstream2/latest/APIReference/API_UpdateStack.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appstream.amazonaws.com
    event.name: UpdateStack
    event.outcome: success
    request.appstream_agent_observer_disabled: true
  condition: selection
falsepositives:
  - Approved headless agent configuration.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-appstream-agent-observer-disabled
