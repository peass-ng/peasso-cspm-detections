title: EKS API endpoint configured for internet access
id: 19200000-0000-4000-8000-000000000006
status: experimental
description: >
  An accepted UpdateClusterConfig request configured the public API endpoint with a world-wide CIDR. EKS applies updates asynchronously, so the event does not prove the change completed or that prior access was narrower.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_UpdateClusterConfig.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: UpdateClusterConfig
    event.outcome: success
    request.eks_public_api_exposed: true
  condition: selection
falsepositives:
  - Approved temporary public endpoint access.
level: high
tags:
  - attack.initial-access
x_hacktricks_technique_id: aws-eks-public-api-exposed
