title: EKS access policy associated
id: 28700000-0000-4000-8000-000000000004
status: experimental
description: >
  An accepted association can grant cluster administrator access to an IAM principal. Verify policy ARN and scope against approved grants.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md#L29
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-eks-persistence/README.md#L119
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_AssociateAccessPolicy.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: AssociateAccessPolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved EKS cluster administration.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-eks-access-policy-associated
x_cloudtrail_raw: true
