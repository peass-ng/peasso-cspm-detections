title: EKS Pod Identity association changed
id: 19200000-0000-4000-8000-000000000005
status: experimental
description: >
  An accepted UpdatePodIdentityAssociation changed a role, target role or disabled session tags on an existing association. Review the prior binding and resulting IAM permissions.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_UpdatePodIdentityAssociation.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: UpdatePodIdentityAssociation
    event.outcome: success
    request.eks_pod_identity_association_repointed: true
  condition: selection
falsepositives:
  - Approved workload identity maintenance.
level: high
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-eks-pod-identity-association-repointed
