title: EKS Pod Identity role bound
id: 19200000-0000-4000-8000-000000000004
status: experimental
description: >
  An accepted CreatePodIdentityAssociation call mapped a Kubernetes service account to an IAM role. The event does not prove any pod used the role.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_CreatePodIdentityAssociation.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: CreatePodIdentityAssociation
    event.outcome: success
    request.eks_pod_identity_role_bound: true
  condition: selection
falsepositives:
  - Approved workload identity setup.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-eks-pod-identity-role-bound
