title: EKS pod identity association updated
id: 28800000-0000-4000-8000-000000000001
status: experimental
description: >
  An accepted update can repoint a Kubernetes service account to another IAM role. Compare prior and current role, target role and session tag settings; the event does not show that a pod assumed the role.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md#L182
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_UpdatePodIdentityAssociation.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: UpdatePodIdentityAssociation
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved EKS cluster administration or principal deprovisioning.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-eks-pod-identity-association-updated
x_cloudtrail_raw: true
