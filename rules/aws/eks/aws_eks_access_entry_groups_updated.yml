title: EKS access entry groups changed
id: 19200000-0000-4000-8000-000000000002
status: experimental
description: >
  An accepted UpdateAccessEntry call replaced Kubernetes group mappings for an IAM principal. CloudTrail does not identify the cluster RBAC privileges of those groups.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_UpdateAccessEntry.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: UpdateAccessEntry
    event.outcome: success
    request.eks_access_groups_configured: true
  condition: selection
falsepositives:
  - Approved access maintenance.
level: high
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-eks-access-entry-groups-updated
