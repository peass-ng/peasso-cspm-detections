title: EKS access entry created
id: 28700000-0000-4000-8000-000000000002
status: experimental
description: >
  An accepted access entry can add an IAM principal to privileged Kubernetes groups. Inspect requested groups and cluster RBAC; this event alone does not prove cluster administrator access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-eks-privesc/README.md#L82
  - https://docs.aws.amazon.com/eks/latest/APIReference/API_CreateAccessEntry.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: eks.amazonaws.com
    event.name: CreateAccessEntry
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved EKS cluster administration.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-eks-access-entry-created
x_cloudtrail_raw: true
