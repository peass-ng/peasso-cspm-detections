title: AWS DynamoDB GetItem data event observed
id: 751d282c-2888-4b5f-aa23-e9bb5c60d052
status: experimental
description: An accepted GetItem request targeted a DynamoDB table. CloudTrail does
  not show whether an item was returned or its contents.
x_hacktricks_technique_id: aws-dynamodb-get-item-data-read
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L74
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: GetItem
    event.outcome: success
    request.dynamodb_get_item: true
  condition: selection
falsepositives:
- Approved application data access or maintenance
level: low
tags:
- attack.collection
