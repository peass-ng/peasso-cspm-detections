title: AWS DynamoDB point in time recovery enabled
id: a43e1509-9599-467b-b427-ffee8e4fbece
status: experimental
description: A principal successfully requested point in time recovery for a table. This can precede a point in time export or restore; the management event alone does not prove either operation occurred.
x_hacktricks_technique_id: aws-dynamodb-pitr-enabled
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L525
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: UpdateContinuousBackups
    event.outcome: success
    request.dynamodb_pitr_enabled: true
  condition: selection
level: low
falsepositives:
  - Approved recovery configuration
