title: AWS DynamoDB Batch PartiQL SELECT requested
id: 0bf4322b-61a5-449c-96ee-1c0f3f35f8f3
status: experimental
description: An accepted BatchExecuteStatement request contained only SELECT statements.
  This is a distinct data event from ExecuteStatement and does not prove any returned
  values.
x_hacktricks_technique_id: aws-dynamodb-batch-partiql-select-requested
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L222
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: BatchExecuteStatement
    event.outcome: success
    request.dynamodb_batch_partiql_read: true
  condition: selection
falsepositives:
- Approved application data access or maintenance
level: low
tags:
- attack.collection
