title: DynamoDB time to live enabled on a table
id: 01fb54aa-a999-49c4-b530-6120ba82f70b
status: experimental
description: A successful UpdateTimeToLive request enabled TTL using a named attribute. Inspect existing items and the approved lifecycle policy before inferring data loss; the event does not prove any item expired.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L1054
  - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_UpdateTimeToLive.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: UpdateTimeToLive
    event.outcome: success
    request.dynamodb_ttl_enable_accepted: true
  condition: selection
falsepositives:
  - Approved table lifecycle configuration
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-dynamodb-ttl-enabled
