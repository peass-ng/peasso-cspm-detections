title: AWS DynamoDB point in time restore requested
id: 26f9d3a1-4513-4dba-8104-572665e26730
status: experimental
description: A principal successfully requested a new table restored from a DynamoDB source table's point in time state. The event alone does not prove the new table became available.
x_hacktricks_technique_id: aws-dynamodb-pitr-restore-requested
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L742
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: RestoreTableToPointInTime
    event.outcome: success
    request.dynamodb_pitr_restore: true
  condition: selection
level: medium
falsepositives:
  - Approved recovery exercise
