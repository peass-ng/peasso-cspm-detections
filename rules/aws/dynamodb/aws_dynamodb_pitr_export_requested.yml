title: AWS DynamoDB point in time export requested
id: 619b8dc7-e17f-4ba0-aaf8-a2edc7f6328e
status: experimental
description: A principal successfully requested export of a DynamoDB table to S3. The management event alone does not prove export completion or access to the resulting objects.
x_hacktricks_technique_id: aws-dynamodb-pitr-export-requested
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L525
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: ExportTableToPointInTime
    event.outcome: success
    request.dynamodb_pitr_export: true
  condition: selection
level: medium
falsepositives:
  - Approved data export
