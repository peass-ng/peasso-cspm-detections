title: DynamoDB table deletion accepted
id: 0719fa18-ab9e-4fa2-bdb5-d586d47ac5df
status: experimental
description: A successful DeleteTable request returned the exact named table in DELETING state. The event does not prove the table held data or that deletion was unauthorized; check backups and later inventory.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L998
  - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_DeleteTable.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: DeleteTable
    event.outcome: success
    request.dynamodb_table_delete_accepted: true
  condition: selection
falsepositives:
  - Approved table retirement or test cleanup
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-dynamodb-table-deleted
