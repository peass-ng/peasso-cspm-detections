title: AWS DynamoDB DeleteItem requested previous item image
id: a9138ece-bdc4-4b64-9ce6-ebc84dc12307
status: experimental
description: An accepted DeleteItem request set ReturnValues to ALL_OLD. The caller
  requested the previous image, but CloudTrail does not include returned item attributes.
x_hacktricks_technique_id: aws-dynamodb-delete-old-image-requested
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L377
- https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_DeleteItem.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: DeleteItem
    event.outcome: success
    request.dynamodb_delete_old_image: true
  condition: selection
falsepositives:
- Approved application data access or maintenance
level: medium
tags:
- attack.collection
