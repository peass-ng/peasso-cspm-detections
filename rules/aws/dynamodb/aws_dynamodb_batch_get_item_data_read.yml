title: AWS DynamoDB BatchGetItem data event observed
id: 325d1799-8c00-448f-a4cd-614318798729
status: experimental
description: An accepted BatchGetItem request targeted one or more DynamoDB tables.
  Review requested table scope; CloudTrail does not show returned item values.
x_hacktricks_technique_id: aws-dynamodb-batch-get-item-data-read
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L17
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: BatchGetItem
    event.outcome: success
    request.dynamodb_batch_get_item: true
  condition: selection
falsepositives:
- Approved application data access or maintenance
level: low
tags:
- attack.collection
