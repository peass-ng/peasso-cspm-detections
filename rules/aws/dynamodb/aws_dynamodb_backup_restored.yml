title: AWS DynamoDB backup restored to a new table
id: 4c315e79-7308-4247-afc7-34399e9f454d
status: experimental
description: A principal successfully requested a new table from a same-account backup. The event indicates the restore request was accepted, not that the table became active or its contents were read.
x_hacktricks_technique_id: aws-dynamodb-backup-restored
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L570
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: RestoreTableFromBackup
    event.outcome: success
    request.dynamodb_backup_restored: true
  condition: selection
level: medium
falsepositives:
  - Approved table recovery
