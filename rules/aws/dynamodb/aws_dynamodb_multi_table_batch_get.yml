title: AWS DynamoDB BatchGetItem targets multiple tables
id: 7636f79b-442b-4af1-8250-1746bbe25e85
status: experimental
description: An accepted BatchGetItem request named at least two table resources.
  The event does not prove which item values were returned.
x_hacktricks_technique_id: aws-dynamodb-multi-table-batch-get
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L70
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: BatchGetItem
    event.outcome: success
    request.dynamodb_multi_table_batch_get: true
  condition: selection
falsepositives:
- Approved application data access or maintenance
level: low
tags:
- attack.collection
