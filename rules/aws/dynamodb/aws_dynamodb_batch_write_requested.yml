title: AWS DynamoDB BatchWriteItem put or delete requested
id: 2271c2d7-9e44-44e7-ac6a-c0391d4e05e9
status: experimental
description: An accepted BatchWriteItem call requested Put or Delete operations. An
  API success may still contain unprocessed items, so this event does not prove every
  item changed.
x_hacktricks_technique_id: aws-dynamodb-batch-write-requested
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-dynamodb-post-exploitation/README.md#L882
- https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_BatchWriteItem.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: dynamodb.amazonaws.com
    event.name: BatchWriteItem
    event.outcome: success
    request.dynamodb_batch_write: true
  condition: selection
falsepositives:
- Approved application data access or maintenance
level: low
tags:
- attack.impact
