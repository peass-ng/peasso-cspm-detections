title: Cost anomaly alert subscription deleted
id: 15400000-0000-4000-8000-000000000002
status: experimental
description: >
  A successful DeleteAnomalySubscription removed a Cost Explorer anomaly alert path. Monitors may continue detecting anomalies without this subscription delivering notifications. Check remaining subscribers and approved replacements.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-cost-explorer-post-exploitation/README.md#L138
  - https://docs.aws.amazon.com/aws-cost-management/latest/APIReference/API_DeleteAnomalySubscription.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ce.amazonaws.com
    event.name: DeleteAnomalySubscription
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved subscription replacement or decommissioning.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-cost-explorer-anomaly-subscription-deleted
x_cloudtrail_raw: true
