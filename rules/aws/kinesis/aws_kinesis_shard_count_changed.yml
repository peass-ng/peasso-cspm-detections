title: AWS Kinesis stream shard count changed
id: 691e8dc2-d69c-4334-a264-c139010f36d7
status: experimental
description: A Kinesis stream's shard count was changed. Assess expected throughput, partition distribution and downstream consumer behavior.
x_hacktricks_technique_id: aws-kinesis-shard-count-changed
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#L124
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesis.amazonaws.com
    event.name: UpdateShardCount
    event.outcome: success
    request.kinesis_shard_count_changed: true
  condition: selection
level: medium
falsepositives:
- Approved throughput scaling
