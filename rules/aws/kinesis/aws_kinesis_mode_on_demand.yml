title: AWS Kinesis stream changed to on-demand mode
id: cb9af429-d9fb-4a2d-9b35-c947f4761598
status: experimental
description: A Kinesis stream accepted a transition to on-demand mode. Review cost and capacity expectations.
x_hacktricks_technique_id: aws-kinesis-stream-mode-on-demand
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#L124
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesis.amazonaws.com
    event.name: UpdateStreamMode
    event.outcome: success
    request.kinesis_mode_on_demand: true
  condition: selection
level: medium
falsepositives:
- Approved change to on-demand billing
