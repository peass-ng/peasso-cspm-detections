title: AWS Kinesis stream deleted
id: e49b4933-3b26-4fb0-a5fd-86095d9b10ce
status: experimental
description: An account-owned Kinesis stream deletion was accepted. Check whether retained data and dependent consumers were affected.
x_hacktricks_technique_id: aws-kinesis-stream-deleted
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#L124
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesis.amazonaws.com
    event.name: DeleteStream
    event.outcome: success
    request.kinesis_stream_deleted: true
  condition: selection
level: high
falsepositives:
- Approved stream retirement or laboratory cleanup
