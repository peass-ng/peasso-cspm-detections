title: AWS Kinesis enhanced fan-out consumer registered
id: 38a7bf7d-91db-4bd9-9c40-62a7d1a784f6
status: experimental
description: A new Kinesis stream consumer was registered. Reconcile its name, owner and resource policy with approved readers.
