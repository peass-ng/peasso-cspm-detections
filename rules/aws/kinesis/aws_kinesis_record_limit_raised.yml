title: AWS Kinesis stream record size limit raised
id: 34321f56-83fb-413f-a1b0-9b029b12357a
status: experimental
description: A Kinesis stream's maximum accepted record size was raised above the standard 1 MiB limit. Review downstream client compatibility and cost.
x_hacktricks_technique_id: aws-kinesis-record-limit-raised
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-kinesis-data-streams-post-exploitation/README.md#L124
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesis.amazonaws.com
    event.name: UpdateMaxRecordSize
    event.outcome: success
    request.kinesis_record_limit_raised: true
  condition: selection
level: medium
falsepositives:
- Approved support for larger producer records
