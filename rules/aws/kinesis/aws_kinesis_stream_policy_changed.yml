title: AWS Kinesis stream resource policy changed
id: cc82ec22-19c8-47da-a3ba-c01a5ecb378d
status: experimental
description: A resource policy was attached to or replaced on a Kinesis stream. Inspect principals and read/write actions for unapproved access.
x_hacktricks_technique_id: aws-kinesis-stream-resource-policy
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-kinesis-data-streams-persistence/README.md#L103
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: kinesis.amazonaws.com
    event.name: PutResourcePolicy
    event.outcome: success
    request.kinesis_stream_policy_changed: true
  condition: selection
level: high
falsepositives:
- Approved sharing policy deployment
