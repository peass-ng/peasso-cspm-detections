title: AMP workspace metric retention set to one day
id: 484bd4ea-75ab-4e31-874b-976a81daa305
status: experimental
description: A successful UpdateWorkspaceConfiguration requested one-day metric retention. Compare prior retention and confirm the eventual workspace state.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-managed-prometheus-post-exploitation/README.md
  - https://docs.aws.amazon.com/prometheus/latest/userguide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: aps.amazonaws.com
    event.name: UpdateWorkspaceConfiguration
    event.outcome: success
    request.amp_retention_one_day: true
  condition: selection
falsepositives:
  - Approved workspace maintenance or incident investigation
level: high
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-amp-retention-one-day
