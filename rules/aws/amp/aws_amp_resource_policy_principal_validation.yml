  service: cloudtrail
detection:
  selection:
    event.source: aps.amazonaws.com
    event.name: ResourcePolicyPrincipalValidationProbe
    event.outcome: failure
    request.resource_policy_principal_validation_pair: true
  condition: selection
falsepositives:
  - Approved policy validation or resource access administration
level: medium
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-amp-resource-policy-principal-validation
