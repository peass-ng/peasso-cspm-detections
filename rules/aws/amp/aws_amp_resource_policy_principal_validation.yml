title: AMP workspace policy principal validation contrast
id: 484bd4ea-75ab-4e31-874b-976a81daa405
status: experimental
description: An accepted workspace policy and a failed otherwise identical policy differed only in IAM principal. Review possible principal enumeration.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iam-post-exploitation/aws-resource-policy-principal-validation.md
logsource:
