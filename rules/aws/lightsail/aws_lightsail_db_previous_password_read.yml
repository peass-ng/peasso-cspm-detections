title: Lightsail database previous master password requested
id: 805f97e5-11fe-4d3b-8037-408e8446b942
status: experimental
description: A successful request asked for the previous Lightsail database master password. CloudTrail omitted the returned password; the event alone does not prove database login.
x_hacktricks_technique_id: aws-tech-da99c6408e15df08
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-lightsail-post-exploitation/README.md#L133
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: lightsail.amazonaws.com
    event.name: GetRelationalDatabaseMasterUserPassword
    event.outcome: success
    request.lightsail_db_previous_password_read: true
  condition: selection
level: medium
falsepositives:
- Authorized password recovery or audit.
