title: Greengrass component version created
id: 16600000-0000-4000-8000-000000000001
status: experimental
description: >
  A successful CreateComponentVersion uploaded a Greengrass component recipe or Lambda-based package. Review its publisher, lifecycle and artifacts before deployment. This event does not prove that any edge device ran the component.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-greengrass-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/greengrass/v2/APIReference/API_CreateComponentVersion.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: greengrass.amazonaws.com
    event.name: CreateComponentVersion
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved edge software release.
level: medium
tags:
  - attack.execution
x_hacktricks_technique_id: aws-greengrass-component-version-created
x_cloudtrail_raw: true
