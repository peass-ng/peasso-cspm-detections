title: Greengrass deployment created
id: 16600000-0000-4000-8000-000000000002
status: experimental
description: >
  A successful CreateDeployment configured continuous delivery of Greengrass components to a thing or group. Review the target and versions against approved edge releases. The control-plane event alone cannot prove a core device received or executed the software.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-greengrass-post-exploitation/README.md#L15
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd20da2cca4b8428e0ee120954247cfc2fe6c568/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-greengrass-privesc/README.md#L5
  - https://docs.aws.amazon.com/greengrass/v2/developerguide/create-deployments.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: greengrass.amazonaws.com
    event.name: CreateDeployment
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved component rollout to managed core devices.
level: medium
tags:
  - attack.execution
x_hacktricks_technique_id: aws-greengrass-deployment-created
x_cloudtrail_raw: true
