title: Device Farm TestGrid artifacts listed
id: 14100000-0000-4000-8000-000000000008
status: experimental
description: >
  ListTestGridSessionArtifacts succeeded for LOG or VIDEO. The API can issue presigned artifact URLs; the CloudTrail event does not prove download, and findings omit those URLs.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-device-farm-post-exploitation/README.md#L43
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: devicefarm.amazonaws.com
    event.name: TestGridSessionArtifactsListed
    event.outcome: success
    request.devicefarm_testgrid_artifacts_listed: true
  condition: selection
falsepositives:
  - Approved collection of browser test logs or video.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-devicefarm-testgrid-artifacts-listed
