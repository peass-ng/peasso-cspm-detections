title: Device Farm remote device stop requested
id: 14100000-0000-4000-8000-000000000003
status: experimental
description: >
  StopRemoteAccessSession returned STOPPING or a terminal state. Check later inventory before claiming that access ended.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-device-farm-post-exploitation/README.md#L192
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: devicefarm.amazonaws.com
    event.name: RemoteAccessSessionStopRequested
    event.outcome: success
    request.devicefarm_remote_session_stop: true
  condition: selection
falsepositives:
  - Approved shutdown of a disposable session.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-devicefarm-remote-session-stop
