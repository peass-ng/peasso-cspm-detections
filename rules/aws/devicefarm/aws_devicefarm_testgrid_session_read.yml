title: Device Farm TestGrid session read
id: 14100000-0000-4000-8000-000000000006
status: experimental
description: >
  GetTestGridSession succeeded for a browser session. CloudTrail omits the returned session details; correlate with project inventory before judging exposure.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-device-farm-post-exploitation/README.md#L43
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: devicefarm.amazonaws.com
    event.name: TestGridSessionRead
    event.outcome: success
    request.devicefarm_testgrid_session_read: true
  condition: selection
falsepositives:
  - Approved session status inspection.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-devicefarm-testgrid-session-read
