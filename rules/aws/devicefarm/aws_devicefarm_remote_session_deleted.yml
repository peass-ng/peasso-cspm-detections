title: Device Farm remote device session deleted
id: 14100000-0000-4000-8000-000000000004
status: experimental
description: >
  DeleteRemoteAccessSession succeeded for a completed session. Deleted results can remove testing evidence; CloudTrail history outside Device Farm remains.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-device-farm-post-exploitation/README.md#L192
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: devicefarm.amazonaws.com
    event.name: RemoteAccessSessionDeleted
    event.outcome: success
    request.devicefarm_remote_session_deleted: true
  condition: selection
falsepositives:
  - Approved deletion under retention policy.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-devicefarm-remote-session-deleted
