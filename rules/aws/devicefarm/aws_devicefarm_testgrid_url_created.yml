title: Device Farm TestGrid signed URL created
id: 14000000-0000-4000-8000-000000000004
status: experimental
description: >
  CreateTestGridUrl returned a signed browser endpoint for a TestGrid project. The event does not prove that a browser session started or that a private application was reached. The signed URL is excluded from the finding.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-device-farm-post-exploitation/README.md#L43
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: devicefarm.amazonaws.com
    event.name: TestGridUrlCreated
    event.outcome: success
    request.devicefarm_testgrid_url_created: true
  condition: selection
falsepositives:
  - Approved desktop browser testing setup.
level: medium
tags:
  - attack.initial-access
x_hacktricks_technique_id: aws-devicefarm-testgrid-url-created
