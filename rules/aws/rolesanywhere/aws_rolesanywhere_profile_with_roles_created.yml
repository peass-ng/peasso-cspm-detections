title: Roles Anywhere profile created with role bindings
id: c89e2152-3ac9-59fa-8e12-4f23786f1296
status: experimental
description: A new Roles Anywhere profile names one or more roles. Verify the trust
  anchor, role trust and actual session use separately.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#L1156
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: rolesanywhere.amazonaws.com
    event.name: CreateProfile
    event.outcome: success
    request.rolesanywhere_profile_with_roles_created: true
  condition: selection
falsepositives:
- Authorized IAM Roles Anywhere administration or certificate rotation.
level: medium
tags:
- attack.persistence
x_hacktricks_technique_id: aws-rolesanywhere-profile-with-roles-created
