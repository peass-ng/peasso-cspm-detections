title: Marketplace listings searched
id: 19400000-0000-4000-8000-000000000002
status: experimental
description: >
  A principal searched Marketplace listings. This is low-confidence catalog reconnaissance; the event does not show the returned listings or prove access to private offers.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-marketplace-enum.md
  - https://docs.aws.amazon.com/marketplace/latest/developerguide/logging-discovery-api-calls-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: discovery-marketplace.amazonaws.com
    event.name: SearchListings
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Routine catalog browsing.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-marketplace-listings-searched
x_cloudtrail_raw: true
