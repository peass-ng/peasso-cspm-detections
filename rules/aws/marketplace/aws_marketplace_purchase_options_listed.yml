title: Marketplace purchase options listed
id: 19400000-0000-4000-8000-000000000001
status: experimental
description: >
  A principal listed Marketplace purchase options. Review the request filter to determine whether private offers were requested; CloudTrail does not include returned commercial terms.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-marketplace-post-exploitation/README.md
  - https://docs.aws.amazon.com/marketplace/latest/developerguide/logging-discovery-api-calls-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: discovery-marketplace.amazonaws.com
    event.name: ListPurchaseOptions
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved buyer offer inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-marketplace-purchase-options-listed
x_cloudtrail_raw: true
