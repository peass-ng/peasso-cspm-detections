title: Marketplace fulfillment options listed
id: 19600000-0000-4000-8000-000000000004
status: experimental
description: >
  An accepted ListFulfillmentOptions call queried the delivery options of a product. CloudTrail does not show returned options.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-marketplace-enum.md
  - https://docs.aws.amazon.com/marketplace/latest/developerguide/logging-discovery-api-calls-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: discovery-marketplace.amazonaws.com
    event.name: ListFulfillmentOptions
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Marketplace catalog operations.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-marketplace-fulfillment-options-listed
x_cloudtrail_raw: true
