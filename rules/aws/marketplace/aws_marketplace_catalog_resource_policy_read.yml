title: Marketplace catalog resource policy read
id: 19600000-0000-4000-8000-000000000006
status: experimental
description: >
  An accepted GetResourcePolicy call queried an entity sharing policy. The event does not prove a policy existed or was returned.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-marketplace-enum.md
  - https://docs.aws.amazon.com/marketplace/latest/developerguide/logging-catalog-api-calls-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: marketplacecatalog.amazonaws.com
    event.name: GetResourcePolicy
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Marketplace catalog operations.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-marketplace-catalog-resource-policy-read
x_cloudtrail_raw: true
