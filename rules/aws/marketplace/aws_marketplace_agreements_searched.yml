title: Marketplace agreements searched
id: 19400000-0000-4000-8000-000000000003
status: experimental
description: >
  A principal searched buyer or seller Marketplace agreements. Review party and agreement filters; CloudTrail does not reveal the returned contracts, pricing or invoice details.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-marketplace-enum.md
  - https://docs.aws.amazon.com/marketplace/latest/developerguide/logging-agreement-api-calls-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: agreement-marketplace.amazonaws.com
    event.name: SearchAgreements
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved procurement review.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-marketplace-agreements-searched
x_cloudtrail_raw: true
