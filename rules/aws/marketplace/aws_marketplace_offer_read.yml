title: Marketplace offer read
id: 19500000-0000-4000-8000-000000000001
status: experimental
description: >
  An accepted GetOffer call requested the details of a known Marketplace offer. CloudTrail omits the returned commercial content.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-marketplace-post-exploitation/README.md
  - https://docs.aws.amazon.com/marketplace/latest/developerguide/logging-discovery-api-calls-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: discovery-marketplace.amazonaws.com
    event.name: GetOffer
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved procurement or seller operations.
level: medium
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-marketplace-offer-read
x_cloudtrail_raw: true
