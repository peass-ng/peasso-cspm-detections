title: AWS Firehose delivery stream deleted
id: adb6846e-5879-49c8-b026-5b927ecd0cc3
status: experimental
description: A successful DeleteDeliveryStream management request removed a delivery stream. Buffered data loss and producer impact require separate evidence.
x_hacktricks_technique_id: aws-firehose-delivery-stream-deleted
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-data-firehose-post-exploitation/README.md#L75
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: firehose.amazonaws.com
    event.name: FirehoseDeliveryStreamDeleted
    event.outcome: success
    request.firehose_stream_deleted: true
  condition: selection
level: medium
falsepositives:
  - Approved stream retirement
