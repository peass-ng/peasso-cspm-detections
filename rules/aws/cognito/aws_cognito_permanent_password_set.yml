title: AWS Cognito administrator set a permanent user password
id: 77fa4c68-0528-4057-90dd-cf84f55f5e5b
status: experimental
description: A successful AdminSetUserPassword set Permanent true, allowing immediate password sign-in if other controls permit it. CloudTrail redacts the username and password.
x_hacktricks_technique_id: aws-cognito-admin-set-permanent-password
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#L363
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cognito-idp.amazonaws.com
    event.name: AdminSetUserPassword
    event.outcome: success
    request.cognito_permanent_password_set: true
  condition: selection
level: high
falsepositives:
  - Approved administrator password initialization or recovery
