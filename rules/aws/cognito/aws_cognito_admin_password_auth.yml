title: AWS Cognito administrator password authentication used
id: e5b7a8a5-d4a4-4d98-a6e6-860167952fad
status: experimental
description: A successful AdminInitiateAuth used ADMIN_USER_PASSWORD_AUTH. Review the principal and client against authorized application backends.
x_hacktricks_technique_id: aws-cognito-admin-user-password-auth
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#L343
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cognito-idp.amazonaws.com
    event.name: AdminInitiateAuth
    event.outcome: success
    request.cognito_admin_password_auth: true
  condition: selection
level: medium
falsepositives:
  - Approved user administration or identity-provider maintenance
