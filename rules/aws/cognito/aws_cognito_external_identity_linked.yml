title: AWS Cognito external identity linked to native user
id: e5bdc085-d308-4031-8d67-76df43fd4f0d
status: experimental
description: A successful AdminLinkProviderForUser attached an external provider identity to a native user. CloudTrail redacts both subject values; audit the user identities attribute.
x_hacktricks_technique_id: aws-cognito-external-identity-linked
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#L694
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cognito-idp.amazonaws.com
    event.name: AdminLinkProviderForUser
    event.outcome: success
    request.cognito_external_identity_linked: true
  condition: selection
level: high
falsepositives:
  - Approved user administration or identity-provider maintenance
