title: AWS Cognito user-pool app client secret added
id: bd84d39d-6043-4f43-be7a-1fbc86db63c8
status: experimental
description: A successful AddUserPoolClientSecret created another active credential for a confidential app client. Reconcile the client secret ID with approved rotations.
x_hacktricks_technique_id: aws-cognito-user-pool-client-secret-added
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-cognito-privesc/README.md#L419
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cognito-idp.amazonaws.com
    event.name: AddUserPoolClientSecret
    event.outcome: success
    request.cognito_user_pool_client_secret_added: true
  condition: selection
level: high
falsepositives:
  - Approved Cognito configuration or credential rotation
