title: AWS Cognito M2M client token issued
id: a8c06c13-d3a3-48b7-8197-cc42074d1cae
status: experimental
description: A public GetClientToken request succeeded for a client and custom scope. CloudTrail redacts the submitted secret and returned access token; this event does not prove which secret was used or what a downstream service allowed.
x_hacktricks_technique_id: aws-cognito-m2m-token-issued
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-cognito-user-pools-post-exploitation/README.md#L19
  - https://docs.aws.amazon.com/cognito-user-identity-pools/latest/APIReference/API_GetClientToken.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: cognito-idp.amazonaws.com
    event.name: GetClientToken
    event.outcome: success
    request.cognito_m2m_token_issued: true
  condition: selection
level: medium
falsepositives:
  - Approved service-to-service token issuance
