title: AWS Cognito external identity provider created
id: c66e3085-8643-4746-8bc9-8dd8c044ab4d
status: experimental
description: A successful CreateIdentityProvider configured a federated provider. Review its issuer, client and mapped claims before enabling it for app clients.
