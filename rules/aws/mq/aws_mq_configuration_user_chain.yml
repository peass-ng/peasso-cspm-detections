title: Amazon MQ configuration attachment followed by broker user change
id: 30400000-0000-4000-8000-000000000004
status: experimental
description: >
  The same actor published an Amazon MQ configuration revision, attached that
  exact revision to a broker, then created or updated a user on that broker
  within one hour. Review the configuration XML, user groups, and activation
  state; CloudTrail redacts the XML and this chain alone does not prove
  administrator access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-mq-privesc/README.md#L20
  - https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-creating-applying-configurations.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: amazonmq.amazonaws.com
    event.name:
      - CreateUser
      - UpdateUser
    event.outcome: success
    request.mq_configuration_user_chain: true
  condition: selection
falsepositives:
  - Approved configuration deployment with planned broker user changes.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-mq-configuration-broker-user-chain
