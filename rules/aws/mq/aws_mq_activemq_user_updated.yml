title: Amazon MQ ActiveMQ user updated
id: 30400000-0000-4000-8000-000000000002
status: experimental
description: >
  UpdateUser accepted a change to an Amazon MQ broker user. Compare prior and
  requested groups, password, and console access; the API event alone does not
  prove a privilege increase or immediate broker access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mq-post-exploitation/README.md#L41
  - https://docs.aws.amazon.com/amazon-mq/latest/api-reference/brokers-broker-id-users-username.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: amazonmq.amazonaws.com
    event.name: UpdateUser
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved ActiveMQ credential or group maintenance.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-mq-activemq-user-updated
x_cloudtrail_raw: true
