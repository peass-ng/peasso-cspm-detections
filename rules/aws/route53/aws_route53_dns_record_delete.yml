title: Route 53 DNS record deleted from an existing zone
id: 96d4b532-688d-443e-9010-9a828d2260bd
status: experimental
description: >
  A successful ChangeResourceRecordSets request deleted an A, AAAA, CNAME,
  MX, NS, or TXT record. Removing a record can disrupt service or validation.
  The event does not establish that any client used the record or that the
  deletion was unauthorized.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-route53-dns-takeover-post-exploitation/README.md#L17
  - https://docs.aws.amazon.com/Route53/latest/APIReference/API_ChangeResourceRecordSets.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: route53.amazonaws.com
    event.name: ChangeResourceRecordSets
    event.outcome: success
    request.route53_dns_delete_observed: true
  condition: selection
falsepositives:
  - Approved DNS record retirement or test cleanup.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-route53-dns-record-delete
