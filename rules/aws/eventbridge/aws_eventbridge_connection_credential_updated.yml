title: EventBridge connection credential updated
id: 37d36f51-1335-410b-8e2e-79386483c01d
status: experimental
description: An authorized EventBridge connection accepted replacement authorization parameters. CloudTrail hides the credential value, so review the actor, attached destinations and change approval.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-eventbridge-post-exploitation/README.md#L340
  - https://docs.aws.amazon.com/eventbridge/latest/APIReference/API_UpdateConnection.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: events.amazonaws.com
    event.outcome: success
    request.eventbridge_connection_credential_updated: true
  condition: selection
falsepositives:
  - Approved connection credential rotation
level: low
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-eventbridge-connection-credential-updated
