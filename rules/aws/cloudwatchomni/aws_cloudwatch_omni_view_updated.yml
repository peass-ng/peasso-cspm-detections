title: CloudWatch Omni SQL view updated
id: b3330000-0000-4000-8000-000000000002
status: experimental
description: >
  UpdateView succeeded. Compare the old and new SQL definitions for raw
  @record projection, wider source tables, removed predicates and larger
  time windows. The API event alone does not show that a delegated caller
  queried the altered view.
