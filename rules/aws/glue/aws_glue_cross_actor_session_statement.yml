title: AWS Glue statement executed by a different actor than session creator
id: f6b89c47-297c-43e8-a1f6-23b7d46e6fa5
status: experimental
description: A successful RunStatement targeted a session whose successful CreateSession event in the same audit batch was made by a different principal. This identifies cross-actor code execution in the session role; review collaboration approvals and the session role. It requires both events within the detection window and does not inspect code because CloudTrail may omit it.
x_hacktricks_technique_id: aws-glue-run-statement-existing-session
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-glue-privesc/README.md#L46
  - https://docs.aws.amazon.com/glue/latest/webapi/API_RunStatement.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: glue.amazonaws.com
    event.name: RunStatement
    event.outcome: success
    request.glue_cross_actor_session_statement: true
  condition: selection
level: high
falsepositives:
  - Authorized team collaboration on a shared Glue session
