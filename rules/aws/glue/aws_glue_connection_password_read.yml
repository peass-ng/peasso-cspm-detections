title: AWS Glue connection fetched without hiding stored password
id: 976a8199-705c-4f7a-99a2-bcfa6d428203
status: experimental
description: A successful GetConnection did not request HidePassword. The API may return a stored connection password, but CloudTrail does not reveal whether this connection had one or whether the caller used it.
x_hacktricks_technique_id: aws-glue-read-connection-credentials
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-glue-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/glue/latest/webapi/API_GetConnection.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: glue.amazonaws.com
    event.name: GetConnection
    event.outcome: success
    request.glue_connection_password_visible_read: true
  condition: selection
level: low
falsepositives:
  - Authorized connector configuration inspection
