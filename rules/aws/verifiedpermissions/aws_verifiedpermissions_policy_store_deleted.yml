title: Verified Permissions policy store deleted
id: 17500000-0000-4000-8000-000000000003
status: experimental
description: >
  A Verified Permissions policy store was deleted. Applications using it can
  lose their authorization model; correlate with the approved teardown and
  application error rates.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-verified-permissions-post-exploitation/README.md#L81
  - https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/monitoring-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: DeletePolicyStore
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::VerifiedPermissions::PolicyStore
  condition: selection
falsepositives:
  - Approved application retirement or policy store replacement.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-verifiedpermissions-policy-store-deleted
x_cloudtrail_raw: true
