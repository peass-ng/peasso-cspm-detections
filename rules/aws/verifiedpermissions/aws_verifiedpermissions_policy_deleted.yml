title: Verified Permissions policy deleted
id: 17500000-0000-4000-8000-000000000004
status: experimental
description: >
  A Cedar policy was deleted from a Verified Permissions store. Removing a
  permit can revoke application access. The event does not establish which
  users or requests were affected; compare the prior policy and decisions.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-verified-permissions-post-exploitation/README.md#L81
  - https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/monitoring-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: verifiedpermissions.amazonaws.com
    event.name: DeletePolicy
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::VerifiedPermissions::PolicyStore
  condition: selection
falsepositives:
  - Approved policy retirement or replacement.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-verifiedpermissions-policy-deleted
x_cloudtrail_raw: true
