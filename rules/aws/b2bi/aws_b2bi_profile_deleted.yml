  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: b2bi.amazonaws.com
    event.name: B2biProfileDeleted
    event.outcome: success
    request.b2bi_profile_deleted: true
  condition: selection
falsepositives:
  - Approved B2BI configuration administration or incident response.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-b2bi-profile-deleted
