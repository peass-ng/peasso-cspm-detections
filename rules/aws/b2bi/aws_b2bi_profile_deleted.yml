title: B2BI profile deleted
id: f9a00b20-0000-4000-8000-000000000004
status: experimental
description: >
  DeleteProfile removed a business profile and can disrupt EDI relationships.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-b2bi-post-exploitation/README.md#L95
