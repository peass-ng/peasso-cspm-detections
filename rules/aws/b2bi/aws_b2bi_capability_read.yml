title: B2BI capability read
id: f9a00b21-0000-4000-8000-000000000002
status: experimental
description: >
  GetCapability requested the transformer and S3 locations of an EDI capability. CloudTrail may omit the returned configuration.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-b2bi-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: b2bi.amazonaws.com
    event.name: B2biCapabilityRead
    event.outcome: success
    request.b2bi_capability_read: true
  condition: selection
falsepositives:
  - Approved B2BI configuration administration or incident response.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-b2bi-capability-read
