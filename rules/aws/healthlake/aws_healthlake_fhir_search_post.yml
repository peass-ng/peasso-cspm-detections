title: HealthLake FHIR search with POST
id: 2df18c9e-e371-465d-b844-04ab5189d5d9
status: experimental
description: >
  A successful SearchWithPost request searched a FHIR resource type.
  CloudTrail omits query values and the clinical response; this event
  alone does not prove matching records were returned. The detector
  hashes the datastore and type.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-healthlake-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/healthlake/latest/devguide/monitoring-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: healthlake.amazonaws.com
    event.name: SearchWithPost
    event.outcome: success
    request.healthlake_fhir_call: true
  condition: selection
falsepositives:
  - Approved application search of FHIR resources.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-healthlake-fhir-search-post
