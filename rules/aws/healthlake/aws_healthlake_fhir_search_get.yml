title: HealthLake FHIR search with GET
id: e1262a3e-7338-4e48-af75-07a5b51699a2
status: experimental
description: >
  A successful HealthLake SearchWithGet request searched a FHIR resource
  type. CloudTrail omits the returned clinical body; this event alone does
  not prove that matching records were returned. The detector hashes the
  datastore and type and omits search terms and headers.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-healthlake-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/healthlake/latest/devguide/monitoring-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: healthlake.amazonaws.com
    event.name: SearchWithGet
    event.outcome: success
    request.healthlake_fhir_call: true
  condition: selection
falsepositives:
  - Approved application search of FHIR resources.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-healthlake-fhir-search-get
