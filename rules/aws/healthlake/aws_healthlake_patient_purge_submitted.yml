title: HealthLake Patient compartment purge submitted
id: 124e15c7-c633-46aa-b10b-bd51d900b6d0
status: experimental
description: >
  An accepted StartFHIRBulkDeleteJob request submitted a Patient $purge job.
  The isolated job completed, but CloudTrail submission alone does not prove
  removal. The datastore and Patient identifiers are hashed; query options
  and clinical content are omitted.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-healthlake-post-exploitation/README.md#L118
  - https://docs.aws.amazon.com/healthlake/latest/devguide/reference-fhir-operations-purge.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: healthlake.amazonaws.com
    event.name: StartFHIRBulkDeleteJob
    event.outcome: success
    request.healthlake_fhir_purge_submitted: true
  condition: selection
falsepositives:
  - Approved Patient compartment purge.
level: critical
tags:
  - attack.impact
x_hacktricks_technique_id: aws-healthlake-patient-purge-submitted
