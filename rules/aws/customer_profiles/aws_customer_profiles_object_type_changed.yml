title: AWS Customer Profiles object mapping created or changed
id: 9fbcc727-7e11-48e0-9d52-0c89f4b98642
status: experimental
description: PutProfileObjectType changed the mapping or behavior of a profile object type. Review configuration diffs privately to determine whether keys, field targets or inferred-profile creation were altered.
