title: AWS Customer Profiles segment membership accessed
id: f2071a90-8d50-4634-951b-880e7ddca5f9
status: experimental
description: GetSegmentMembership requested membership for one or more profiles. CloudTrail redacts the result and marks this read-like API readOnly false; correlate with approved segment access.
x_hacktricks_technique_id: aws-customer-profiles-segment-membership-read
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-customer-profiles-post-exploitation/README.md#L31
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: profile.amazonaws.com
    event.name: GetSegmentMembership
    event.outcome: success
    request.customer_profiles_segment_membership_accessed: true
  condition: selection
level: medium
falsepositives:
- Approved membership lookup for customer workflows.
