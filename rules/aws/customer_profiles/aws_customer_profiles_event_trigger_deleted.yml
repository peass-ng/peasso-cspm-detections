references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-customer-profiles-post-exploitation/README.md#L185
- https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-customer-profiles_DeleteEventTrigger.html
logsource:
  product: aws
  service: cloudtrail
detection:
