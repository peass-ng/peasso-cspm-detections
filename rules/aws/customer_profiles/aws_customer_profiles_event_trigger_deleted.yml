title: AWS Customer Profiles event trigger deleted
id: 93c16f75-5998-4e73-a089-9c1d61268396
status: experimental
description: DeleteEventTrigger disabled and removed a trigger. AWS rejects deletion while an active integration is associated, so correlate preceding integration removal where relevant.
