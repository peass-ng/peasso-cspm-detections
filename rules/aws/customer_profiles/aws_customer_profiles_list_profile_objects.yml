title: AWS Customer Profiles source objects read accepted
id: f449100d-7633-4bb1-b4c3-11290d6a7e07
status: experimental
description: ListProfileObjects queried source records attached to a profile. These records can contain data absent from standard fields; the event alone does not prove any object was returned.
x_hacktricks_technique_id: aws-tech-0b6f29e84f5ac102
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-customer-profiles-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: profile.amazonaws.com
    event.name: ListProfileObjects
    event.outcome: success
    request.customer_profiles_read_observed: true
  condition: selection
level: low
falsepositives:
- Approved source-record access
