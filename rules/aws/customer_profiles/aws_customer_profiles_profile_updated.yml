title: AWS Customer Profiles standard profile updated
id: 7d2a6e80-3743-4c6d-9ae0-a318d63896f8
status: experimental
description: UpdateProfile accepted a write to an existing profile. Evaluate actor, target and approved change; the event does not reveal which fields changed.
x_hacktricks_technique_id: aws-tech-132b4254e96ea051
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-customer-profiles-post-exploitation/README.md#L68
- https://docs.aws.amazon.com/connect/latest/APIReference/API_connect-customer-profiles_UpdateProfile.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: profile.amazonaws.com
    event.name: UpdateProfile
    event.outcome: success
    request.customer_profiles_profile_updated: true
  condition: selection
level: medium
falsepositives:
- Approved agent or integration profile update
