title: AWS Customer Profiles calculated attributes read accepted
id: 6751a025-b0b1-4b4d-a876-07fb33eeb2bb
status: experimental
description: ListCalculatedAttributesForProfile queried derived attributes for a profile. Review reader authorization and result sensitivity; the event alone does not prove returned values.
