title: GameLift build upload credentials requested
id: 30900000-0000-4000-8000-000000000002
status: experimental
description: >
  RequestUploadCredentials accepted a request for short-lived S3 credentials
  scoped to a GameLift build. Review the build owner and subsequent uploads;
  this event does not show that build files were uploaded or a fleet used them.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-gamelift-post-exploitation/README.md#L45
  - https://docs.aws.amazon.com/gameliftservers/latest/apireference/API_RequestUploadCredentials.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: gamelift.amazonaws.com
    event.name: RequestUploadCredentials
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved build upload or credential refresh.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-gamelift-build-upload-credentials-requested
x_cloudtrail_raw: true
