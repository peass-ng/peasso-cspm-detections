title: CodeCommit service credential reset for another IAM user
id: e6f13d57-d481-4f67-a500-b39e15987bf7
status: experimental
description: >
  An IAM user reset an active CodeCommit HTTPS Git credential for another user.
  The event does not prove repository access or credential use.
x_hacktricks_technique_id: aws-codecommit-other-user-service-credential-reset
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#L183
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: ResetServiceSpecificCredential
    event.outcome: success
    request.service_name: codecommit.amazonaws.com
    request.other_user_service_credential_reset: true
  condition: selection
level: medium
falsepositives:
  - Approved CodeCommit credential rotation for another IAM user.
