title: CodeCommit file read by known path
id: e9b1ef76-d35b-46d1-8704-34cdfb2d1831
status: experimental
description: A successful GetFile call accessed a named file in a repository. CloudTrail
  does not prove what bytes were returned; review approved source readers.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-codecommit-source-access-post-exploitation/README.md#L17
- https://docs.aws.amazon.com/codecommit/latest/userguide/integ-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: codecommit.amazonaws.com
    event.name: GetFile
    event.outcome: success
    request.codecommit_known_file_read: true
  condition: selection
falsepositives:
- Approved source inspection
level: low
tags:
- attack.collection
x_hacktricks_technique_id: aws-tech-a9be9ac2ab0765e2
