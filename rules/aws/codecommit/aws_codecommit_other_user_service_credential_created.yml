title: CodeCommit service credential created for another IAM user
id: 81ec00f2-413a-49d5-a09d-608616cf15be
status: experimental
description: >
  An IAM user created an active CodeCommit HTTPS Git credential for another user.
  Review authorization and repository access separately.
x_hacktricks_technique_id: aws-codecommit-other-user-service-credential-created
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-iam-privesc/README.md#L183
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iam.amazonaws.com
    event.name: CreateServiceSpecificCredential
    event.outcome: success
    request.service_name: codecommit.amazonaws.com
    request.other_user_service_credential_created: true
  condition: selection
level: medium
falsepositives:
  - Approved CodeCommit credential provisioning for another IAM user.
