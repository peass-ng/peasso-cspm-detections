title: MediaConnect flow source updated
id: 31800000-0000-4000-8000-000000000004
status: experimental
description: >
  UpdateFlowSource succeeded. Review source allowlists, ingest endpoint and
  decryption settings for unauthorized senders. This event-level signal does
  not identify which field changed without inspecting request or readback.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mediaconnect-post-exploitation/README.md#L78
  - https://docs.aws.amazon.com/mediaconnect/latest/api/API_UpdateFlowSource.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: mediaconnect.amazonaws.com
    event.name: UpdateFlowSource
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved contribution source maintenance.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-mediaconnect-flow-source-updated
x_cloudtrail_raw: true
