title: Athena notebook update requested by a different principal
id: 2b1a7658-6219-522f-abe8-a3d9233590f5
status: experimental
description: An accepted Athena API request matched a bounded role/workgroup or cross-principal
  notebook/session correlation. Review approved Spark operators and execution-role
  permissions; the event alone does not prove unauthorized code or token use.
x_hacktricks_technique_id: aws-tech-bb35c47db9087190
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-athena-stored-query-privesc/README.md#L23
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: athena.amazonaws.com
    event.name: AthenaSparkUpdateNotebook
    event.outcome: success
    request.athena_cross_actor_notebook_updated: true
  condition: selection
level: medium
falsepositives:
- Approved collaborative notebook operations or authorized workgroup provisioning.
