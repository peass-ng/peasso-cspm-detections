title: Athena notebook bearer URL requested by a different principal
id: 611a2279-516d-5e4a-8a3c-d10a798900af
status: experimental
description: An accepted Athena API request matched a bounded role/workgroup or cross-principal
  notebook/session correlation. Review approved Spark operators and execution-role
  permissions; the event alone does not prove unauthorized code or token use.
x_hacktricks_technique_id: aws-tech-857491e37b090f4d
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-athena-spark-role-privesc/README.md#L129
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: athena.amazonaws.com
    event.name: AthenaSparkCreatePresignedNotebookUrl
    event.outcome: success
    request.athena_cross_actor_notebook_url_requested: true
  condition: selection
level: high
falsepositives:
- Approved collaborative notebook operations or authorized workgroup provisioning.
