title: MWAA Serverless workflow run details read
id: 32300000-0000-4000-8000-000000000002
status: experimental
description: >
  GetWorkflowRun may disclose caller-supplied override parameters and task status. CloudTrail logs the read but omits the response; validate whether the run carried sensitive parameters.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-mwaa-post-exploitation/README.md#L116
  - https://docs.aws.amazon.com/mwaa/latest/mwaa-serverless-userguide/log-apis-with-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: airflow-serverless.amazonaws.com
    event.name: GetWorkflowRun
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Authorized monitoring of a workflow run.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-mwaa-serverless-workflow-run-details-read
x_cloudtrail_raw: true
