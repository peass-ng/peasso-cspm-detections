title: Launch Wizard deployment deleted
id: 18900000-0000-4000-8000-000000000002
status: experimental
description: >
  An accepted DeleteDeployment request initiated deletion of a Launch Wizard
  deployment and its managed resources. The event does not prove downstream
  deletion completed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-launch-wizard-post-exploitation/README.md#L55
  - https://docs.aws.amazon.com/launchwizard/latest/APIReference/API_DeleteDeployment.html
  - https://docs.aws.amazon.com/launchwizard/latest/userguide/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: launchwizard.amazonaws.com
    event.name: DeleteDeployment
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved workload decommissioning.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-launch-wizard-deployment-deleted
x_cloudtrail_raw: true
