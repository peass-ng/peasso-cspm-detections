title: S3 Access Point policy submitted
id: b562fdfb-d7a4-4633-baaf-78d250246415
status: experimental
description: >
  Successful policy submission is visible, but CloudTrail omits both policy content and Access Point name. Inventory is needed to identify the grantee.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-s3-persistence/README.md#L40
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points-policies.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3.amazonaws.com
    event.name: PutAccessPointPolicy
    event.outcome: success
    request.s3_access_point_policy_submitted: true
  condition: selection
falsepositives:
  - Approved S3 access management or retention operation.
level: low
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-tech-85930f3418c472fe
