title: S3 current object ACL changed to public read
id: 2df27f6f-7aab-45e7-8bc5-1dedcd877fc7
status: experimental
description: >
  A successful object data event applies a public canned ACL to the current version. Effective public access still depends on Object Ownership and Block Public Access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-post-exploitation/README.md#L835
  - https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutObjectAcl.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3.amazonaws.com
    event.name: PutObjectAcl
    event.outcome: success
    request.s3_current_object_public_acl: true
  condition: selection
falsepositives:
  - Approved S3 access or browser configuration change.
level: medium
tags:
  - attack.exfiltration
x_hacktricks_technique_id: aws-tech-4f83958045d9d441
