title: S3 object version written with customer-provided encryption key
id: 81f53a15-eb12-4aa2-9f6c-e75b7c4a0825
status: experimental
description: >
  An accepted S3 PutObject data event wrote a new version under SSE-C.
  CloudTrail confirms the AES256 customer-key mode and returned version ID,
  but does not reveal the key or prove that this object had an earlier
  version in the ingested window. Check object inventory for overwrite impact.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-s3-post-exploitation/README.md#L394
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerSideEncryptionCustomerKeys.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3.amazonaws.com
    event.name: S3ObjectVersionWrittenWithCustomerKey
    event.outcome: success
    request.s3_object_version_ssec_written: true
  condition: selection
falsepositives:
  - Approved workload that stores customer-encrypted object versions.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-tech-dff7e5647f79a82d
