title: S3 bucket delegates object reads to account Access Points
id: 50dcdd2b-b0fc-44e0-a93b-1fecff99e9c0
status: experimental
description: >
  Successful bucket policy permits GetObject via Access Points owned by the bucket account. It does not identify an Access Point policy or reader.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-s3-persistence/README.md#L40
  - https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points-policies.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: s3.amazonaws.com
    event.name: PutBucketPolicy
    event.outcome: success
    request.s3_bucket_access_point_delegation: true
  condition: selection
falsepositives:
  - Approved S3 access management or retention operation.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-tech-85930f3418c472fe
