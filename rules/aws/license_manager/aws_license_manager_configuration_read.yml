title: License Manager configuration read
id: 13000000-0000-4000-8000-000000000002
status: experimental
description: >
  GetLicenseConfiguration queried one self-managed license configuration; CloudTrail omitted the returned settings.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-license-manager-post-exploitation/README.md#L116
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: license-manager.amazonaws.com
    event.name: LicenseConfigurationRead
    event.outcome: success
    request.license_configuration_read: true
  condition: selection
falsepositives:
  - Authorized license inventory or troubleshooting.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-license-manager-configuration-read
