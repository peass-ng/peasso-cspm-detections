title: License Manager seller license versions listed
id: 13100000-0000-4000-8000-000000000004
status: experimental
description: >
  ListLicenseVersions enumerated versions of a seller-issued license.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-license-manager-post-exploitation/README.md#L42
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: license-manager.amazonaws.com
    event.name: SellerLicenseVersionsListed
    event.outcome: success
    request.seller_license_versions_listed: true
  condition: selection
falsepositives:
  - Approved license version audit.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-license-manager-seller-license-versions-listed
