title: License Manager instance license specification removed
id: 13400000-0000-4000-8000-000000000002
status: experimental
description: >
  UpdateLicenseSpecificationsForResource accepted a license-configuration removal from an EC2 instance. This can change license tracking without deleting the instance.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-license-manager-post-exploitation/README.md#L110
  - https://docs.aws.amazon.com/license-manager/latest/APIReference/API_UpdateLicenseSpecificationsForResource.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: license-manager.amazonaws.com
    event.name: InstanceLicenseSpecificationRemoved
    event.outcome: success
    request.instance_license_specification_removed: true
  condition: selection
falsepositives:
  - Approved instance license governance change.
level: high
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-license-manager-instance-license-specification-removed
