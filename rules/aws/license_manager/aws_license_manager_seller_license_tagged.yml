title: License Manager seller license tagged
id: 13100000-0000-4000-8000-000000000009
status: experimental
description: >
  TagResource changed tags on a seller-issued license. Review tag-based access controls for unexpected changes.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-license-manager-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: license-manager.amazonaws.com
    event.name: SellerLicenseTagged
    event.outcome: success
    request.seller_license_tagged: true
  condition: selection
falsepositives:
  - Approved license metadata update.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-license-manager-seller-license-tagged
