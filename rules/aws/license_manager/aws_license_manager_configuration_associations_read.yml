title: License Manager configuration associations read
id: 13000000-0000-4000-8000-000000000005
status: experimental
description: >
  ListAssociationsForLicenseConfiguration queried resource associations of one license configuration. The response was omitted from CloudTrail.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-license-manager-post-exploitation/README.md#L125
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: license-manager.amazonaws.com
    event.name: LicenseConfigurationAssociationsRead
    event.outcome: success
    request.license_configuration_associations_read: true
  condition: selection
falsepositives:
  - Authorized association inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-license-manager-configuration-associations-read
