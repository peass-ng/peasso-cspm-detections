title: AWS SNS FIFO topic archive policy cleared
id: eb935949-653b-453b-8487-7b01364daf71
status: experimental
description: A successful SetTopicAttributes set ArchivePolicy to an empty object. This deactivates archiving and removes retained messages after the change propagates.
x_hacktricks_technique_id: aws-sns-fifo-archive-cleared
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sns-post-exploitation/aws-sns-fifo-replay-exfil.md
  - https://docs.aws.amazon.com/sns/latest/dg/message-archiving-and-replay-subscriber.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: SetTopicAttributes
    event.outcome: success
    request.sns_archive_cleared: true
  condition: selection
level: medium
falsepositives:
  - Approved archive retirement
