title: AWS SNS FIFO replay policy set on existing subscription
id: a4e1bd45-149b-4ed6-9888-0396541ecc05
status: experimental
description: A successful SetSubscriptionAttributes wrote a timestamp ReplayPolicy. Review the endpoint, selected history and subsequent replay metrics.
x_hacktricks_technique_id: aws-sns-fifo-replay-existing-subscription
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sns-post-exploitation/aws-sns-fifo-replay-exfil.md
  - https://docs.aws.amazon.com/sns/latest/dg/message-archiving-and-replay-subscriber.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: SetSubscriptionAttributes
    event.outcome: success
    request.sns_replay_policy_set: true
  condition: selection
level: medium
falsepositives:
  - Approved replay after a subscriber outage
