title: AWS SNS topic KMS key cleared
id: fd667af3-f4d3-4236-9d12-c96dc4f6c703
status: experimental
description: A successful SetTopicAttributes cleared KmsMasterKeyId on a topic. Review whether encryption at rest was previously enabled and whether the change was approved.
x_hacktricks_technique_id: aws-sns-topic-kms-key-cleared
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sns-post-exploitation/README.md#L99
  - https://docs.aws.amazon.com/sns/latest/api/API_SetTopicAttributes.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: SetTopicAttributes
    event.outcome: success
    request.sns_kms_key_cleared: true
  condition: selection
level: medium
falsepositives:
  - Approved change to topic encryption settings
