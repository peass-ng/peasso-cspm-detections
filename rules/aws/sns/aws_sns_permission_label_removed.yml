title: SNS topic permission label removed
id: 0e97d70f-2742-45d0-825b-5d1bb742fa81
status: experimental
description: A successful RemovePermission call named a topic and a policy statement label. The event does not show the removed statement or prove which publishers or subscribers lost access.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sns-post-exploitation/README.md#L173
  - https://docs.aws.amazon.com/sns/latest/api/API_RemovePermission.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: RemovePermission
    event.outcome: success
    request.permission_removed: true
  condition: selection
falsepositives:
  - Approved topic policy maintenance or grant retirement
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-sns-remove-permission-label
