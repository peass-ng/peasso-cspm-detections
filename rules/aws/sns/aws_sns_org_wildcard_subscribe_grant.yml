title: AWS SNS topic policy grants org-scoped wildcard Subscribe
id: d1eb01de-d15c-4263-9739-ec16d352a968
status: experimental
description: A successful topic policy write grants Subscribe to any principal matching a PrincipalOrgID condition. Review organization ownership and intended subscribers; no subscription or delivery is proven.
x_hacktricks_technique_id: aws-sns-topic-org-wildcard-subscribe-grant
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-sns-persistence/README.md#L13
  - https://docs.aws.amazon.com/sns/latest/api/API_SetTopicAttributes.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: SetTopicAttributes
    event.outcome: success
    request.sns_org_wildcard_subscribe_grant: true
  condition: selection
level: medium
falsepositives:
  - Approved organization-scoped topic sharing
