title: SNS message data protection policy cleared
id: 21900000-0000-4000-8000-000000000001
status: experimental
description: >
  An accepted PutDataProtectionPolicy used an empty document, removing the
  topic's message data protection policy. Compare the previous document and
  approved subscriptions before deciding whether outbound masking or denial
  was weakened. This event alone does not prove a protected policy existed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sns-post-exploitation/aws-sns-data-protection-bypass.md
  - https://docs.aws.amazon.com/sns/latest/dg/sns-message-data-protection-delete.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: PutDataProtectionPolicy
    event.outcome: success
    request.sns_data_protection_cleared: true
  condition: selection
falsepositives:
  - Approved retirement of SNS message data protection on a topic.
level: high
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-sns-message-data-protection-policy-cleared
