title: SNS DeleteTopic operation succeeded
id: 2bb58592-f0f9-4d2d-98c1-0e4579d10ca7
status: experimental
description: A successful DeleteTopic request named a topic in the audited account and Region. Review the previous topic state and change record; the event alone does not prove lost messages or malicious intent.
references:
