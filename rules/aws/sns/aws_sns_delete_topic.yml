  - https://docs.aws.amazon.com/sns/latest/api/API_DeleteTopic.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sns.amazonaws.com
    event.name: DeleteTopic
    event.outcome: success
    request.delete_topic_observed: true
  condition: selection
falsepositives:
  - Approved topic retirement or test cleanup
level: high
tags:
  - attack.impact
