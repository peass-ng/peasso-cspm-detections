title: IoT Wireless device destination changed
id: 12300000-0000-4000-8000-000000000008
status: experimental
description: >
  UpdateWirelessDevice rebound a device to another destination, potentially changing the route of future telemetry. Correlate with approved configuration changes.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-iot-wireless-persistence/README.md#L13
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessDeviceDestinationChanged
    event.outcome: success
    request.iotwireless_device_destination_changed: true
  condition: selection
falsepositives:
  - Approved IoT Wireless administration or troubleshooting.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-iotwireless-device-destination-changed
