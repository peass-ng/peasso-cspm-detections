title: IoT Wireless FUOTA firmware source set
id: 12300000-0000-4000-8000-000000000018
status: experimental
description: >
  UpdateFuotaTask supplied a firmware image URI. Compare with prior approved state to determine whether the image changed; the URI is omitted from findings.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L98
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessFuotaFirmwareSourceSet
    event.outcome: success
    request.iotwireless_fuota_firmware_source_set: true
  condition: selection
falsepositives:
  - Approved IoT Wireless fleet administration or troubleshooting.
level: high
tags:
  - attack.impact
x_hacktricks_technique_id: aws-iotwireless-fuota-firmware-source-set
