title: IoT Wireless device joined multicast group
id: 12300000-0000-4000-8000-000000000022
status: experimental
description: >
  AssociateWirelessDeviceWithMulticastGroup added a wireless device to a multicast group. This enables later group delivery after the device completes network setup.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L98
  - https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_AssociateWirelessDeviceWithMulticastGroup.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessDeviceJoinedMulticastGroup
    event.outcome: success
    request.iotwireless_device_joined_multicast_group: true
  condition: selection
falsepositives:
  - Approved IoT Wireless fleet or firmware rollout administration.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-iotwireless-device-joined-multicast-group
