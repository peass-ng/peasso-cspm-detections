title: IoT Wireless network analyzer configured
id: 12300000-0000-4000-8000-000000000009
status: experimental
description: >
  CreateNetworkAnalyzerConfiguration configured wireless trace scope. In observed Event History, this create event has readOnly=true.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L44
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessAnalyzerConfigured
    event.outcome: success
    request.iotwireless_analyzer_configured: true
  condition: selection
falsepositives:
  - Approved IoT Wireless administration or troubleshooting.
level: medium
tags:
  - attack.collection
x_hacktricks_technique_id: aws-iotwireless-analyzer-configured
