title: IoT Wireless device secrets read
id: 12300000-0000-4000-8000-000000000001
status: experimental
description: >
  GetWirelessDevice read a wireless device configuration that can return LoRaWAN or Sidewalk onboarding secrets. The keys are omitted from CloudTrail.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessDeviceSecretsRead
    event.outcome: success
    request.iotwireless_device_secrets_read: true
  condition: selection
falsepositives:
  - Approved IoT Wireless administration or troubleshooting.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-iotwireless-device-secrets-read
