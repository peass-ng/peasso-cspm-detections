title: IoT Wireless FUOTA task updated
id: 12300000-0000-4000-8000-000000000017
status: experimental
description: >
  UpdateFuotaTask modified a firmware update task. A description-only update can also match.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L98
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessFuotaTaskUpdated
    event.outcome: success
    request.iotwireless_fuota_task_updated: true
  condition: selection
falsepositives:
  - Approved IoT Wireless fleet administration or troubleshooting.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-iotwireless-fuota-task-updated
