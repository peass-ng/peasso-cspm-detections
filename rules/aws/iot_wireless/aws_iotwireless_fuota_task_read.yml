title: IoT Wireless FUOTA task read
id: 12300000-0000-4000-8000-000000000016
status: experimental
description: >
  GetFuotaTask inspected an update task. Review unusual firmware configuration discovery.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-iot-wireless-enum.md#L37
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessFuotaTaskRead
    event.outcome: success
    request.iotwireless_fuota_task_read: true
  condition: selection
falsepositives:
  - Approved IoT Wireless fleet administration or troubleshooting.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-iotwireless-fuota-task-read
