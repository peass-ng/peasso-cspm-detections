title: IoT Wireless device profile read
id: 12300000-0000-4000-8000-000000000005
status: experimental
description: >
  GetDeviceProfile inspected device radio settings. Review unusual wireless profile discovery.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-iot-wireless-enum.md#L22
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessDeviceProfileRead
    event.outcome: success
    request.iotwireless_device_profile_read: true
  condition: selection
falsepositives:
  - Approved IoT Wireless administration or troubleshooting.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-iotwireless-device-profile-read
