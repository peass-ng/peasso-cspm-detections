title: IoT Wireless multicast group created
id: 12300000-0000-4000-8000-000000000012
status: experimental
description: >
  CreateMulticastGroup added a group that can be used to address multiple wireless devices. Creation alone does not prove any packet delivery.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L98
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessMulticastGroupCreated
    event.outcome: success
    request.iotwireless_multicast_group_created: true
  condition: selection
falsepositives:
  - Approved IoT Wireless fleet administration or troubleshooting.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-iotwireless-multicast-group-created
