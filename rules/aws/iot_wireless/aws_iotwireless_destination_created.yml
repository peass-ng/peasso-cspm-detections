title: IoT Wireless destination created
id: 12300000-0000-4000-8000-000000000007
status: experimental
description: >
  CreateDestination added a wireless routing destination. Review the role and expression in live configuration inventory because CloudTrail can redact them.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-iot-wireless-persistence/README.md#L13
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessDestinationCreated
    event.outcome: success
    request.iotwireless_destination_created: true
  condition: selection
falsepositives:
  - Approved IoT Wireless administration or troubleshooting.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-iotwireless-destination-created
