title: IoT Wireless device left FUOTA task
id: 12300000-0000-4000-8000-000000000025
status: experimental
description: >
  DisassociateWirelessDeviceFromFuotaTask removed a device from a firmware update task, potentially suppressing an approved rollout.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-iot-wireless-post-exploitation/README.md#L98
  - https://docs.aws.amazon.com/iot-wireless/latest/apireference/API_DisassociateWirelessDeviceFromFuotaTask.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: iotwireless.amazonaws.com
    event.name: IotWirelessDeviceLeftFuotaTask
    event.outcome: success
    request.iotwireless_device_left_fuota_task: true
  condition: selection
falsepositives:
  - Approved IoT Wireless fleet or firmware rollout administration.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-iotwireless-device-left-fuota-task
