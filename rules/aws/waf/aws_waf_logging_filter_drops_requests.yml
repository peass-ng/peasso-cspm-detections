title: WAF logging configuration drops requests
id: 7330b79e-2fa6-44cf-8714-f16444d0f214
status: experimental
description: >
  An accepted WAF logging configuration drops requests by default or
  through an explicit DROP filter. Compare the previous configuration and
  protected resources to assess the visibility lost.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-waf-persistence/README.md#L84
  - https://docs.aws.amazon.com/waf/latest/developerguide/logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: PutLoggingConfiguration
    event.outcome: success
    request.waf_logging_drops_traffic: true
  condition: selection
falsepositives:
  - Approved selective logging or request sampling policy.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-logging-filter-drops-requests
