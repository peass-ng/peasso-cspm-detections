title: WAF Web ACL created
id: 26200000-0000-4000-8000-000000000007
status: experimental
description: >
  A successful CreateWebACL added a Web ACL. Review default action, rules and later resource association; an unassociated ACL does not protect or expose an application.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L257
