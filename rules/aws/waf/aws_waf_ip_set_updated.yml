title: WAF IP set updated
id: 26200000-0000-4000-8000-000000000002
status: experimental
description: >
  A successful UpdateIPSet replaced addresses in an IP set. Compare the before and after address lists and determine whether an active rule references the set; this event alone does not prove a bypass.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L401
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_UpdateIPSet.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: UpdateIPSet
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved address-list maintenance.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-ip-set-updated
x_cloudtrail_raw: true
