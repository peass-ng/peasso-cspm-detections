title: WAF logging hides URI path or query string
id: 31aaeb74-50e0-4be5-b3ce-ebbb151dd3a6
status: experimental
description: >
  An accepted WAF logging configuration redacts URI paths or query strings.
  Review whether application attack evidence or identifiers are lost in
  WAF logs, and whether the redaction is required for privacy.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-waf-persistence/README.md#L84
  - https://docs.aws.amazon.com/waf/latest/developerguide/logging.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: PutLoggingConfiguration
    event.outcome: success
    request.waf_logging_redacts_location: true
  condition: selection
falsepositives:
  - Approved redaction of personal data in paths or queries.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-logging-location-redacted
