title: WAF Web ACL updated
id: 26200000-0000-4000-8000-000000000008
status: experimental
description: >
  A successful UpdateWebACL replaced mutable Web ACL settings. Compare the default action and rule set against the prior configuration; this API-level signal includes benign updates as well as weakening.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L257
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_UpdateWebACL.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: UpdateWebACL
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Web ACL tuning.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-web-acl-updated
x_cloudtrail_raw: true
