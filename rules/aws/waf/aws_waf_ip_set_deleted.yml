title: AWS WAF IP set deleted
id: 20400000-0000-4000-8000-000000000001
status: experimental
description: >
  An AWS WAF IP set was deleted. This can remove an address control if the set
  was in use; the event alone does not show Web ACL references or traffic impact.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L401
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_DeleteIPSet.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: DeleteIPSet
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved removal of an unused IP set.
level: low
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-ip-set-deleted
x_cloudtrail_raw: true
