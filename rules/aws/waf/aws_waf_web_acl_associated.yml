title: WAF Web ACL associated with an application resource
id: 26300000-0000-4000-8000-000000000001
status: experimental
description: >
  A successful AssociateWebACL attached or replaced the WAF Web ACL on an
  application resource. Compare the new ACL with the previous association and
  inspect its rules and default action. The API event alone does not prove
  that protection was weakened or that requests reached the application.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L369
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_AssociateWebACL.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: AssociateWebACL
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Web ACL rollout or protection replacement.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-web-acl-associated
x_cloudtrail_raw: true
