title: WAF regex pattern set updated
id: 26200000-0000-4000-8000-000000000004
status: experimental
description: >
  A successful UpdateRegexPatternSet replaced the patterns in a set. Compare old and new expressions and active references; the event does not establish that any protected request passed.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L97
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_UpdateRegexPatternSet.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: UpdateRegexPatternSet
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved WAF expression maintenance.
level: medium
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-regex-pattern-set-updated
x_cloudtrail_raw: true
