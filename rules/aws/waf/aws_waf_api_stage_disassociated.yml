title: WAF Web ACL disassociated from API Gateway REST stage
id: 2cbe8624-4b17-4222-b6ae-41d78fd2ce4d
status: experimental
description: >
  A WAF disassociation request for an API Gateway REST stage succeeded.
  Confirm the stage's prior association and any replacement protection.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-waf-persistence/README.md#L111
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_DisassociateWebACL.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: DisassociateWebACL
    event.outcome: success
    request.waf_api_stage_disassociated: true
  condition: selection
falsepositives:
  - Approved replacement or removal of an API stage Web ACL.
level: high
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-api-stage-disassociated
