title: AWS WAF IP set tags removed
id: 20500000-0000-4000-8000-000000000002
status: experimental
description: >
  Tags were removed from a WAF IP set. This can affect access controls or
  automation only when those tags have security meaning; compare with an
  approved tag baseline before treating the change as malicious.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-waf-post-exploitation/README.md#L128
  - https://docs.aws.amazon.com/waf/latest/APIReference/API_UntagResource.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: wafv2.amazonaws.com
    event.name: UntagResource
    event.outcome: success
    request.waf_ipset_tags_removed: true
  condition: selection
falsepositives:
  - Approved IP set tag maintenance.
level: low
tags:
  - attack.defense-evasion
x_hacktricks_technique_id: aws-waf-ipset-tags-removed
