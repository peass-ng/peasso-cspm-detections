title: SageMaker Feature Store record read
id: 15000000-0000-4000-8000-000000000003
status: experimental
description: >
  A successful GetRecord data event read from a SageMaker Feature Store group. A caller could obtain feature values without access to a model or endpoint; this event alone does not establish exfiltration. Review the reader, expected workload and access volume.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sagemaker-post-exploitation/README.md#L272
  - https://docs.aws.amazon.com/sagemaker/latest/dg/feature-store-logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sagemaker.amazonaws.com
    event.name: GetRecord
    event.category: Data
    event.outcome: success
    event.read_only: true
    resource.type: AWS::SageMaker::FeatureGroup
  condition: selection
falsepositives:
  - Approved inference or feature-inspection workflow.
level: low
tags:
  - attack.collection
x_hacktricks_technique_id: aws-sagemaker-feature-store-record-read
x_cloudtrail_raw: true
