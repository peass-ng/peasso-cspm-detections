title: SageMaker pipeline execution retried
id: 14900000-0000-4000-8000-000000000002
status: experimental
description: >
  RetryPipelineExecution succeeded for an existing execution. The retry uses stored definition, role and parameters; examine the original run and caller before treating the replay as suspicious.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-sagemaker-post-exploitation/README.md#L519
  - https://docs.aws.amazon.com/sagemaker/latest/APIReference/API_RetryPipelineExecution.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: sagemaker.amazonaws.com
    event.name: SageMakerPipelineExecutionRetried
    event.outcome: success
    request.sagemaker_pipeline_execution_retried: true
  condition: selection
falsepositives:
  - Approved retry of a failed pipeline execution.
level: low
tags:
  - attack.execution
x_hacktricks_technique_id: aws-sagemaker-pipeline-execution-retried
