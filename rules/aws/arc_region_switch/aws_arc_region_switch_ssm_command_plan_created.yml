title: AWS ARC Region Switch plan with SSM command step created
id: b3710000-0000-4000-8000-000000000001
status: experimental
description: >
  CreatePlan accepted a plan whose workflows contain an SSM SendCommand
  execution block and whose response confirms the same plan and execution
  role. The step can run a command document as that role when the plan reaches
  it. This signal does not prove the plan ran or that any node received a
  command. Review role permissions, documents, targets and plan approvals.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/9725dcb0f71c664994b24647815f17f3e330bfc3/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-region-switch-privesc/README.md#L20
  - https://docs.aws.amazon.com/r53recovery/latest/dg/ssm-send-command-block.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: arc-region-switch.amazonaws.com
    event.name: CreatePlan
    event.outcome: success
    request.arc_ssm_command_plan_created: true
  condition: selection
falsepositives:
  - Approved disaster recovery plan with an SSM command step.
level: high
tags:
  - attack.privilege-escalation
  - attack.persistence
x_hacktricks_technique_id: aws-arc-region-switch-ssm-command-plan-created
