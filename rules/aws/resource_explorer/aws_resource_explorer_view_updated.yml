title: AWS Resource Explorer view configuration updated
id: 1a966366-330e-459c-af53-8d8fca1b456d
status: experimental
description: An account-owned Resource Explorer view was updated. CloudTrail redacts the filter, so compare view snapshots to determine whether its search scope widened.
x_hacktricks_technique_id: aws-resource-explorer-view-update
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-resource-explorer-view-privesc/README.md#L15
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: resource-explorer-2.amazonaws.com
    event.name: UpdateView
    event.outcome: success
    request.resource_explorer_view_updated: true
  condition: selection
level: medium
falsepositives:
- Approved view filter or included-property maintenance
