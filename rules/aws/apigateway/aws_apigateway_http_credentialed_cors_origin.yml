title: API Gateway HTTP API allows credentialed CORS from explicit origin
id: 8a27daa1-584c-4787-beb2-ff74b9884a33
status: experimental
description: >
  A successful HTTP API update allowed browser credentials from a named HTTPS
  origin. Compare origins to the approved list and inspect routes and auth.
x_hacktricks_technique_id: aws-apigateway-http-credentialed-cors-origin
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-api-gateway-post-exploitation/README.md#L334
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: apigateway.amazonaws.com
    event.name: UpdateApi
    event.outcome: success
    request.apigateway_credentialed_cors_explicit_origin: true
  condition: selection
level: medium
falsepositives:
  - Approved browser client origin added to an HTTP API with credentialed CORS.
