title: API Gateway portal public authorization update published
id: 28033463-1017-4266-83fe-206813a956a7
status: experimental
description: >
  One principal changed a portal's authorization to None and published that
  same portal within an hour. Verify the previous authorization, included
  products and public endpoint; the management events alone do not prove that
  a browser fetched protected documentation.
x_hacktricks_technique_id: aws-apigateway-portal-auth-removed-published
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-api-gateway-post-exploitation/README.md#L262
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: apigateway.amazonaws.com
    event.name: ApiGatewayPortalPublicAuthPublished
    event.outcome: success
    request.apigateway_portal_public_auth_published: true
  condition: selection
level: high
falsepositives:
  - Approved transition of a developer portal to public access.
