title: API Gateway REST wildcard invoke policy published
id: dc609e2d-96c9-5222-9089-67a73e385e2f
status: experimental
description: An accepted REST API policy replacement allowed wildcard principals
  to invoke API methods and was followed by a deployment from the same principal
  within one hour. Other method authorization remains in force.
