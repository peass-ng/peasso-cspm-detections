title: API Gateway REST default execute-api endpoint enabled
id: ea4229b9-d6a2-4d7b-8af9-12948c08321a
status: experimental
description: >
  A successful REST API update set disableExecuteApiEndpoint to false.
  Redeployment is needed before the setting affects a stage.
x_hacktricks_technique_id: aws-apigateway-default-execute-endpoint-enabled
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-api-gateway-post-exploitation/README.md#L397
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: apigateway.amazonaws.com
    event.name: UpdateRestApi
    event.outcome: success
    request.apigateway_default_endpoint_enabled: true
  condition: selection
level: medium
falsepositives:
  - Approved exposure of the default endpoint during a release or migration.
