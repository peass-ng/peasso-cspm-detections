detection:
  selection:
    event.source: chime-sdk-media-pipelines.amazonaws.com
    event.name: DeleteMediaPipeline
    event.outcome: success
    request.chime_media_pipeline_deleted: true
  condition: selection
level: medium
falsepositives:
