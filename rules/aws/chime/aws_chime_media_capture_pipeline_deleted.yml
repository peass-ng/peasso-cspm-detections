title: Chime SDK media capture pipeline deleted
id: 7d512ab5-e3c0-4c07-9ffd-d517e278db1f
status: experimental
description: A successful DeleteMediaCapturePipeline request targeted an exact pipeline ID. It may stop recording, but CloudTrail alone does not prove participant media was active.
x_hacktricks_technique_id: aws-chime-media-capture-pipeline-deleted
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-chime-sdk-post-exploitation/README.md#L185
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: chime-sdk-media-pipelines.amazonaws.com
    event.name: DeleteMediaCapturePipeline
    event.outcome: success
    request.chime_media_capture_pipeline_deleted: true
  condition: selection
level: medium
falsepositives:
  - Approved recording teardown
