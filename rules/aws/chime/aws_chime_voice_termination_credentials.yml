title: Chime SDK Voice Connector termination credentials submitted
id: 2ffab03c-04a4-41a1-8fd4-090694957d75
status: experimental
description: A successful PutVoiceConnectorTerminationCredentials submitted SIP authentication credentials. Review the actor and rotate unexpected credentials; do not copy credential fields into alerts.
