title: Chime SDK SIP media application endpoint updated
id: baae4795-4b4d-415e-8a07-0c5fee746a0c
status: experimental
description: A SIP media application accepted an endpoint update. CloudTrail hides the Lambda ARN, so compare current service state with an approved inventory to determine the actual destination.
x_hacktricks_technique_id: aws-chime-sip-application-endpoint-updated
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-chime-sdk-post-exploitation/README.md#L253
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: chime-sdk-voice.amazonaws.com
    event.name: UpdateSipMediaApplication
    event.outcome: success
    request.chime_sip_application_endpoint_updated: true
  condition: selection
level: high
falsepositives:
  - Approved SIP application change
