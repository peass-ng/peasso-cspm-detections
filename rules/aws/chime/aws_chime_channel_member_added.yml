title: Chime SDK channel membership added
id: 2a6c92b7-5af9-40d8-bcb8-a10f747013e2
status: experimental
description: A successful CreateChannelMembership added a logical user to a channel. CloudTrail does not establish whether the channel was private or the grant was unauthorized.
x_hacktricks_technique_id: aws-chime-channel-member-add
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-chime-sdk-post-exploitation/README.md#L112
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: chime.amazonaws.com
    event.name: CreateChannelMembership
    event.outcome: success
    request.chime_channel_member_added: true
  condition: selection
level: medium
falsepositives:
  - Approved channel membership management
