title: Chime SDK Lambda channel flow created
id: 280ea3e4-81dd-4bb8-9aa4-f3205a27b911
status: experimental
description: A successful CreateChannelFlow registered a same-account Lambda processor. It can inspect standard messages after association with a channel; creation alone does not activate it.
