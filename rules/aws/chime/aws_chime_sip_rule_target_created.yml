title: Chime SDK SIP rule created with application target
id: 612be900-292b-4b81-abe4-378c3e0a3303
status: experimental
description: A SIP rule was created with an application target. It can be disabled at creation; this event alone does not prove that calls can route through it.
x_hacktricks_technique_id: aws-chime-sip-rule-target-created
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-chime-sdk-post-exploitation/README.md#L253
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: chime-sdk-voice.amazonaws.com
    event.name: CreateSipRule
    event.outcome: success
    request.chime_sip_rule_target_created: true
  condition: selection
level: medium
falsepositives:
  - Approved SIP rule deployment
