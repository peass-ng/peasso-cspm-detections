title: Cloud Map service instance registered or overwritten
id: 16900000-0000-4000-8000-000000000001
status: experimental
description: >
  A successful RegisterInstance set the address, port or custom attributes
  advertised by a Cloud Map service. The same action can replace an existing
  instance ID. Review service ownership and approved backend inventory;
  the event alone does not distinguish first registration from overwrite.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-cloud-map-post-exploitation/README.md#L19
  - https://docs.aws.amazon.com/cloud-map/latest/api/API_RegisterInstance.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: servicediscovery.amazonaws.com
    event.name: RegisterInstance
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved service discovery registration or backend update.
level: medium
tags:
  - attack.lateral-movement
x_hacktricks_technique_id: aws-cloudmap-instance-registered
x_cloudtrail_raw: true
