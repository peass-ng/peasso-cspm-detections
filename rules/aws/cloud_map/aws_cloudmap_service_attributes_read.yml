title: Cloud Map service attributes read through the data API
id: 25400000-0000-4000-8000-000000000003
status: experimental
description: >
  A principal used GetServiceAttributes to inspect service metadata. Review
  callers outside approved application or inventory roles. This event needs
  CloudTrail data logging for the Cloud Map service resource.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-cloud-map-enum.md
  - https://docs.aws.amazon.com/cloud-map/latest/dg/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: servicediscovery.amazonaws.com
    event.name: GetServiceAttributes
    event.category: Data
    event.outcome: success
    event.read_only: true
    resource.type: AWS::ServiceDiscovery::Service
  condition: selection
falsepositives:
  - Approved service metadata inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-cloudmap-service-attributes-read
x_cloudtrail_raw: true
