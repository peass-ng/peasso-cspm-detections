title: Cloud Map service instances discovered through the data API
id: 25400000-0000-4000-8000-000000000001
status: experimental
description: >
  A principal used DiscoverInstances to read registered service endpoints and
  attributes. Compare the caller with approved application roles. This rule
  requires CloudTrail data events for Cloud Map namespaces or services.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-cloud-map-enum.md
  - https://docs.aws.amazon.com/cloud-map/latest/dg/logging-using-cloudtrail.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: servicediscovery.amazonaws.com
    event.name: DiscoverInstances
    event.category: Data
    event.outcome: success
    event.read_only: true
    resource.type: AWS::ServiceDiscovery::Namespace
  condition: selection
falsepositives:
  - Approved service discovery by application clients.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-cloudmap-instances-discovered
x_cloudtrail_raw: true
