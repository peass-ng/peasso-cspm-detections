title: AgentCore Gateway target updated
id: 23700000-0000-4000-8000-000000000002
status: experimental
description: >
  A Gateway target was updated. Repointing it can alter where an agent sends
  tool arguments and receives tool responses. Compare the target backend and
  credential provider with the previous approved state; this event alone does
  not prove the backend changed or that an agent invoked it.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-bedrock-post-exploitation/README.md
  - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-add-target-api-target-config.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: bedrock-agentcore.amazonaws.com
    event.name: UpdateGatewayTarget
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::BedrockAgentCore::Gateway
  condition: selection
falsepositives:
  - Approved replacement of an agent tool backend.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-agentcore-gateway-target-updated
x_cloudtrail_raw: true
