title: AgentCore Gateway target created
id: 23700000-0000-4000-8000-000000000001
status: experimental
description: >
  A new Gateway target was added. A target can redirect an agent's tool calls
  and outbound credentials. Inspect its backend, schema and credential provider
  against the approved gateway inventory; creation alone does not prove an
  agent used the target or that its responses were malicious.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-bedrock-post-exploitation/README.md
  - https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-add-target-api.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: bedrock-agentcore.amazonaws.com
    event.name: CreateGatewayTarget
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::BedrockAgentCore::Gateway
  condition: selection
falsepositives:
  - Approved deployment of an agent tool backend.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-agentcore-gateway-target-created
x_cloudtrail_raw: true
