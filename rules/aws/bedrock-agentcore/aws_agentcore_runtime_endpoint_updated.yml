title: AgentCore Runtime endpoint configuration updated
id: 24100000-0000-4000-8000-000000000004
status: experimental
description: An AgentCore Runtime endpoint was updated. Compare its target version
  and description with the prior approved state; a description-only change is also
  accepted, so this event alone does not prove a version switch.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-bedrock-agentcore-privesc/README.md
- https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-get-started-code-deploy-python.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: bedrock-agentcore.amazonaws.com
    event.name: UpdateAgentRuntimeEndpoint
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::BedrockAgentCore::RuntimeEndpoint
  condition: selection
falsepositives:
- Approved endpoint description or version update.
level: low
tags:
- attack.privilege-escalation
x_hacktricks_technique_id: aws-agentcore-runtime-endpoint-updated
x_cloudtrail_raw: true
