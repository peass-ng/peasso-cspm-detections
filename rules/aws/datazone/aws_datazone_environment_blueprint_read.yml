title: Amazon DataZone environment blueprint read
id: b3550000-0000-4000-8000-000000000002
status: experimental
description: GetEnvironmentBlueprint succeeded. A caller can inspect the blueprint used for
  environment creation; this event alone does not prove a blueprint was enabled, configured
  or used.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-datazone-enum.md#L100
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetEnvironmentBlueprint.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetEnvironmentBlueprint
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved environment blueprint administration.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-getenvironmentblueprint-observed
x_cloudtrail_raw: true
