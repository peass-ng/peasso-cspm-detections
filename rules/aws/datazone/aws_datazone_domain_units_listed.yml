title: Amazon DataZone domain units listed
id: b3520000-0000-4000-8000-000000000002
status: experimental
description: A caller listed child domain units under a parent. This can map organizational
  boundaries when child units exist; the event alone does not prove any were returned.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-datazone-enum.md#L21
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_ListDomainUnitsForParent.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: ListDomainUnitsForParent
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved domain organization review.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-listdomainunitsforparent-enumeration
x_cloudtrail_raw: true
