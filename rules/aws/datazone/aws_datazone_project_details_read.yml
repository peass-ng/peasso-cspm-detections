title: Amazon DataZone project details read
id: b3510000-0000-4000-8000-000000000007
status: experimental
description: An authorized caller read a project. This can identify project configuration and
  ownership context, but it does not prove access to assets in that project.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L45
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetProject.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetProject
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved project administration or governance review.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-getproject-discovery
x_cloudtrail_raw: true
