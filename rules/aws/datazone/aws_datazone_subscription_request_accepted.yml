title: Amazon DataZone subscription request accepted
id: b3480000-0000-4000-8000-000000000002
status: experimental
description: >
  AcceptSubscriptionRequest succeeded. Inspect prior request status and the
  resulting subscription: this API can approve new consumer access, but it
  may also succeed for a request already accepted. The event alone does not
  establish an underlying data-plane grant.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L73
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_AcceptSubscriptionRequest.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: AcceptSubscriptionRequest
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved subscription decision by a project owner.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-datazone-subscription-request-accepted
x_cloudtrail_raw: true
