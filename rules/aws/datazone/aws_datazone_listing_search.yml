title: Amazon DataZone listings searched
id: b3360000-0000-4000-8000-000000000001
status: experimental
description: >
  SearchListings succeeded. This can reveal published asset metadata across a
  domain, including custom forms when requested. The rule identifies the API
  access and does not prove that any listing or form value was returned.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L15
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_SearchListings.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: SearchListings
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved catalog discovery and governance workflows.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-datazone-listing-search
x_cloudtrail_raw: true
