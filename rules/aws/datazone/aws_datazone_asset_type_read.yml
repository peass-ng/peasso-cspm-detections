title: Amazon DataZone asset type read
id: b3510000-0000-4000-8000-000000000002
status: experimental
description: An authorized caller read a DataZone asset type. This can reveal schema and expected
  form structure for later catalog searches. The event does not prove that any asset values
  were returned.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L45
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetAssetType.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetAssetType
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved asset modeling or catalog administration.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-getassettype-discovery
x_cloudtrail_raw: true
