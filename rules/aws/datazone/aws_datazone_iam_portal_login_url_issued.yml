title: Amazon DataZone IAM portal login URL issued
id: b3550000-0000-4000-8000-000000000001
status: experimental
description: GetIamPortalLoginUrl succeeded and issued a short-lived portal authorization URL
  to the caller. CloudTrail redacted the URL in the observed event. Check who requested it and
  subsequent portal activity; the event alone does not prove login or asset access.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-datazone-enum.md#L43
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetIamPortalLoginUrl.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetIamPortalLoginUrl
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved interactive portal sign-in by an authorized IAM principal.
level: medium
tags:
- attack.credential-access
x_hacktricks_technique_id: aws-datazone-getiamportalloginurl-observed
x_cloudtrail_raw: true
