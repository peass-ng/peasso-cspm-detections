title: Amazon DataZone environment blueprints listed
id: b3520000-0000-4000-8000-000000000006
status: experimental
description: A caller listed environment blueprints. This can reveal provisioning paths available
  in a domain, but this event alone does not prove a blueprint was enabled or used.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-datazone-enum.md#L100
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_ListEnvironmentBlueprints.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: ListEnvironmentBlueprints
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved environment administration or inventory.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-listenvironmentblueprints-enumeration
x_cloudtrail_raw: true
