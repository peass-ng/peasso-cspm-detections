title: Amazon DataZone projects listed
id: b3520000-0000-4000-8000-000000000003
status: experimental
description: A caller listed projects in a DataZone domain. This can identify catalog ownership
  boundaries when projects are returned; an empty result still generates an event.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-datazone-enum.md#L21
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_ListProjects.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: ListProjects
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved domain catalog inventory.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-listprojects-enumeration
x_cloudtrail_raw: true
