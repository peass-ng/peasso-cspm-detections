title: Amazon DataZone asset revision created
id: b3370000-0000-4000-8000-000000000001
status: experimental
description: >
  CreateAssetRevision succeeded. A new revision can change metadata later
  trusted by catalog consumers. Review the asset, form values and approval
  record; this event alone does not establish malicious content or publication.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L99
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_CreateAssetRevision.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: CreateAssetRevision
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved metadata correction or asset maintenance.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: aws-datazone-asset-revision-created
x_cloudtrail_raw: true
