title: Amazon DataZone subscription request details read
id: b3470000-0000-4000-8000-000000000002
status: experimental
description: >
  GetSubscriptionRequestDetails succeeded. This can reveal requested
  listings, principals, reasons and reviewer decisions. CloudTrail records
  the lookup but omits the returned details; inspect context before
  attributing discovery of a specific target.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L73
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetSubscriptionRequestDetails.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetSubscriptionRequestDetails
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved subscription approval or audit review.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-datazone-subscription-request-details-read
x_cloudtrail_raw: true
