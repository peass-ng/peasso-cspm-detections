title: Amazon DataZone subscription request created
id: b3470000-0000-4000-8000-000000000001
status: experimental
description: >
  CreateSubscriptionRequest succeeded. Inspect the requested listing and
  consumer project: a requester may seek access to a sensitive asset.
  The request can be accepted automatically for an authorized project owner,
  so this event alone does not establish a pending approval or data grant.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L73
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_CreateSubscriptionRequest.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: CreateSubscriptionRequest
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved project subscription workflow.
level: low
tags:
  - attack.collection
x_hacktricks_technique_id: aws-datazone-subscription-request-created
x_cloudtrail_raw: true
