title: Amazon DataZone form type read
id: b3510000-0000-4000-8000-000000000003
status: experimental
description: An authorized caller read a DataZone form type. The schema can guide targeting
  of catalog metadata fields, but this event does not disclose a specific asset form value.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L45
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetFormType.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetFormType
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved form modeling or catalog administration.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-getformtype-discovery
x_cloudtrail_raw: true
