title: Amazon DataZone asset details read
id: b3510000-0000-4000-8000-000000000001
status: experimental
description: An authorized caller read a DataZone asset revision. This can expose private catalog
  metadata, forms or schema to that caller. The event does not prove access to the underlying
  data.
references:
- https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L45
- https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetAsset.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetAsset
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
- Approved catalog review or project maintenance.
level: low
tags:
- attack.discovery
x_hacktricks_technique_id: aws-datazone-getasset-discovery
x_cloudtrail_raw: true
