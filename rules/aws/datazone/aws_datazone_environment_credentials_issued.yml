title: Amazon DataZone environment credentials issued
id: b3440000-0000-4000-8000-000000000002
status: experimental
description: >
  GetEnvironmentCredentials succeeded for a project environment. DataZone
  returns temporary credentials for its associated IAM role; CloudTrail omits
  the credential values. Correlate the caller, membership, role binding and
  later role session activity to determine whether access was unexpected.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-datazone-privesc/README.md#L15
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetEnvironmentCredentials.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetEnvironmentCredentials
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved project access to a custom service environment.
level: high
tags:
  - attack.privilege-escalation
  - attack.credential-access
x_hacktricks_technique_id: aws-datazone-environment-credentials-issued
x_cloudtrail_raw: true
