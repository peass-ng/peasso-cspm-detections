title: Amazon DataZone subscription details read
id: b3500000-0000-4000-8000-000000000001
status: experimental
description: >
  GetSubscription succeeded. An authorized caller can inspect the consumer,
  subscribed listing and status of a catalog subscription. CloudTrail records
  the lookup but does not prove that any underlying asset data was read.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-datazone-post-exploitation/README.md#L73
  - https://docs.aws.amazon.com/datazone/latest/APIReference/API_GetSubscription.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: datazone.amazonaws.com
    event.name: GetSubscription
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::DataZone::Domain
  condition: selection
falsepositives:
  - Approved subscription administration or audit review.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-datazone-subscription-details-read
x_cloudtrail_raw: true
