title: AWS Organizations accounts listed
id: 20200000-0000-4000-8000-000000000004
status: experimental
description: >
  A principal listed member accounts. CloudTrail does not expose the returned
  accounts in this event; review the caller against the approved inventory role.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-organizations-enum.md
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_ListAccounts.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: organizations.amazonaws.com
    event.name: ListAccounts
    event.outcome: success
    request.organizations_scope_listed: true
  condition: selection
falsepositives:
  - Approved account inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-organizations-accounts-listed
