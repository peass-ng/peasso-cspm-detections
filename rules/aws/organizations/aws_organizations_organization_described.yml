title: AWS organization described
id: 20200000-0000-4000-8000-000000000001
status: experimental
description: >
  A principal described the AWS Organization. This can precede organization
  policy or account targeting, but is also routine administration. CloudTrail
  omits the returned organization details from this event.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-organizations-enum.md#L28
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_DescribeOrganization.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: organizations.amazonaws.com
    event.name: DescribeOrganization
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::Organizations::Organization
  condition: selection
falsepositives:
  - Routine organization administration or inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-organizations-organization-described
x_cloudtrail_raw: true
