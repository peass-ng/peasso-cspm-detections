title: AWS Organizations roots listed
id: 20200000-0000-4000-8000-000000000003
status: experimental
description: >
  A principal listed organization roots. This can identify targets for policy
  changes, but the event alone is routine discovery and omits returned roots.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-services/aws-organizations-enum.md
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_ListRoots.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: organizations.amazonaws.com
    event.name: ListRoots
    event.outcome: success
    request.organizations_scope_listed: true
  condition: selection
falsepositives:
  - Approved organization inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-organizations-roots-listed
