title: AWS Organizations trusted service access listed
id: 20200000-0000-4000-8000-000000000002
status: experimental
description: >
  A principal listed services with trusted organization access. The event
  does not include the returned service principals or prove intent to disable
  a security integration; review the actor against the inventory workflow.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-organizations-post-exploitation/README.md#L51
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_ListAWSServiceAccessForOrganization.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: organizations.amazonaws.com
    event.name: ListAWSServiceAccessForOrganization
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: AWS::Organizations::Organization
  condition: selection
falsepositives:
  - Routine organization service integration inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-organizations-trusted-services-listed
x_cloudtrail_raw: true
