title: AWS Organizations delegated administrators listed
id: 20200000-0000-4000-8000-000000000005
status: experimental
description: >
  A principal listed delegated administrators, which may identify security
  integration owners. The event alone is discovery and omits returned accounts.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-organizations-post-exploitation/README.md
  - https://docs.aws.amazon.com/organizations/latest/APIReference/API_ListDelegatedAdministrators.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: organizations.amazonaws.com
    event.name: ListDelegatedAdministrators
    event.outcome: success
    request.organizations_scope_listed: true
  condition: selection
falsepositives:
  - Approved delegated administrator inventory.
level: low
tags:
  - attack.discovery
x_hacktricks_technique_id: aws-organizations-delegated-admins-listed
