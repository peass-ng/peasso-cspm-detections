title: AppConfig profile delegates Secrets Manager retrieval to a role
id: 2e4ec8a7-7be0-4fc3-8658-d555b1c24517
status: experimental
description: >
  A new configuration profile points to Secrets Manager and passes a retrieval
  role. A caller with AppConfig deployment and data access may later receive
  the secret through AppConfig even without direct Secrets Manager permission.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appconfig-privesc/README.md#L17
  - https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-creating-configuration-and-profile-iam-role.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appconfig.amazonaws.com
    event.name: CreateConfigurationProfile
    event.outcome: success
    request.appconfig_secret_retrieval_profile: true
  condition: selection
falsepositives:
  - Approved use of a Secrets Manager secret as application configuration.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-appconfig-secret-retrieval-profile-created
