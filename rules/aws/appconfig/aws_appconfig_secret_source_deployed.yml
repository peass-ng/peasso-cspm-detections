title: AppConfig deployment draws configuration from Secrets Manager
id: 74aed364-48b6-42d5-a316-c673551b6742
status: experimental
description: >
  A deployment was accepted for a profile sourced from Secrets Manager.
  Correlate its actor with the profile creator, retrieval role and later data
  reads before concluding that delegated secret access was abused.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-appconfig-privesc/README.md#L17
  - https://docs.aws.amazon.com/appconfig/latest/userguide/appconfig-deploying.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: appconfig.amazonaws.com
    event.name: StartDeployment
    event.outcome: success
    request.appconfig_secret_source_deployment: true
  condition: selection
falsepositives:
  - Approved deployment of a secret as application configuration.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-appconfig-secret-source-deployed
