title: Redshift cluster IAM role associations modified
id: 29400000-0000-4000-8000-000000000004
status: experimental
description: >
  ModifyClusterIamRoles changed the IAM roles associated with a Redshift cluster. Inspect added and default role ARNs and subsequent SQL use of AWS-backed features; the event alone does not prove that the role's permissions were exercised.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#L101
  - https://docs.aws.amazon.com/redshift/latest/APIReference/API_ModifyClusterIamRoles.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: redshift.amazonaws.com
    event.name: ModifyClusterIamRoles
    event.category: Management
    event.outcome: success
    event.read_only: false
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved Redshift integration role maintenance.
level: medium
tags:
  - attack.privilege-escalation
x_hacktricks_technique_id: aws-redshift-cluster-iam-roles-modified
x_cloudtrail_raw: true
