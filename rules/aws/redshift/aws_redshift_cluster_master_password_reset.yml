title: Amazon Redshift cluster master password reset
id: b3580000-0000-4000-8000-000000000002
status: experimental
description: >
  ModifyCluster succeeded with a master password field and the same cluster
  identifier in its response. This can create durable database administrator
  access. CloudTrail redacts the password; the event alone does not prove
  network reachability or a successful SQL login.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-persistence/aws-redshift-persistence/README.md#L42
  - https://docs.aws.amazon.com/redshift/latest/APIReference/API_ModifyCluster.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: redshift.amazonaws.com
    event.name: ModifyCluster
    event.outcome: success
    resource.type: AWS::Redshift::Cluster
    request.redshift_admin_password_reset: true
  condition: selection
falsepositives:
  - Approved rotation of the cluster master user password.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-redshift-cluster-master-password-reset
