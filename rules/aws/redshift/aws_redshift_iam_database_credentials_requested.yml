title: Redshift IAM-mapped database credentials requested
id: 29400000-0000-4000-8000-000000000002
status: experimental
description: >
  GetClusterCredentialsWithIAM returned temporary credentials for the caller's IAM-mapped database identity. Inspect that identity's SQL grants and subsequent database activity before attributing privilege escalation.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#L40
  - https://docs.aws.amazon.com/redshift/latest/APIReference/API_GetClusterCredentialsWithIAM.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: redshift.amazonaws.com
    event.name: GetClusterCredentialsWithIAM
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved IAM database authentication.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-redshift-iam-database-credentials-requested
x_cloudtrail_raw: true
