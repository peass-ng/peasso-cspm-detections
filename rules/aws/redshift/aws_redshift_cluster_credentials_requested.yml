title: Redshift database credentials requested
id: 29400000-0000-4000-8000-000000000001
status: experimental
description: >
  GetClusterCredentials returned temporary credentials for a named Redshift database user. Confirm the caller, database user and approved data access; the event does not show later SQL queries. The Redshift Data API can also invoke this call as part of a statement workflow.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#L15
  - https://docs.aws.amazon.com/redshift/latest/APIReference/API_GetClusterCredentials.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: redshift.amazonaws.com
    event.name: GetClusterCredentials
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved database login or Data API execution.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-redshift-cluster-credentials-requested
x_cloudtrail_raw: true
