title: Redshift Serverless database credentials requested
id: 29700000-0000-4000-8000-000000000001
status: experimental
description: >
  GetCredentials returned temporary credentials for the caller's IAM-mapped Redshift Serverless database user. Inspect its SQL grants and later database activity. The Redshift Data API can also obtain credentials as part of a statement workflow.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-privilege-escalation/aws-redshift-privesc/README.md#L75
  - https://docs.aws.amazon.com/redshift-serverless/latest/APIReference/API_GetCredentials.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: redshift-serverless.amazonaws.com
    event.name: GetCredentials
    event.category: Management
    event.outcome: success
    event.read_only: true
    resource.type: CloudTrail::UnscopedEvent
  condition: selection
falsepositives:
  - Approved IAM database authentication or Data API execution.
level: medium
tags:
  - attack.credential-access
x_hacktricks_technique_id: aws-redshift-serverless-credentials-requested
x_cloudtrail_raw: true
