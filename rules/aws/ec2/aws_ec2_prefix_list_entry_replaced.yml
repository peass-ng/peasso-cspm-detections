title: Customer-managed prefix list entry replaced
id: f7230893-388f-416a-80cd-e660b07447e8
status: experimental
description: >
  A successful ModifyManagedPrefixList request both removed and added CIDRs. Check the prior and resulting entry sets to assess the actual access change.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ec2-ebs-ssm-and-vpc-post-exploitation/aws-managed-prefix-list-backdoor.md#L60
  - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_ModifyManagedPrefixList.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ec2.amazonaws.com
    event.name: ModifyManagedPrefixList
    event.outcome: success
    request.prefix_list_entry_replaced: true
  condition: selection
falsepositives:
  - Approved CIDR rotation in a managed prefix list.
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-ec2-prefix-list-entry-replaced
