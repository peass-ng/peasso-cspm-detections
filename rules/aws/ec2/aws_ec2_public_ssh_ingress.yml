title: EC2 security group ingress opened to public SSH
id: 39461510-68ba-48b8-ac72-b3c57dfc3197
status: experimental
description: A successful AuthorizeSecurityGroupIngress request allowed TCP port 22 from 0.0.0.0/0. The event does not prove that an associated instance has a public IP or an SSH service listening.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47bb6e8f3237b01bd948bba508bd72f1d25069ee/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ec2-ebs-ssm-and-vpc-post-exploitation/README.md#L643
  - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AuthorizeSecurityGroupIngress.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ec2.amazonaws.com
    event.name: AuthorizeSecurityGroupIngress
    event.outcome: success
    request.public_ssh_ingress: true
  condition: selection
falsepositives:
  - Approved short-lived administrative access for a documented change
level: high
tags:
  - attack.initial-access
x_hacktricks_technique_id: aws-ec2-public-ssh-ingress
