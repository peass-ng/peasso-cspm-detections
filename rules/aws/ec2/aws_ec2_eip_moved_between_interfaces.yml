title: EIP moved between network interfaces
id: a73da3a8-c1ec-41a5-8fd5-08b584e3412c
status: experimental
description: >
  Two accepted AssociateAddress events moved one allocation ID between distinct network interfaces in the same account and Region within 30 minutes. Review the expected owner and traffic separately.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/47c375ae496ae89f81936f47ab1cb84885c88373/src/pentesting-cloud/aws-security/aws-post-exploitation/aws-ec2-ebs-ssm-and-vpc-post-exploitation/aws-eip-hijack-impersonation.md#L17
  - https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_AssociateAddress.html
logsource:
  product: aws
  service: cloudtrail
detection:
  selection:
    event.source: ec2.amazonaws.com
    event.name: AssociateAddress
    event.outcome: success
    request.eip_moved_between_interfaces: true
  condition: selection
falsepositives:
  - Approved Elastic IP failover or migration.
level: high
tags:
  - attack.persistence
x_hacktricks_technique_id: aws-ec2-eip-moved-between-interfaces
