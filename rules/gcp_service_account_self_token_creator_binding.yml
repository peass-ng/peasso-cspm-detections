title: Principal retained its own Token Creator binding on a service account
id: 857fa891-716e-474a-a3ed-e82fd9ca85ad
status: experimental
description: A successful service-account SetIAMPolicy response shows the calling principal in an unconditional Token Creator binding on that service account. The response contains resulting policy state and does not prove that this request added the binding or that the principal gained new effective access.
references:
  - https://docs.cloud.google.com/iam/docs/audit-logging/examples-service-accounts
  - https://docs.cloud.google.com/iam/docs/reference/rest/v1/projects.serviceAccounts/setIamPolicy
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: iam.googleapis.com
    event.name: service_account_token_creator_self_grant
    event.outcome: success
    request.self_grant: true
    request.binding_observed: true
    request.role: roles/iam.serviceAccountTokenCreator
  condition: selection
falsepositives:
  - Approved IAM policy maintenance that preserved a preexisting Token Creator binding
level: medium
tags:
  - attack.privilege_escalation
  - attack.persistence
x_hacktricks_technique_id: gcp-iam-serviceaccounts-setiampolicy
