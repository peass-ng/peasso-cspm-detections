title: Microsoft Entra service principal credential addition observed
id: 882aa90c-a910-4e34-a540-5ae4b72a35d9
status: experimental
description: A successful Core Directory audit activity records credentials added to a service principal. Review the initiating principal, target application, change approval and subsequent sign-ins. This event alone does not prove privilege gain, credential use or malicious intent.
references:
  - https://learn.microsoft.com/en-us/entra/identity/monitoring-health/reference-audit-activities
  - https://learn.microsoft.com/en-us/entra/architecture/security-operations-applications
  - https://cloud.hacktricks.wiki/en/pentesting-cloud/azure-security/az-privilege-escalation/az-entraid-privesc/index.html
logsource:
  product: azure
  service: entra
detection:
  selection:
    cloud.provider: azure
    event.source: entra.directoryAudit
    event.name: Add service principal credentials
    event.outcome: success
    credential.add_observed: true
  condition: selection
falsepositives:
  - Approved service principal credential rotation or recovery
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: azure-entra-service-principal-credential-addition
