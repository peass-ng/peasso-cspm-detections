title: Secret Manager secret delete operation observed
id: 0f6adebc-99d7-5452-88c2-c71ca29dfe92
status: experimental
description: A successful DeleteSecret API call was observed for one secret. The audit entry alone does not prove the final resource state or malicious intent.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-secretmanager-post-exploitation.md
  - https://docs.cloud.google.com/secret-manager/docs/audit-logging
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: secretmanager.googleapis.com
    event.name: google.cloud.secretmanager.v1.SecretManagerService.DeleteSecret
    event.outcome: success
    secret.delete_invoked: true
  condition: selection
falsepositives:
  - Approved secret cleanup or migration.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: gcp-secret-delete-observed
