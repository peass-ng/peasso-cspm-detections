title: Kubernetes DaemonSet accepted with privileged host-root template
id: 2af2c7cc-c3cb-4a6c-b51d-20dad79e0f16
status: experimental
description: >-
  The API accepted a DaemonSet template with hostPID, a privileged container,
  and a writable mount of host root in that same container. This does not
  establish scheduling, execution, host access, persistence use, or intent.
x_hacktricks_technique_id: kubernetes-daemonset-privileged-host-root-template
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/kubernetes-security/kubernetes-persistence/workloads-and-gitops.md#L34
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/kubernetes-security/kubernetes-privilege-escalation/workload-and-pod-access.md#L108
  - https://kubernetes.io/docs/concepts/workloads/controllers/daemonset/
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    event.source: kubernetes.audit
    event.name: create
    event.outcome: success
    daemonset.privileged_host_root_spec_accepted: true
    daemonset.change_effect: admitted_spec
  condition: selection
falsepositives:
  - Approved node-level observability, storage, or diagnostics agent in an application namespace
level: high
