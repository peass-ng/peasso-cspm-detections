title: Namespace service account bound itself to cluster-admin
id: 9973186a-61ba-48a1-bc88-cdb44defa2d8
status: experimental
description: A completed Kubernetes create returned a namespaced RoleBinding whose cluster-admin roleRef names the same service account that made the request in that namespace. This records the binding, not whether it expanded effective permissions or whether the actor was malicious. A namespaced RoleBinding grants access within that namespace.
references:
  - https://kubernetes.io/docs/reference/kubernetes-api/rbac/role-binding-v1/
  - https://kubernetes.io/docs/reference/config-api/apiserver-audit.v1/
  - https://docs.cloud.google.com/kubernetes-engine/docs/how-to/audit-logging
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    event.source: kubernetes.audit
    event.name: create
    event.outcome: success
    rbac.role: cluster-admin
    rbac.self_namespace_service_account: true
  condition: selection
falsepositives:
  - Approved namespace bootstrap or emergency administration
level: high
tags:
  - attack.privilege_escalation
  - attack.persistence
x_hacktricks_technique_id: k8s-rbac-bind-rolebinding-namespace
