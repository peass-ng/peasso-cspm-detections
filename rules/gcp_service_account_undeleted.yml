title: GCP service account identity restored
id: 6e7947a7-e15b-4a13-8fa8-389646dd0289
status: experimental
description: A successful IAM Admin Activity record returned a restored service-account identity matching the requested unique ID and project. Review whether the recovery was approved and inspect current roles and credentials. This event alone does not prove privilege regain, usable credentials or malicious intent.
references:
  - https://docs.cloud.google.com/iam/docs/reference/rest/v1/projects.serviceAccounts/undelete
  - https://docs.cloud.google.com/iam/docs/service-accounts-delete-undelete
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-persistence/gcp-iam-persistence.md
logsource:
  product: gcp
  service: audit
detection:
  selection:
    cloud.provider: gcp
    event.source: iam.googleapis.com
    event.name: google.iam.admin.v1.UndeleteServiceAccount
    event.outcome: success
    identity.restore_observed: true
  condition: selection
falsepositives:
  - Approved account recovery
level: medium
tags:
  - attack.persistence
x_hacktricks_technique_id: gcp-service-account-undelete
