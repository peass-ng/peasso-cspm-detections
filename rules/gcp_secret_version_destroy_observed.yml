title: Secret Manager version destroy operation observed
id: 98385884-10d7-5780-bfd0-2850e05d4457
status: experimental
description: A successful DestroySecretVersion API call was observed for one version. Delayed destruction may leave the version recoverable; the audit entry does not prove final state or malicious intent.
references:
  - https://github.com/HackTricks-wiki/hacktricks-cloud/blob/fd9bf8863bf7a36de10b8695d366a53a9063c81c/src/pentesting-cloud/gcp-security/gcp-post-exploitation/gcp-secretmanager-post-exploitation.md
  - https://docs.cloud.google.com/secret-manager/docs/audit-logging
logsource:
  product: gcp
  service: audit
detection:
  selection:
    event.source: secretmanager.googleapis.com
    event.name: google.cloud.secretmanager.v1.SecretManagerService.DestroySecretVersion
    event.outcome: success
    secret.version_destroy_invoked: true
  condition: selection
falsepositives:
  - Approved secret rotation or owner-directed destruction.
level: medium
tags:
  - attack.impact
x_hacktricks_technique_id: gcp-secret-version-destroy-observed
